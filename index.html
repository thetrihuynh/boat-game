const wind = { angle: Math.random() * Math.PI * 2, strength: 0.7, target: 0, targetS: 0.7, changeT: 50 };

// ---------- day / night & weather ----------
const DAY_LEN = 360;   // seconds for a full day
// dayT: 0 midnight, 0.25 sunrise, 0.5 noon, 0.75 sunset. weather: clear | fog | storm
const env = { dayT: 0.3, weather: 'clear', sea: 1, fogK: 0, stormK: 0, flash: 0, lightningT: 8 };
function sunElev() { return Math.sin((env.dayT - 0.25) * Math.PI * 2); }
function nightK() { return clamp(-sunElev() * 2.5 + 0.2, 0, 1); }
function setWeather(w, quiet = false) {
  if (env.weather === w) return;
  env.weather = w;
  if (quiet) return;
  if (w === 'fog') announce('🌫 A thick fog rolls in — enemies stay hidden until close', 3);
  else if (w === 'storm') announce('⛈ A storm is breaking — heavy seas and wild shots!', 3);
  else announce('☀ The weather clears', 2);
}
function rollWeather(n, type) {
  const r = Math.random();
  if (type === 'kraken' || type === 'king') return r < 0.6 ? 'storm' : 'clear';
  if (n >= 4 && r < 0.2) return 'storm';
  if (n >= 3 && r < 0.38) return 'fog';

function waveBase(x, z, t) {

       + 0.30 * Math.sin((x + z) * 0.09 + t * 1.6)
       + 0.15 * Math.sin((x * 0.7 - z) * 0.17 - t * 2.1));
}

function updateOcean(t, cx, cz) {
  ocean.position.set(Math.round(cx / CELL) * CELL, 0, Math.round(cz / CELL) * CELL);
  const p = oceanGeo.attributes.position.array, c = oceanGeo.attributes.color.array;
  const ox = ocean.position.x, oz = ocean.position.z;
  for (let i = 0; i < p.length; i += 3) {
    const wx = oceanBase[i] + ox, wz = oceanBase[i + 2] + oz;
    const sh = shallowAt(wx, wz);
    const h = waveBase(wx, wz, t) * (1 - 0.6 * sh);
    p[i + 1] = h;
    const k = clamp((h + 1.45) / 2.9, 0, 1);
    let a, b, f;
    if (k < 0.72) { a = C_DEEP; b = C_MID; f = k / 0.72; } else { a = C_MID; b = C_CREST; f = (k - 0.72) / 0.28; }

      r += (sr - r) * m; g += (sg - g) * m; bl += (sb - bl) * m;

    c[i] = r; c[i + 1] = g; c[i + 2] = bl;
  }

  oceanGeo.attributes.color.needsUpdate = true;
}

  damage(amount, attacker, quiet = false, dot = false) {
    if (this.sinking || this.dead || this.remote) return;

    if (attacker && attacker.kind === 'p' && attacker.profile) dmgNum(this.pos, this.id, dealt, dot ? 'burn' : 'out', attacker.profile);
    if (this.kind === 'p' && this.profile) dmgNum(this.pos, this.id, dealt, dot ? 'burnIn' : 'in', this.profile);
    if (!dot) this.lastHitT = time;   // burning slows repairs but doesn't reset the repair timer
    if (attacker) this.lastHitBy = attacker;

  remove() {

    this.mesh.traverse(o => { if (o.material) [].concat(o.material).forEach(m => m.dispose()); });
    removeTag(this);

// The Kraken: a head that surfaces to be shot, and tentacles that burst up around its prey,
// sway, and slam down on ships. Damage to tentacles bleeds into the Kraken's own health.
class Kraken {
  constructor(x, z, hp) {
    Object.assign(this, { kind: 'k', id: 'kraken', isPlayer: false, name: '🐙 The Kraken', x, z, maxHp: hp, hp, dead: false, dying: false, sinking: false });
    this.tentacles = []; this.headUp = 0; this.headT = 9; this.spawnT = 1.5; this.surfaced = false; this.tSeq = 0; this.dieT = 0;
    this.skin = new THREE.MeshStandardMaterial({ color: 0x7a2c62, roughness: 0.55, flatShading: true });
    this.belly = new THREE.MeshStandardMaterial({ color: 0xd08aa8, roughness: 0.6, flatShading: true });
    this.head = new THREE.Group();
    const dome = new THREE.Mesh(new THREE.SphereGeometry(7, 14, 10), this.skin); dome.scale.set(1, 1.35, 1.15); dome.position.y = 4;
    const eyeM = new THREE.MeshStandardMaterial({ color: 0xffd040, emissive: 0xffa000, emissiveIntensity: 1.2 }), pupilM = new THREE.MeshBasicMaterial({ color: 0x000000 });
    for (const sx of [-3, 3]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(1.4, 10, 8), eyeM); eye.position.set(sx, 3.5, 6.6);
      const pu = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.8, 0.3), pupilM); pu.position.set(sx, 3.5, 7.9);
      this.head.add(eye, pu);
    }
    this.head.add(dome);
    this.head.traverse(o => { if (o.isMesh) o.castShadow = true; });
    this.head.position.set(x, -14, z);
    scene.add(this.head);
  }
  makeTentacle(id, x, z) {
    const root = new THREE.Group(); root.position.set(x, -18, z);
    let parent = root;
    const segs = [];
    for (let i = 0; i < 8; i++) {
      const r0 = 1.5 - i * 0.16, len = 2.3;
      const seg = new THREE.Group(); seg.position.y = i ? len : 0;
      const m = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(0.15, r0 - 0.16), Math.max(0.2, r0), len, 8), this.skin);
      m.position.y = len / 2; m.castShadow = true; seg.add(m);
      if (i < 7) { const su = new THREE.Mesh(new THREE.SphereGeometry(r0 * 0.45, 6, 4), this.belly); su.position.set(0, len * 0.5, r0 * 0.8); seg.add(su); }
      parent.add(seg); segs.push(seg); parent = seg;
    }
    scene.add(root);
    return { id, x, z, root, segs, state: 'warn', t: 0, hp: 1, maxHp: 1, yaw: rand(0, Math.PI * 2), slamYaw: 0, slamT: 2, phase: rand(0, 6), struck: false };
  }
  dropTentacle(k) {
    scene.remove(k.root);
    k.root.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  }
  dispose() {
    for (const k of this.tentacles) this.dropTentacle(k);
    this.tentacles = [];
    scene.remove(this.head);
    this.dead = true;
  }
  update(dt, t, host) {
    if (this.dead) return;
    if (this.dying) {
      this.dieT += dt;
      this.head.position.y -= dt * 4; this.head.rotation.z += dt * 0.3;
      for (const k of this.tentacles) { if (k.state !== 'gone') { k.state = 'sink'; } this.animTentacle(k, dt, t); }
      if (Math.random() < dt * 8) fx.explosion(new THREE.Vector3(this.x + rand(-8, 8), 2, this.z + rand(-8, 8)), 1.2);
      if (this.dieT > 4.5) this.dispose();
      return;
    }
    const tgt = nearestPlayerShip(this.x, this.z);
    if (host && tgt) {
      if (!this.surfaced) { this.x += (tgt.pos.x - this.x) * dt * 0.12; this.z += (tgt.pos.z - this.z) * dt * 0.12; }
      this.headT -= dt;
      if (this.headT <= 0) {
        this.surfaced = !this.surfaced;
        this.headT = this.surfaced ? 7 : 12;
        if (this.surfaced) {
          const a = rand(0, Math.PI * 2);
          this.x = tgt.pos.x + Math.sin(a) * 34; this.z = tgt.pos.z + Math.cos(a) * 34;
          fx.splash(new THREE.Vector3(this.x, 0, this.z)); sfx('boss', tgt.pos);
          notify('🐙 The Kraken surfaces — shoot its head!');
        }
      }
      this.spawnT -= dt;
      const live = this.tentacles.filter(k => k.state !== 'sink' && k.state !== 'gone').length;
      if (this.spawnT <= 0 && live < 4 + Math.min(3, Math.floor(profiles.size / 2))) {
        this.spawnT = rand(2.5, 4);
        const f = tgt.forward(), a = rand(0, Math.PI * 2), d = rand(8, 22);
        const x = tgt.pos.x + f.x * tgt.speed * 1.8 + Math.sin(a) * d, z = tgt.pos.z + f.z * tgt.speed * 1.8 + Math.cos(a) * d;
        const k = this.makeTentacle(++this.tSeq, x, z);
        k.hp = k.maxHp = Math.round((70 + 5 * wave) * DIFF.hp);
        this.tentacles.push(k);
        warnAt(x, z, 1.6, 0xb040ff);
      }
    }
    this.headUp += ((this.surfaced ? 1 : 0) - this.headUp) * Math.min(1, dt * 1.5);
    this.head.position.set(this.x, -14 + this.headUp * 13 + Math.sin(t) * 0.4 * this.headUp, this.z);
    if (tgt) this.head.rotation.y = Math.atan2(tgt.pos.x - this.x, tgt.pos.z - this.z);
    for (const k of this.tentacles) {
      if (host) this.thinkTentacle(k, dt);
      else k.t += dt;
      this.animTentacle(k, dt, t);
    }
    for (let i = this.tentacles.length - 1; i >= 0; i--) if (this.tentacles[i].state === 'gone') { this.dropTentacle(this.tentacles[i]); this.tentacles.splice(i, 1); }
  }
  thinkTentacle(k, dt) {
    k.t += dt;
    if (k.state === 'warn' && k.t > 1.6) {
      k.state = 'rise'; k.t = 0;
      fx.splash(new THREE.Vector3(k.x, 0, k.z)); sfx('splash', new THREE.Vector3(k.x, 0, k.z));
    } else if (k.state === 'rise' && k.t > 0.7) {
      k.state = 'idle'; k.t = 0;
      for (const s of ships) if (canHit(this, s) && Math.hypot(s.pos.x - k.x, s.pos.z - k.z) < 6 * s.scale) { s.damage(18 + wave, this); s.slowT = 3; }
    } else if (k.state === 'idle') {

      for (const s of ships) { if (!canHit(this, s)) continue; const d = Math.hypot(s.pos.x - k.x, s.pos.z - k.z); if (d < vd) { vd = d; v = s; } }

      else if (k.t > 8) { k.state = 'sink'; k.t = 0; }
    } else if (k.state === 'slam') {
      if (k.t > 0.75 && !k.struck) {
        k.struck = true;
        const ix = k.x + Math.sin(k.slamYaw) * 9, iz = k.z + Math.cos(k.slamYaw) * 9;
        for (const s of ships) if (canHit(this, s) && Math.hypot(s.pos.x - ix, s.pos.z - iz) < 7 * s.scale) { s.damage((22 + 1.2 * wave) * DIFF.dmg, this); s.slowT = 2.5; }
        fxHit(new THREE.Vector3(ix, 1, iz), 1.5); fx.splash(new THREE.Vector3(ix, 0, iz));
      } else if (k.t > 1.4) { k.state = 'idle'; k.t = 0; k.slamT = rand(2, 3.5); }
    } else if (k.state === 'sink' && k.t > 1.1) k.state = 'gone';
  }
  animTentacle(k, dt, t) {
    const S = k.state;
    let y = -18;
    if (S === 'warn') {
      if (Math.random() < dt * 18) P({ pos: new THREE.Vector3(k.x + rand(-3, 3), 0.2, k.z + rand(-3, 3)), vel: new THREE.Vector3(0, rand(2, 4), 0), color: 0xe8f6ff, size: 0.3, life: 0.6, basic: true });
    } else if (S === 'rise') y = -18 + Math.min(1, k.t / 0.7) * 17.5;
    else if (S === 'idle' || S === 'slam') y = -0.5 + waveHeight(k.x, k.z, t) * 0.5;
    else if (S === 'sink') y = -0.5 - Math.min(1, k.t / 1) * 18;
    k.root.position.set(k.x, y, k.z);
    const slam = S === 'slam' ? Math.min(1, k.t / 0.75) : 0;
    k.root.rotation.y = S === 'slam' ? k.slamYaw : k.yaw + Math.sin(t * 0.5 + k.phase) * 0.4;
    k.segs.forEach((seg, i) => {
      seg.rotation.x = slam > 0 ? slam * 0.32 : Math.sin(t * 2.2 + k.phase + i * 0.7) * 0.18 + 0.05;
      seg.rotation.z = slam > 0 ? 0 : Math.cos(t * 1.7 + k.phase + i * 0.5) * 0.18;
    });
  }
  hitTest(p) {
    if (this.dead || this.dying) return null;
    if (this.headUp > 0.6 && Math.hypot(p.x - this.x, p.y - (this.head.position.y + 4), p.z - this.z) < 8.5) return { head: true };
    for (const k of this.tentacles) {
      if ((k.state === 'idle' || k.state === 'slam' || k.state === 'rise') && p.y > -1 && p.y < 16 && Math.hypot(p.x - k.x, p.z - k.z) < 2.6) return { k };
    }

  }
  damage(part, amount, attacker) {
    if (this.dying || net.mode === 'guest') return;
    if (part.k) {
      part.k.hp -= amount; this.hp -= amount * 0.6;
      if (part.k.hp <= 0 && part.k.state !== 'sink') { part.k.state = 'sink'; part.k.t = 0; }
    } else this.hp -= amount * 1.5;

      const pos = part.k ? new THREE.Vector3(part.k.x, 8, part.k.z) : this.head.position.clone().setY(this.head.position.y + 8);

  die() {

    const killer = this.lastHitBy && this.lastHitBy.profile;

}

  const fits = (x, z, r, pad) => !specs.some(o => Math.hypot(o.x - x, o.z - z) < o.r + r + pad) && !reefs.some(o => Math.hypot(o.x - x, o.z - z) < o.r + r + 25);
  // inner archipelago near the start: channels and tall rocks to duck behind
  for (let i = 0; i < 9; i++) for (let k = 0; k < 40; k++) {
    const a = i / 9 * Math.PI * 2 + rng() * 0.5, d = 120 + rng() * 200, r = 7 + rng() * 13;
    const x = Math.sin(a) * d, z = Math.cos(a) * d;
    if (fits(x, z, r, 45)) { specs.push({ x, z, r, kind: rng() < 0.45 ? 'tall' : 'hill' }); break; }
  }
  // outer islands; a few carry forts
  let forts_ = 0;
  for (let i = 0; i < 18; i++) for (let k = 0; k < 40; k++) {
    const x = (rng() - 0.5) * 1300, z = (rng() - 0.5) * 1300, r = 9 + rng() * 18;
    if (Math.hypot(x, z) < 340 || !fits(x, z, r, 70)) continue;

    const x = Math.sin(a) * d, z = Math.cos(a) * d;

  }

  const jitter = (geo, amt, keepTop) => {
    const p = geo.attributes.position;
    const top = Math.max(...Array.from({ length: p.count }, (_, i) => p.getY(i)));
    for (let i = 0; i < p.count; i++) if (!keepTop || p.getY(i) < top - 0.01) { p.setX(i, p.getX(i) * (1 - amt + rng() * amt * 2)); p.setZ(i, p.getZ(i) * (1 - amt + rng() * amt * 2)); }

    return geo;
  };
  for (const sp of specs) {
    const { x, z, r, kind } = sp;
    const g = new THREE.Group(); g.position.set(x, 0, z);
    const sand = new THREE.Mesh(jitter(new THREE.CylinderGeometry(r * 1.05, r * 1.35, 3, 16), 0.08, false), sandM);
    sand.position.y = -0.4;
    g.add(sand);
    let hh = 1;
    if (kind === 'fort') {
      const plateau = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.9, r * 0.98, 1.2, 14), grassM);
      plateau.position.y = 1.4;
      g.add(plateau);
    } else if (kind === 'tall') {
      // craggy mountain: grassy skirt with a rocky peak — tall enough to hide a ship behind
      hh = r * (1.4 + rng() * 0.7);
      const skirt = new THREE.Mesh(jitter(new THREE.ConeGeometry(r * 0.9, hh * 0.45, 11, 2), 0.12, true), darkGrassM);
      skirt.position.y = 1 + hh * 0.225;
      const peak = new THREE.Mesh(jitter(new THREE.ConeGeometry(r * 0.62, hh, 9, 4), 0.22, true), cliffM);
      peak.position.set(rng() * 2 - 1, 1 + hh / 2, rng() * 2 - 1);
      g.add(skirt, peak);
    } else {
      hh = r * (0.5 + rng() * 0.45);
      const hill = new THREE.Mesh(jitter(new THREE.ConeGeometry(r * 0.82, hh, 10, 3), 0.15, true), grassM);
      hill.position.y = 1 + hh / 2;
      g.add(hill);
      if (rng() < 0.45) {   // fisherman's hut
        const a = rng() * Math.PI * 2, hut = new THREE.Group();
        hut.position.set(Math.sin(a) * r * 0.75, 1.1, Math.cos(a) * r * 0.75); hut.rotation.y = a;
        const body = new THREE.Mesh(new THREE.BoxGeometry(3, 2.2, 3), woodM); body.position.y = 1.1;
        const roof = new THREE.Mesh(new THREE.ConeGeometry(2.6, 1.8, 4), roofM); roof.position.y = 3.1; roof.rotation.y = Math.PI / 4;
        hut.add(body, roof); g.add(hut);
      }
    }
    for (let i = 0, nr = 4 + Math.floor(rng() * 4); i < nr; i++) {
      const a = rng() * Math.PI * 2, rs = r * (0.12 + rng() * 0.2), d = r * (1.05 + rng() * 0.35);
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(rs, 0), rockM);
      rock.position.set(Math.sin(a) * d, 0.2, Math.cos(a) * d);
      rock.rotation.set(rng() * 3, rng() * 3, rng() * 3);
      g.add(rock);
    }
    const palms = kind === 'tall' ? 1 + Math.floor(rng() * 2) : 2 + Math.floor(rng() * 3);
    for (let i = 0; i < palms; i++) {
      const a = rng() * Math.PI * 2;
      const palm = new THREE.Group();
      palm.position.set(Math.sin(a) * r * 0.9, 1, Math.cos(a) * r * 0.9);
      palm.rotation.set((rng() - 0.5) * 0.4, rng() * 6, (rng() - 0.5) * 0.4);
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 7, 6), trunkM); trunk.position.y = 3.5;
      palm.add(trunk);
      for (let k = 0; k < 6; k++) {
        const la = k / 6 * Math.PI * 2;
        const leaf = new THREE.Mesh(new THREE.BoxGeometry(1, 0.1, 3.8), leafM);
        leaf.position.set(Math.sin(la) * 1.6, 7, Math.cos(la) * 1.6);

      }
      g.add(palm);
    }
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(g);
    const isl = { x, z, r: r * 1.2, h: kind === 'fort' ? 2 : hh + 1, kind };
    isl.shallowR = isl.r + 14 + isl.r * 0.6;
    islands.push(isl);
    paintShallow(x, z, isl.r, isl.shallowR, 1);
    if (kind === 'fort') forts.push(new Fort(isl, forts.length, clamp(r * 0.55, 5.5, 9)));
  }
  // reefs: a few overlapping shallow blobs and rocks breaking the surface
  for (const rf of reefs) {
    for (let b = 0; b < 4; b++) {
      const a = rng() * Math.PI * 2, o = rng() * rf.r * 0.4, rr = rf.r * (0.55 + rng() * 0.3);
      paintShallow(rf.x + Math.sin(a) * o, rf.z + Math.cos(a) * o, rr * 0.6, rr + 10, 0.85);
    }
    rf.rocks = [];
    for (let i = 0, n = 10 + Math.floor(rng() * 8); i < n; i++) {
      const a = rng() * Math.PI * 2, d = Math.sqrt(rng()) * rf.r * 0.9;
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7 + rng() * 1.6, 0), reefRockM);
      rock.position.set(rf.x + Math.sin(a) * d, -0.2 + rng() * 0.7, rf.z + Math.cos(a) * d);
      rf.rocks.push([rock.position.x, rock.position.z]);
      rock.rotation.set(rng() * 3, rng() * 3, rng() * 3);
      rock.castShadow = true;
      scene.add(rock);
    }
  }
}

// Pre-render a chart of the sea from the real terrain: depth shading from the shallow-water
// field, then beaches, grass, rocky peaks and reef rocks drawn on top.
const CHART_PX = SH_N * 2;
const chart = (() => {
  const lo = document.createElement('canvas'); lo.width = lo.height = SH_N;
  const lctx = lo.getContext('2d'), img = lctx.createImageData(SH_N, SH_N);
  const deep = [14, 62, 104], shal = [60, 200, 192], beach = [166, 230, 207];
  for (let k = 0; k < SH_N * SH_N; k++) {
    const sh = shallowGrid[k], q = clamp((sh - 0.55) / 0.45, 0, 1);
    for (let c = 0; c < 3; c++) {
      const sc = shal[c] + (beach[c] - shal[c]) * q;
      img.data[k * 4 + c] = deep[c] + (sc - deep[c]) * Math.min(1, sh * 1.15);
    }
    img.data[k * 4 + 3] = 255;
  }
  lctx.putImageData(img, 0, 0);
  const cv = document.createElement('canvas'); cv.width = cv.height = CHART_PX;
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = true;
  g.drawImage(lo, 0, 0, CHART_PX, CHART_PX);
  const k = CHART_PX / (SH_HALF * 2), P = (v) => (v + SH_HALF) * k;
  const disc = (x, z, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(P(x), P(z), Math.max(1, r * k), 0, Math.PI * 2); g.fill(); };
  for (const rf of reefs) {
    g.strokeStyle = 'rgba(166,230,207,.55)'; g.setLineDash([3, 3]); g.lineWidth = 1;
    g.beginPath(); g.arc(P(rf.x), P(rf.z), (rf.r + 4) * k, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
    for (const [x, z] of rf.rocks) disc(x, z, 1.6, '#3e4a46');
  }
  for (const isl of islands) {
    disc(isl.x, isl.z, isl.r, '#e6cf8f');
    if (isl.kind === 'tall') { disc(isl.x, isl.z, isl.r * 0.78, '#2f7535'); disc(isl.x, isl.z, isl.r * 0.5, '#8d877b'); disc(isl.x, isl.z, isl.r * 0.2, '#b8b2a6'); }
    else disc(isl.x, isl.z, isl.r * 0.75, '#3f8f3a');
    g.strokeStyle = 'rgba(60,40,20,.6)'; g.lineWidth = 1;
    g.beginPath(); g.arc(P(isl.x), P(isl.z), isl.r * k, 0, Math.PI * 2); g.stroke();
  }
  return cv;
})();

// Draw the chart plus live markers. h = heading that points "up" (minimap rotates with the ship).
function drawChart(ctx, W, cx, cz, S, h, rim) {
  const R = W / 2, cs = Math.cos(h), sn = Math.sin(h);
  const a = -S * cs, c = S * sn, b = -S * sn, d = -S * cs, e = R - a * cx - c * cz, f = R - b * cx - d * cz;
  const toScreen = (x, z) => [a * x + c * z + e, b * x + d * z + f];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0e3e68'; ctx.fillRect(0, 0, W, W);
  ctx.save();
  if (rim) { ctx.beginPath(); ctx.arc(R, R, R - 1, 0, Math.PI * 2); ctx.clip(); }
  ctx.setTransform(a, b, c, d, e, f);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(chart, -SH_HALF, -SH_HALF, SH_HALF * 2, SH_HALF * 2);
  // live markers are drawn in screen space so they stay crisp
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const fo of forts) {
    const [x, y] = toScreen(fo.x, fo.z);
    ctx.fillStyle = fo.destroyed ? '#666' : '#ff8a20'; ctx.strokeStyle = '#2a1606'; ctx.lineWidth = 1.5;
    ctx.fillRect(x - 4.5, y - 4.5, 9, 9); ctx.strokeRect(x - 4.5, y - 4.5, 9, 9);
  }
  ctx.fillStyle = '#ffd34d';
  for (const cr of crates) { const [x, y] = toScreen(cr.x, cr.z); ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#ff3020';
  for (const kg of kegs) { const [x, y] = toScreen(kg.x, kg.z); ctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
  const arrow = (s, col, size) => {
    const [x, y] = toScreen(s.pos.x, s.pos.z);
    const f = s.forward(), [tx, ty] = toScreen(s.pos.x + f.x, s.pos.z + f.z);
    const ang = Math.atan2(ty - y, tx - x);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(size, 0); ctx.lineTo(-size * 0.75, size * 0.6); ctx.lineTo(-size * 0.4, 0); ctx.lineTo(-size * 0.75, -size * 0.6); ctx.closePath();
    ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
    return [x, y];
  };
  const offscreen = [];
  for (const s of ships) {
    if (s === me || s.dead) continue;
    const col = s.sinking ? '#555' : s.role === 'convoy' ? '#ffffff' : s.role === 'merchant' ? '#ffd700' : s.kind === 'a' ? '#6fe07a' : s.kind === 'p' ? (gameMode === 'pvp' ? '#ff4a3a' : PLAYER_CSS[s.colorIdx % 4])
      : s.role === 'flag' ? '#ffc040' : s.role === 'fireship' ? '#ff9a20' : s.kind === 'b' ? '#ff2020' : '#ff4a3a';
    if (teamOf(s) === 'E' && env.fogK > 0.5 && me && Math.hypot(s.pos.x - me.pos.x, s.pos.z - me.pos.z) > 150) continue;   // lost in the fog
    const [x, y] = arrow(s, col, s.kind === 'b' ? 9 : 5.5 * Math.max(0.85, s.scale));
    if (rim && Math.hypot(x - R, y - R) > R - 6 && teamOf(s) === 'E' && !s.sinking) offscreen.push([x, y, col]);
  }
  // objective and Kraken markers
  const trc = myTreasure();
  if (trc) {
    const [x, y] = toScreen(trc.x, trc.z);
    ctx.strokeStyle = '#ff2020'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - 5, y - 5); ctx.lineTo(x + 5, y + 5); ctx.moveTo(x + 5, y - 5); ctx.lineTo(x - 5, y + 5); ctx.stroke();
  }
  const om = objective.marker;
  if (om) {
    const [x, y] = toScreen(om[0], om[1]), pulse = 1 + 0.15 * Math.sin(time * 4);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = om[2] === 'harbor' ? '#40ff80' : om[2] === 'fort' ? '#ff4040' : om[2] === 'kraken' ? '#c060ff' : '#ffd700';
    ctx.beginPath(); ctx.arc(x, y, 9 * pulse, 0, Math.PI * 2); ctx.stroke();
    if (om[2] === 'harbor') { ctx.fillStyle = '#40ff80'; ctx.font = 'bold 12px Georgia'; ctx.textAlign = 'center'; ctx.fillText('⚓', x, y + 4); }
  }
  if (kraken && !kraken.dead) {
    ctx.fillStyle = '#c060ff';
    for (const k of kraken.tentacles) { const [x, y] = toScreen(k.x, k.z); ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill(); }
  }
  if (me) arrow(me, '#ffffff', 7.5);
  if (rim) {
    // range ring (about max cannon range) and markers on the rim for enemies beyond the map
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(R, R, 100 * S, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    for (const [x, y, col] of offscreen) {
      const ang = Math.atan2(y - R, x - R), px = R + Math.cos(ang) * (R - 7), py = R + Math.sin(ang) * (R - 7);
      ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-3, 4); ctx.lineTo(-3, -4); ctx.closePath();
      ctx.fillStyle = col; ctx.fill(); ctx.restore();
    }
  }
  ctx.restore();
}

//  Particles / effects

const particles = [];
const P_GEO = new THREE.IcosahedronGeometry(1, 0);
const BOX_GEO = new THREE.BoxGeometry(1, 0.4, 0.4);
function P({ pos, vel = new THREE.Vector3(), color, size = 0.5, life = 1, grow = 0, gravity = 0, drag = 0, opacity = 1, basic = false, box = false, windy = false }) {
  if (particles.length > 900) return;
  const mat = basic
    ? new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false })
    : new THREE.MeshLambertMaterial({ color, transparent: true, opacity, depthWrite: false });
  const m = new THREE.Mesh(box ? BOX_GEO : P_GEO, mat);
  m.position.copy(pos);
  m.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
  m.scale.setScalar(size);
  scene.add(m);
  particles.push({ m, vel: vel.clone(), life, max: life, grow, gravity, drag, opacity, size, spin: box ? rand(-8, 8) : 0, windy });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.m); p.m.material.dispose();
      particles[i] = particles[particles.length - 1]; particles.pop();
      continue;
    }
    p.vel.y -= p.gravity * dt;
    if (p.drag) p.vel.multiplyScalar(Math.max(0, 1 - p.drag * dt));
    p.m.position.addScaledVector(p.vel, dt);
    if (p.windy) { const w = 3.5 * wind.strength * dt; p.m.position.x += Math.sin(wind.angle) * w; p.m.position.z += Math.cos(wind.angle) * w; }
    p.size += p.grow * dt;
    p.m.scale.setScalar(Math.max(0.01, p.size));
    if (p.spin) { p.m.rotation.x += p.spin * dt; p.m.rotation.y += p.spin * dt * 0.7; }
    p.m.material.opacity = p.opacity * Math.min(1, (p.life / p.max) * 1.6);
  }
}
const fx = {

// faint streaks on the water that show the wind
const STREAKS = 70;
const streakMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.22, 7).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, depthWrite: false, fog: true }), STREAKS);
streakMesh.frustumCulled = false;
const streaks = Array.from({ length: STREAKS }, () => ({ x: rand(-130, 130), z: rand(-130, 130), ph: rand(0, 6) }));
scene.add(streakMesh);
const _sm = new THREE.Matrix4(), _sq = new THREE.Quaternion(), _sv = new THREE.Vector3(), _ss = new THREE.Vector3();
function updateStreaks(dt, t, focus) {
  const sp = 6 + 10 * wind.strength, wx = Math.sin(wind.angle), wz = Math.cos(wind.angle);
  _sq.setFromAxisAngle(UP, wind.angle);
  streakMesh.material.opacity = (0.08 + 0.2 * wind.strength) * (1 - 0.75 * nightK());
  streaks.forEach((st, i) => {
    st.x += wx * sp * dt; st.z += wz * sp * dt;
    let dx = st.x - focus.x, dz = st.z - focus.z;
    if (Math.abs(dx) > 130) st.x -= Math.sign(dx) * 260;
    if (Math.abs(dz) > 130) st.z -= Math.sign(dz) * 260;
    const fade = 0.5 + 0.5 * Math.sin(t * 0.8 + st.ph);
    _sv.set(st.x, waveHeight(st.x, st.z, t) + 0.12, st.z);
    _ss.set(1, 1, 0.4 + fade * (0.6 + wind.strength));
    streakMesh.setMatrixAt(i, _sm.compose(_sv, _sq, _ss));
  });
  streakMesh.instanceMatrix.needsUpdate = true;
}

// objective beacon: a glowing ring + pole at the convoy's harbour or around the besieged fort
const beacon = new THREE.Group();

const balls = [];
const BALL_GEO = new THREE.SphereGeometry(0.3, 8, 6);
const BALL_MAT = new THREE.MeshStandardMaterial({ color: 0x151515, metalness: 0.6, roughness: 0.4 });
const AMMO_MATS = {
  chain: new THREE.MeshStandardMaterial({ color: 0x8fa3b5, metalness: 0.8, roughness: 0.3 }),
  fire: new THREE.MeshStandardMaterial({ color: 0xff7a10, emissive: 0xff5000, emissiveIntensity: 1.5 }),
  explosive: new THREE.MeshStandardMaterial({ color: 0x220a0a, emissive: 0xaa1010, emissiveIntensity: 0.8 }),
};
const AMMO_IDS = ['round', 'chain', 'fire', 'explosive'];
function spawnBall(pos, vel, owner, opts = {}) {
  const ammo = opts.ammo || 'round';
  const m = new THREE.Mesh(BALL_GEO, AMMO_MATS[ammo] || BALL_MAT);
  if (ammo === 'explosive') m.scale.setScalar(1.3);
  m.position.copy(pos);
  m.castShadow = true;
  if (opts.aoe) m.scale.setScalar(1.8);
  scene.add(m);
  balls.push({ m, vel, owner, life: 0, trailT: 0, dmg: opts.dmg || 10, aoe: opts.aoe || 0, ammo, ox: pos.x, oz: pos.z, missed: null, base: opts.base || opts.dmg || 10 });
  emit(['b', r2(pos.x), r2(pos.y), r2(pos.z), r2(vel.x), r2(vel.y), r2(vel.z), owner ? owner.id : '', opts.aoe || 0, AMMO_IDS.indexOf(ammo)]);
}
function removeBall(i) { scene.remove(balls[i].m); balls[i] = balls[balls.length - 1]; balls.pop(); }
function hitShip(s, p) {
  const sc = s.scale;
  const dx = p.x - s.pos.x, dz = p.z - s.pos.z;
  if (dx * dx + dz * dz > 100 * sc * sc) return false;
  const ly = (p.y - s.pos.y) / sc;
  if (ly < -1.3 || ly > 3.4) return false;
  const c = Math.cos(s.heading), n = Math.sin(s.heading);
  const lx = (dx * c - dz * n) / sc, lz = (dx * n + dz * c) / sc;
  if (lz < -6.4 || lz > 7.6) return false;
  const halfW = lz > 1 ? 2.3 * Math.max(0.15, 1 - (lz - 1) / 6.6) : 2.3;
  return Math.abs(lx) < halfW + 0.35;
}
// special ammo effects on a hull hit (host only)
function shotEffects(b, s, p) {
  if (b.ammo === 'chain') s.slowT = 6;
  if (b.ammo === 'fire') applyBurn(s, 1, b.base * 0.15, b.owner);
  if (b.ammo === 'explosive') {
    for (const o of ships) if (o !== s && canHit(b.owner, o) && Math.hypot(o.pos.x - p.x, o.pos.z - p.z) < 7 * o.scale) o.damage(b.dmg * 0.5, b.owner);
  }
}
// Burning: each stack deals perStack damage per second in half-second ticks for 6s (refreshed by
// new hits, max 5 stacks). Burning ships repair at 30% speed instead of not at all.
const BURN_TIME = 6, BURN_MAX = 5, BURN_TICK = 0.5;
function applyBurn(s, stacks, perStack, by) {
  if (!isAlive(s)) return;
  const active = s.burnT > 0;
  s.burnStacks = Math.min(BURN_MAX, (active ? s.burnStacks : 0) + stacks);
  s.burnDps = Math.max(active ? s.burnDps : 0, perStack);
  s.burnT = BURN_TIME;
  s.burnBy = by;
}
function teamOf(s) { return s.kind === 'p' || s.kind === 'a' ? 'P' : 'E'; }
function canHit(owner, t) {
  if (!owner || t === owner || t.dead || t.sinking || t === menuShip) return false;
  if (teamOf(owner) !== teamOf(t)) return true;
  return gameMode === 'pvp' && owner.kind === 'p' && t.kind === 'p';
}
function updateBalls(dt, t, host) {
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.vel.y -= G * dt;
    b.m.position.addScaledVector(b.vel, dt);
    b.life += dt;
    b.trailT -= dt;
    if (b.trailT <= 0) { b.trailT = 0.04; b.ammo === 'fire' ? fx.fire(b.m.position) : fx.trail(b.m.position); }
    const p = b.m.position;
    let done = false;
    if (host && !b.aoe) {
      for (const s of ships) {
        if (canHit(b.owner, s) && hitShip(s, p)) {
          if (b.missed && b.missed.has(s)) continue;
          if (s.dodge && Math.random() < s.dodge) { (b.missed = b.missed || new Set()).add(s); continue; }   // nimble sloop: shot skims past
          let dmg = b.dmg;
          if (b.owner.longShot) {
            if (Math.hypot(p.x - b.ox, p.z - b.oz) > 60) dmg *= 1.25;
            if (s.role === 'fireship') dmg *= 2;
          }
          s.damage(dmg, b.owner);
          shotEffects(b, s, p);
          fxHit(p, b.ammo === 'explosive' ? 1.6 : 1);
          if (b.owner.kind === 'p' && b.owner.profile) notify('Direct hit!', b.owner.profile);
          done = true; break;
        }
      }
      if (!done && b.owner && b.owner.kind === 'p') {
        for (const f of forts) if (f.hit(p)) {
          f.damage(b.dmg, b.owner);
          fxHit(p, 1);
          if (b.owner.profile) notify('Fort hit!', b.owner.profile);
          done = true; break;
        }
      }
    }
    if (!done && host && kraken && !b.aoe && b.owner && teamOf(b.owner) === 'P') {
      const part = kraken.hitTest(p);
      if (part) {
        kraken.damage(part, b.dmg, b.owner); fxHit(p, 1);
        if (b.owner.kind === 'p' && b.owner.profile) notify(part.head ? '🎯 Hit the Kraken’s head!' : 'Tentacle hit!', b.owner.profile);
        done = true;
      }
    }
    if (!done) {
      for (const isl of islands) {
        if (b.owner && b.owner.isl === isl) continue;
        const d = Math.hypot(p.x - isl.x, p.z - isl.z);
        if (d < isl.r && p.y < isl.h * (1 - d / isl.r) + 1.5) { fx.dust(p.clone()); sfx('thud', p); done = true; break; }
      }
    }
    if (!done && p.y < waveHeight(p.x, p.z, t)) {
      if (b.aoe) {
        fx.explosion(p.clone(), 1.3); fx.splash(p.clone()); sfx('hit', p);
        if (host) for (const s of ships) {
          if (canHit(b.owner, s) && Math.hypot(s.pos.x - p.x, s.pos.z - p.z) < b.aoe + 3 * s.scale) s.damage(b.dmg, b.owner);
        }
        if (host && kraken && b.owner && teamOf(b.owner) === 'P') for (const k of kraken.tentacles) if (Math.hypot(k.x - p.x, k.z - p.z) < b.aoe + 2) kraken.damage({ k }, b.dmg, b.owner);
      } else { fx.splash(p.clone()); sfx('splash', p); }
      done = true;
    }
    if (done || b.life > 8) removeBall(i);
  }
}

// ============================================================
//  Collisions (host only)
// ============================================================
function collisions() {
  const live = ships.filter(isAlive);
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
    const a = live[i], b = live[j];
    const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), R = 4.5 * (a.scale + b.scale);
    if (d < R && d > 0.001) {
      const push = (R - d) / 2, nx = dx / d, nz = dz / d;
      a.pos.x -= nx * push; a.pos.z -= nz * push; b.pos.x += nx * push; b.pos.z += nz * push;
      if (a.role === 'fireship' || b.role === 'fireship') { fireshipExplode(a.role === 'fireship' ? a : b, null); continue; }
      const impact = (a.speed + b.speed) * 0.5;
      const friendly = teamOf(a) === teamOf(b) && !(gameMode === 'pvp' && a.kind === 'p' && b.kind === 'p');
      if (!friendly && impact > 4 && a.bumpCd <= 0 && b.bumpCd <= 0) {
        a.damage(impact * 0.8 / a.scale, b); b.damage(impact * 0.8 / b.scale, a);
        a.bumpCd = b.bumpCd = 1.5;
        fxHit(a.pos.clone().add(b.pos).multiplyScalar(0.5).setY(1.5), 0.6);
      }
      a.speed *= 0.97; b.speed *= 0.97;
    }
  }
  for (const s of live) for (const isl of islands) {
    const dx = s.pos.x - isl.x, dz = s.pos.z - isl.z, d = Math.hypot(dx, dz), R = isl.r + 3 * s.scale;
    if (d < R) {
      if (s.role === 'fireship') { fireshipExplode(s, null); break; }
      s.pos.x = isl.x + dx / d * R; s.pos.z = isl.z + dz / d * R;
      if (s.speed > 5 && s.bumpCd <= 0) { s.damage(s.speed * 0.8, null); s.bumpCd = 1.5; sfx('thud', s.pos); fx.dust(s.local(0, 1, 7)); }
      s.speed *= 0.9;
    }
  }
}

// ============================================================
//  Enemy AI (host only)
// ============================================================
function nearestPlayerShip(x, z, maxD = Infinity) { return nearestOfTeam('P', x, z, maxD); }
function nearestOfTeam(team, x, z, maxD = Infinity) {
  let best = null, bd = maxD;
  for (const s of ships) {
    if (teamOf(s) !== team || !isAlive(s) || s === menuShip || s.smokeT > 0) continue;
    const d = Math.hypot(s.pos.x - x, s.pos.z - z);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}

// Fleet coordination: a shared focus target, a rotating "ring" the line ships hold around it,
// the flagship's reload aura, and morale collapse when the flagship sinks.
const fleet = { angle: 0, target: null, retargetT: 0, brokenT: 0, flag: null };
function updateFleet(dt) {
  fleet.angle += dt * 0.06;
  fleet.brokenT = Math.max(0, fleet.brokenT - dt);
  fleet.retargetT -= dt;
  const foes = ships.filter(s => teamOf(s) === 'E' && isAlive(s));
  if (!foes.length) return;
  if (fleet.retargetT <= 0 || !isAlive(fleet.target) || fleet.target.smokeT > 0) {
    fleet.retargetT = 5;
    const c = new THREE.Vector3();
    foes.forEach(f => c.add(f.pos)); c.divideScalar(foes.length);
    let best = null, bs = Infinity;
    for (const s of ships) {
      if (teamOf(s) !== 'P' || !isAlive(s) || s === menuShip || s.smokeT > 0) continue;
      // focus the weakest nearby captain; escorts are a lower priority
      const score = (s.hp / s.maxHp) * 120 + Math.hypot(s.pos.x - c.x, s.pos.z - c.z) * 0.5 + (s.role === 'convoy' ? -90 : s.kind === 'a' ? 60 : 0);
      if (score < bs) { bs = score; best = s; }
    }
    fleet.target = best;
  }
  // fairness: only a handful of ships press the attack on the focus target; the rest wait on an outer ring
  const slots = Math.max(2, Math.min(5, 3 + Math.floor(wave / 4)) + 2 * Math.max(0, profiles.size - 1) + DIFF.slots);
  const t = fleet.target;
  const brawlers = foes.filter(e => e.role !== 'fireship' && e.role !== 'ketch' && e.role !== 'merchant' && e.kind !== 'b');
  if (t) brawlers.sort((a, b) => Math.hypot(a.pos.x - t.pos.x, a.pos.z - t.pos.z) - Math.hypot(b.pos.x - t.pos.x, b.pos.z - t.pos.z));
  brawlers.forEach((e, i) => { e.engaged = i < slots; });
  fleet.flag = foes.find(s => s.role === 'flag') || null;
  for (const e of foes) {
    let m = 1;
    if (fleet.flag && e !== fleet.flag && Math.hypot(e.pos.x - fleet.flag.pos.x, e.pos.z - fleet.flag.pos.z) < 80) m *= 1.35;
    if (fleet.brokenT > 0) m *= 0.65;
    e.reloadMul = m;
  }
}

// tall land between two points blocks a flat cannon shot
function losBlocked(ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz || 1;
  for (const isl of islands) {
    if (isl.h < 4) continue;
    const u = ((isl.x - ax) * dx + (isl.z - az) * dz) / L2;
    if (u <= 0.05 || u >= 0.95) continue;
    const px = ax + dx * u - isl.x, pz = az + dz * u - isl.z;
    if (px * px + pz * pz < (isl.r * 0.85) ** 2) return true;
  }
  return false;
}

// telegraphed mortar barrage (boss and bomb ketches) — arcs right over islands
function enemyMortar(e, tgt, n, spread, dmg, T = 2.6, err = 0) {
  const tf = tgt.forward(), ea = rand(0, Math.PI * 2), ed = err ? rand(err * 0.5, err) : 0;   // err: how far off the whole volley lands
  const cx = tgt.pos.x + tf.x * tgt.speed * T * 0.85 + Math.sin(ea) * ed, cz = tgt.pos.z + tf.z * tgt.speed * T * 0.85 + Math.cos(ea) * ed;
  for (let i = 0; i < n; i++) {
    const exact = i === 0 && !err;
    const tx = cx + (exact ? 0 : rand(-spread, spread)), tz = cz + (exact ? 0 : rand(-spread, spread));
    const delay = i * 0.18;
    warnAt(tx, tz, T + delay);
    after(delay, () => {
      if (!isAlive(e)) return;
      const from = e.local(0, 4, -2);
      const vel = new THREE.Vector3((tx - from.x) / T, (0 - from.y + 0.5 * G * T * T) / T, (tz - from.z) / T);
      spawnBall(from, vel, e, { aoe: 7, dmg });
      fx.muzzle(from, vel.clone().normalize());
      sfx('cannon', from);
    });
  }
}

// A fireship goes up when it rams anything or is shot. The blast hurts EVERY ship nearby
// (enemies included) and sets them burning; if a player shot it, they get the credit.
function fireshipExplode(e, by = null) {
  if (e.exploded) return;
  e.exploded = true;
  const p = e.pos.clone().setY(1.5), R = 22, blast = e.dmg * 3.5;
  fxHit(p, 4);
  for (let i = 0; i < 4; i++) after(0.08 * (i + 1), () => fx.explosion(p.clone().add(rv(6).setY(rand(0, 4))), 2.2));
  shockwave(p, R);
  sfx('boom', p);
  if (me && me.pos.distanceTo(p) < 70) shake = Math.min(2, shake + 1.2 * (1 - me.pos.distanceTo(p) / 70));
  for (const s of ships) {
    if (s === e || !isAlive(s)) continue;
    const d = Math.hypot(s.pos.x - p.x, s.pos.z - p.z);
    if (d > R + 4 * s.scale) continue;
    const fall = clamp(1 - d / (R + 4 * s.scale), 0, 1);
    s.damage(blast * (0.4 + 0.6 * fall), by || e);
    applyBurn(s, 2, e.dmg * 0.3, by || e);
  }
  e.selfDestruct = !by;   // shot down by a player: they earn the bounty
  if (by) e.lastHitBy = by;
  e.hp = 0;
  e.startSinking();
}

// steer away from land, and (for deep hulls) shallows and reefs
function avoidObstacles(e, desired) {
  const sc = e.scale, deep = sc >= 0.95;
  const check = (x, z, R) => {
    const ix = x - e.pos.x, iz = z - e.pos.z, d = Math.hypot(ix, iz);
    if (d < R) {

      if (Math.abs(diff) < 1.3) desired = a - Math.sign(diff || 1) * 1.7;

  for (const isl of islands) check(isl.x, isl.z, (deep ? isl.r + (isl.shallowR - isl.r) * 0.55 : isl.r) + 22 * sc);
  if (deep) for (const rf of reefs) check(rf.x, rf.z, rf.r + 6 + 22 * sc);
  return desired;
}

function updateAI(e, dt) {
  if (!isAlive(e)) return;
  if (e.grappled) { e.steer = 0; e.sail = 0; return; }   // locked in a boarding action
  if (e.role === 'merchant' || e.role === 'convoy') {
    let desired = Math.atan2(e.goal.x - e.pos.x, e.goal.z - e.pos.z);
    if (e.role === 'merchant') {   // the treasure galleon veers away from pirates closing in
      const th = nearestPlayerShip(e.pos.x, e.pos.z, 70);
      if (th) desired += angDiff(Math.atan2(e.pos.x - th.pos.x, e.pos.z - th.pos.z), desired) * 0.35;
    }
    e.sail = e.role === 'convoy' || (e.role === 'merchant' && time - e.lastHitT > 10 && !nearestPlayerShip(e.pos.x, e.pos.z, 90)) ? 2 / 3 : 1;
    e.steer = clamp(angDiff(avoidObstacles(e, desired), e.heading) * 2, -1, 1);
    return;
  }
  const sc = e.scale, ally = e.kind === 'a', role = e.role || 'line';
  let tgt;
  if (ally) tgt = e.fleetEntry ? fleetTarget(e, e.ownerProf && isAlive(e.ownerProf.ship) ? e.ownerProf.ship : null) : nearestOfTeam('E', e.pos.x, e.pos.z, 220);
  else {
    tgt = isAlive(fleet.target) && !(fleet.target.smokeT > 0) ? fleet.target : nearestPlayerShip(e.pos.x, e.pos.z);
    const near = role !== 'fireship' && nearestPlayerShip(e.pos.x, e.pos.z, 40 * sc);   // fight back at close range
    if (near) tgt = near;
  }
  if (!ally && e.guard) {
    const g = e.guard;
    if (!isAlive(g) || g.kind !== 'e' || time - e.lastHitT < 8 || time - g.lastHitT < 8 || (tgt && Math.hypot(tgt.pos.x - g.pos.x, tgt.pos.z - g.pos.z) < 110)) e.guard = null;   // break formation and fight
    else {
      const sa = g.heading + e.guardA, px = g.pos.x + Math.sin(sa) * e.guardD, pz = g.pos.z + Math.cos(sa) * e.guardD;
      const dd = Math.hypot(px - e.pos.x, pz - e.pos.z);
      let want = dd > 8 ? Math.atan2(px - e.pos.x, pz - e.pos.z) : g.heading;
      e.sail = dd > 30 ? 1 : dd > 10 ? 2 / 3 : 1 / 3;
      e.steer = clamp(angDiff(avoidObstacles(e, want), e.heading) * 2, -1, 1);

    }

  let desired, dx = 0, dz = 0, dist = Infinity, blocked = false;
  const lead = ally && e.ownerProf && isAlive(e.ownerProf.ship) ? e.ownerProf.ship : null;
  if (!tgt && lead) {

    const f = lead.forward(), side = e.station || 1;
    let px = lead.pos.x - f.x * 18 + f.z * 22 * side, pz = lead.pos.z - f.z * 18 - f.x * 22 * side;
    if (e.fleetEntry) [px, pz] = fleetSlotPos(lead, e.slot | 0, e.ownerProf.order === 'hold' ? 45 : 0);
    const dd = Math.hypot(px - e.pos.x, pz - e.pos.z);
    desired = dd > 8 ? Math.atan2(px - e.pos.x, pz - e.pos.z) : lead.heading;
    e.sail = dd > 40 ? 1 : dd > 12 ? 2 / 3 : clamp(lead.sail, 1 / 3, 1);

      const f = tgt.forward(), T = Math.min(3, dist / Math.max(4, e.speed));
      desired = Math.atan2(tgt.pos.x + f.x * tgt.speed * T - e.pos.x, tgt.pos.z + f.z * tgt.speed * T - e.pos.z);

      if (dist < 6 * (sc + tgt.scale)) { fireshipExplode(e, null); return; }
    } else {
      // take up a station around the target according to role
      let slot;
      if (ally) slot = Math.atan2(e.pos.x - tgt.pos.x, e.pos.z - tgt.pos.z);
      else if (role === 'raider') slot = tgt.heading + Math.PI + e.flank * 0.5;   // rake from astern, outside the broadside arcs
      else if (role === 'heavy') slot = tgt.heading + e.flank * 0.4;              // park across the bow
      else if (role === 'ketch') slot = fleet.angle + Math.PI + e.flank * 0.3;    // hang back on the far side

      if (Math.abs(diff) < 1.2) desired = a - Math.sign(diff || 1) * 1.4;
    }
  }
  e.steer = clamp(angDiff(desired, e.heading) * 2, -1, 1);
  if (!tgt) return;

  // broadside when the target is abeam and no land is in the way
  if (dist < (e.engaged || ally ? 115 : 60) && !blocked && e.cannonZ.length) {
    for (const side of ['port', 'star']) {
      if (e.reload[side] > 0) continue;
      const sd = e.sideDir(side);
      if ((dx * sd.x + dz * sd.z) / dist > 0.9) {
        const tFlight = dist / (BALL_SPEED * 0.85);
        const pf = tgt.forward();
        const lx = tgt.pos.x + pf.x * tgt.speed * tFlight - e.pos.x, lz = tgt.pos.z + pf.z * tgt.speed * tFlight - e.pos.z;
        const d2 = Math.hypot(lx, lz);

      }
    }
  }

  // mortars arc over islands, so hiding is never completely safe
  if (e.kind === 'b' || role === 'ketch') {
    e.mortarT -= dt * e.reloadMul;
    if (e.mortarT <= 0 && dist < 175) {
      if (e.kind === 'b') { e.mortarT = rand(6, 8); enemyMortar(e, tgt, 5, 13, e.dmg + 4); }
      else { e.mortarT = rand(8, 10); enemyMortar(e, tgt, 2, 7, e.dmg, 3.2, 16); }
    }
  }
}

// ---------- music: "Drunken Sailor" (traditional sea shanty), synthesized ----------
const SHANTY = (() => {

function updateMusic() {

  const near = me && ships.some(s => teamOf(s) === 'E' && isAlive(s) && Math.hypot(s.pos.x - me.pos.x, s.pos.z - me.pos.z) < 170);
  const combat = gameActive && (near || (kraken && !kraken.dead));
  const boss = gameActive && (ships.some(s => s.kind === 'b' && isAlive(s)) || (kraken && !kraken.dead && !kraken.dying));

  for (const f of forts) f.reset();
  if (kraken) { kraken.dispose(); kraken = null; }
  waveEvent = null; objective = { text: '', marker: null }; victoryShown = false;
  for (const p of profiles.values()) p.ship = null;
  timers.length = 0;
  tut = null;
  fleet.target = null; fleet.brokenT = 0;
  wave = 0; waveClearT = -1; overPending = false; gameActive = false; shake = 0;
  camYaw = Math.PI; camPitch = 0.32; aimElev = 0.22;
  closeShop(true);
  inPort = false; $('port').style.display = 'none';
  for (const p of profiles.values()) p.fleet = [];
}

function makePlayerShip(design, extra = {}) {
  const c = SHIP_CLASSES[design.cls];
  const s = new Ship({ kind: 'p', colors: designColors(design), scale: c.scale, masts: c.masts, cannons: c.guns,
    maxSpeed: c.speed, turnRate: c.turn, reloadTime: c.reload, dmg: c.dmg, spread: c.spread, ...extra });
  s.design = design;
  return s;
}

function spawnPlayerShip(p, x, z, h = 0) {
  if (x === undefined) {
    const mate = [...profiles.values()].map(q => q.ship).find(s => s && isAlive(s) && s.profile !== p);
    if (gameMode === 'coop' && mate) { x = mate.pos.x + rand(-30, 30); z = mate.pos.z + rand(-30, 30); h = mate.heading; }
    else { const a = rand(0, Math.PI * 2), d = rand(60, 140); x = Math.sin(a) * d; z = Math.cos(a) * d; h = a + Math.PI; }
    for (let k = 0; k < 10 && islands.some(o => Math.hypot(o.x - x, o.z - z) < o.r + 15); k++) { x += 25; z += 10; }
  }
  p.gen++;
  const s = makePlayerShip(p.design, { id: `${p.id}#${p.gen}`, colorIdx: p.colorIdx, x, z, heading: h, maxHp: SHIP_CLASSES[p.design.cls].hp });
  s.profile = p; s.pid = p.id; s.name = p.name;
  s.applyStats(p); s.hp = s.maxHp; s.ammo = p.ammo;
  s.sail = p.input.sail;
  ships.push(s);
  p.ship = s; p.respawnT = 0;
  return s;
}

// ---------- first-voyage tutorial ----------

  { text: 'Raise your sails with <b>W</b> (lower them with <b>S</b>)', done: () => mySail > tut.sail0 },

  { text: 'Look around with the <b>mouse</b> — or press <b>Q</b> / <b>E</b> to swing your aim to a side', done: () => Math.abs(angDiff(camYaw, tut.yaw0)) > 0.6 },
  { text: 'Set your shot range with <b>↑</b> / <b>↓</b> — watch the yellow arc', done: () => Math.abs(aimElev - tut.elev0) > 0.06 },
  { text: '<b>Click</b> or press <b>Space</b> to fire a broadside', done: () => me && (me.reload.port > 0 || me.reload.star > 0) },
  { text: 'Well sailed! <b>B</b> shipwright · <b>M</b> chart · <b>C</b> signature move · <b>G</b> board crippled ships. Enemy sails on the horizon!', done: () => tut.t > 5 },
];
let tut = null;
function startTutorial() { tut = { step: 0, t: 0, sail0: mySail, yaw0: camYaw, elev0: aimElev, steerT: 0 }; }
function finishTutorial() { if (!tut) return; tut = null; save.tutDone = true; writeSave(); after(1, () => startWave(1)); }
function updateTutorial(dt) {
  if (!tut || state !== 'playing') return;
  tut.t += dt;
  if (localSteer) tut.steerT += dt;
  if (TUT[tut.step].done()) {
    tut.step++; tut.t = 0; tut.yaw0 = camYaw; tut.elev0 = aimElev; tut.sail0 = mySail;
    sfx('pickup');
    if (tut.step >= TUT.length) finishTutorial();
  }
}
function updateTutorialHUD() {
  const el = $('tutorial');
  if (!tut) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  const html = `<div style="opacity:.7;font-size:13px">Captain's training ${tut.step + 1}/${TUT.length} · Enter to skip</div>${TUT[tut.step].text}`;
  if (el._h !== html) { el.innerHTML = html; el._h = html; }
}

function startMatch() {
  clearEntities();
  const n = profiles.size;
  let i = 0;
  for (const p of profiles.values()) {
    if (p.id === myId) { p.meta = myMeta(); p.design = cleanDesign(myDesign); }
    const m = p.meta || {};
    Object.assign(p, { treasure: null, gold: 0, earned: 0, kills: 0, up: freshUp(), ammo: 'round', cd: { kegs: 0, mortar: 0, boost: 0, special: 0, kit: 0 }, respawnT: 0, input: { steer: 0, sail: 2 / 3 }, fleet: [], order: 'follow', focus: null, seaPos: null });
    // renown bonuses, and a war chest when starting at a later wave
    p.trait = TRAITS[m.trait] ? m.trait : '';
    p.gold = clamp(m.seed | 0, 0, 3) * 200 + 85 * (startWaveSel - 1) ** 2;   // about what a run has earned by then
    if (m.chain) p.up.ammo_chain = 1;
    if (m.armor) p.up.armor = 1;
    if (gameMode === 'pvp') { const a = i / n * Math.PI * 2; spawnPlayerShip(p, Math.sin(a) * 90, Math.cos(a) * 90, a + Math.PI / 2); }
    else spawnPlayerShip(p, (i - (n - 1) / 2) * 25, 0, 0);
    i++;
  }
  gameActive = true; state = 'playing'; mySail = 2 / 3;
  env.dayT = 0.3; setWeather('clear', true);
  setOverlay('');
  lockPointer();
  clock.getDelta();
  broadcast({ t: 'start', mode: gameMode });
  runAwarded = false; awardBase = { earned: 0, wave: startWaveSel - 1, kills: 0 };
  if (gameMode === 'coop') {
    announce(startWaveSel > 1 ? `Set sail — starting at wave ${startWaveSel}!` : 'Set sail, Captain!', 2);
    if (net.mode === 'solo' && startWaveSel === 1 && !save.tutDone) startTutorial();
    else after(1.5, () => startWave(startWaveSel));
  }
  else announce('Free-for-all! Sink your rivals for gold!', 3);
}

// pick a fleet for wave n from a growing points budget; new ship types unlock as waves go on
function buildFleetList(n, budget) {
  const list = [];
  let flagUsed = false, guard = 0;
  while (budget >= 1 && list.length < MAX_FLEET && guard++ < 200) {
    const opts = Object.values(ENEMY_TYPES).filter(t => n >= t.from && t.cost <= budget && !(t.unique && flagUsed));
    if (!opts.length) break;
    let r = Math.random() * opts.reduce((a, t) => a + t.weight, 0), pick = opts[0];
    for (const t of opts) { r -= t.weight; if (r <= 0) { pick = t; break; } }
    list.push(pick); budget -= pick.cost;
    if (pick.unique) flagUsed = true;
  }
  return list;
}

function clearSpot(x, z, deep) {
  for (let k = 0; k < 12; k++) {
    const bad = islands.some(o => Math.hypot(o.x - x, o.z - z) < (deep ? o.shallowR : o.r + 12)) || (deep && reefs.some(o => Math.hypot(o.x - x, o.z - z) < o.r + 12));
    if (!bad) break;
    x += rand(-25, 25); z += rand(-25, 25);
  }
  return [x, z];
}

function spawnEnemy(type, n, x, z, heading, veteran = false) {
  const ci = type.role === 'flag' ? 5 : veteran ? 4 : Math.floor(Math.random() * 4);
  const e = new Ship({
    kind: 'e', colors: ENEMY_COLORS[ci], colorIdx: ci, scale: type.scale, masts: type.masts, cannons: type.guns,
    x, z, heading,
    maxHp: Math.round((45 + n * 12) * type.hp * (veteran ? 1.35 : 1) * DIFF.hp),
    maxSpeed: Math.min(13.5, 9.5 + n * 0.5) + type.speed,
    turnRate: type.turn,
    reloadTime: Math.max(1.9, 3.6 - n * 0.11) * type.reload,   // peaks around wave 15
    aimErr: Math.max(0.025, 0.11 - n * 0.0055) * (veteran ? 0.5 : 1),
    dmg: (9 + 0.45 * n) * (type.dmg || 1) * (veteran ? 1.2 : 1) * DIFF.dmg,   // enemy shots hit harder every wave; light ships hit softer
  });
  e.aiType = type; e.role = type.role; if (type.windEff != null) e.windEff = type.windEff; e.bounty = type.bounty * (veteran ? 1.5 : 1);
  e.name = veteran ? '★ ' + (type.label || 'Veteran') : type.label;
  e.prefRange = rand(type.range[0], type.range[1]);
  if (type.role === 'fireship') e.maxHp = e.hp = 6;   // a powder barge: any hit sets it off
  e.speed = e.maxSpeed * 0.5;
  ships.push(e);
  return e;
}

// ---------- special events: a 20-wave campaign ending with the Pirate King, then endless ----------
const EVENT_PLAN = { 3: 'treasure', 5: 'boss', 6: 'convoy', 8: 'siege', 10: 'kraken', 12: 'treasure', 14: 'convoy', 15: 'boss', 16: 'siege', 18: 'treasure', 20: 'king' };
const FINAL_WAVE = 20;
function eventFor(n) {
  if (n <= FINAL_WAVE) return EVENT_PLAN[n] || null;
  if (n % 5 === 0) return n % 10 === 0 ? 'kraken' : 'boss';
  return Math.random() < 0.45 ? ['treasure', 'convoy', 'siege'][Math.floor(Math.random() * 3)] : null;
}
let waveEvent = null;                           // host: the current wave's objective
let objective = { text: '', marker: null };     // HUD objective (host and guests); marker = [x, z, kind]
let kraken = null;
let victoryShown = false;

function startWave(n) {
  wave = n;
  const alive = ships.filter(s => s.kind === 'p' && isAlive(s));
  const center = new THREE.Vector3();
  for (const s of alive) center.add(s.pos);
  if (alive.length) center.divideScalar(alive.length);
  const extra = Math.max(0, profiles.size - 1);
  let type = eventFor(n);
  const siegeFort = type === 'siege' ? forts.filter(f => !f.destroyed).sort((a, b) => Math.hypot(a.x - center.x, a.z - center.z) - Math.hypot(b.x - center.x, b.z - center.z))[0] : null;
  if (type === 'siege' && !siegeFort) type = null;
  const budgetMul = { treasure: 0.6, convoy: 0.8, siege: 0.45, kraken: 0, king: 0.55, boss: 0.5 }[type] ?? 1;
  const list = budgetMul ? buildFleetList(n, (1.2 + n * 1.25 + extra * 2) * budgetMul) : [];
  waveEvent = null; objective = { text: '', marker: null };
  setWeather(rollWeather(n, type));

  // the whole fleet arrives together from one direction, in formation (or garrisons the besieged fort)
  const a = rand(0, Math.PI * 2);
  const dir = new THREE.Vector3(Math.sin(a), 0, Math.cos(a)), perp = new THREE.Vector3(Math.cos(a), 0, -Math.sin(a));
  fleet.angle = a; fleet.target = null; fleet.retargetT = 0; fleet.brokenT = 0;
  const line = list.filter(t => t.role === 'line').length;
  let li = 0, vets = 0;
  // treasure wave: the galleon sails past close by, and the wave's fleet escorts her in formation
  const tg = type === 'treasure' ? spawnTreasure(center, n) : null;
  list.forEach((t, i) => {
    let x, z;
    if (tg) {
      const ga = tg.heading + (i / list.length) * Math.PI * 2, gd = 32 + 8 * (i % 2);
      x = tg.pos.x + Math.sin(ga) * gd; z = tg.pos.z + Math.cos(ga) * gd;
    } else if (siegeFort) { const g = rand(0, Math.PI * 2), d = rand(45, 75); x = siegeFort.x + Math.sin(g) * d; z = siegeFort.z + Math.cos(g) * d; }
    else {
      let fwd = 0, lat = (i - (list.length - 1) / 2) * 22;
      if (t.role === 'heavy' || t.role === 'flag') fwd = -25;
      if (t.role === 'ketch') fwd = 40;
      if (t.role === 'raider') lat = (i % 2 ? 1 : -1) * rand(60, 90);
      if (t.role === 'fireship') { fwd = -40; lat = (i % 2 ? 1 : -1) * rand(20, 50); }
      x = center.x + dir.x * (220 + fwd) + perp.x * lat; z = center.z + dir.z * (220 + fwd) + perp.z * lat;
    }
    [x, z] = clearSpot(x, z, t.scale >= 0.95);
    const veteran = n >= 7 && t.role !== 'fireship' && Math.random() < Math.min(0.5, 0.08 + 0.025 * (n - 7));
    if (veteran) vets++;
    const e = spawnEnemy(t, n, x, z, Math.atan2(center.x - x, center.z - z), veteran);
    if (t.role === 'line') { e.slotOff = line > 1 ? (li / (line - 1) - 0.5) * 2.6 : 0; li++; }
    e.flank = i % 2 ? 1 : -1;
    if (tg) { e.guard = tg; e.guardA = (i / list.length) * Math.PI * 2; e.guardD = 32 + 8 * (i % 2); e.heading = tg.heading; }
  });

  switch (type) {
    case 'boss': spawnBossShip(center, dir, n, extra); break;
    case 'king': spawnPirateKing(center, dir, n, extra); break;
    case 'kraken': spawnKraken(center, extra); break;
    case 'treasure': announce('💰 A treasure galleon and her escorts are passing close by!', 3); sfxFor('bell'); break;
    case 'convoy': spawnConvoy(center, n); break;
    case 'siege': startSiege(siegeFort, extra); break;
    default: announce(`Wave ${n} — ${list.length} ships approach!`); sfxFor('bell');
  }
  // tell captains what is coming
  const counts = {};
  for (const t of list) if (t.label) counts[t.label] = (counts[t.label] || 0) + 1;
  const parts = Object.entries(counts).map(([l, c]) => `${c} ${l}`);
  if (vets) parts.push(`${vets} ★ veteran${vets > 1 ? 's' : ''}`);
  if (parts.length) after(3.2, () => notify('Spotted: ' + parts.join(' · ')));
}

function spawnBossShip(center, dir, n, extra) {
  const k = Math.max(1, Math.round(n / 5));
  const [x, z] = clearSpot(center.x + dir.x * 245, center.z + dir.z * 245, true);
  const boss = new Ship({
    kind: 'b', colors: BOSS_COLORS, masts: 3, x, z, heading: Math.atan2(center.x - x, center.z - z),
    scale: BOSS_SCALE, cannons: 6, maxHp: Math.round((450 + 200 * (k - 1) + 120 * extra) * DIFF.hp), maxSpeed: 9.5,
    reloadTime: 2.4, aimErr: 0.04, turnRate: 0.4, dmg: (12 + 0.45 * n) * DIFF.dmg,
  });
  boss.name = BOSS_NAMES[(k - 1) % BOSS_NAMES.length];
  boss.mortarT = 6; boss.prefRange = rand(65, 85); boss.speed = 5; boss.role = 'heavy';
  ships.push(boss);
  announce(`⚠ BOSS: ${boss.name} ⚠`, 3.5);
  sfxFor('boss');
}

function spawnPirateKing(center, dir, n, extra) {
  const [x, z] = clearSpot(center.x + dir.x * 250, center.z + dir.z * 250, true);
  const king = new Ship({
    kind: 'b', colors: KING_COLORS, masts: 3, x, z, heading: Math.atan2(center.x - x, center.z - z),
    scale: 2.1, cannons: 7, maxHp: Math.round((2600 + 700 * extra) * DIFF.hp), maxSpeed: 9, reloadTime: 2.2,
    aimErr: 0.03, turnRate: 0.38, dmg: (16 + 0.3 * n) * DIFF.dmg,
  });
  king.name = '☠ The Pirate King'; king.mortarT = 5; king.prefRange = 75; king.role = 'heavy'; king.isKing = true; king.kphase = 1;
  king.aiType = { scale: 2.1, masts: 3, label: 'Pirate King' };
  ships.push(king);
  waveEvent = { type: 'king', king };
  announce('☠ THE PIRATE KING ☠ — sink him and the seas are yours!', 4);
  sfxFor('boss');
}

// the galleon appears in sight (~170 m off) and sails across the captains' bow, not away from them
const TREASURE_RUN = 600;   // how far the galleon sails before she escapes
function spawnTreasure(center, n) {
  const a = rand(0, Math.PI * 2), h = a + (Math.random() < 0.5 ? 1 : -1) * Math.PI / 2;
  const [x, z] = clearSpot(center.x + Math.sin(a) * 160 - Math.sin(h) * 70, center.z + Math.cos(a) * 160 - Math.cos(h) * 70, true);
  const e = new Ship({ kind: 'e', colors: ENEMY_COLORS[6], colorIdx: 6, scale: 1.4, masts: 3, cannons: 2, x, z, heading: h,
    maxHp: Math.round((45 + 12 * n) * 3 * DIFF.hp), maxSpeed: 8.5, turnRate: 0.45, reloadTime: 3, aimErr: 0.1, dmg: 8 });
  e.role = 'merchant'; e.name = '💰 Treasure Galleon'; e.bounty = 6; e.aiType = { scale: 1.4, masts: 3, label: 'Treasure Galleon' };
  e.speed = 5; e.goal = { x: x + Math.sin(h) * 800, z: z + Math.cos(h) * 800 }; e.start = { x, z };
  ships.push(e);
  waveEvent = { type: 'treasure', ship: e };
  return e;
}

function spawnConvoy(center, n) {
  const a = rand(0, Math.PI * 2);
  const [dx, dz] = clearSpot(center.x + Math.sin(a) * 520, center.z + Math.cos(a) * 520, true);
  const list = [];
  for (const side of [-1, 1]) {
    const [x, z] = clearSpot(center.x + Math.cos(a) * 26 * side - Math.sin(a) * 25, center.z - Math.sin(a) * 26 * side - Math.cos(a) * 25, true);
    const c = new Ship({ kind: 'a', colors: ENEMY_COLORS[7], colorIdx: 7, scale: 1.2, masts: 3, cannons: 0, x, z, heading: a,
      maxHp: 220 + 20 * n, maxSpeed: 9.5, turnRate: 0.5 });
    c.role = 'convoy'; c.name = '⚓ Merchantman'; c.goal = { x: dx, z: dz }; c.aiType = { scale: 1.2, masts: 3, label: 'Merchantman' };
    c.speed = 4;
    ships.push(c); list.push(c);
  }
  waveEvent = { type: 'convoy', ships: list, dest: { x: dx, z: dz }, arrived: 0 };
  announce('⚓ Escort the merchant convoy to safe harbour!', 3);
  sfxFor('bell');
}

function startSiege(f, extra) {
  f.siege = true; f.maxHp = 440 + 120 * extra; f.hp = f.maxHp; f.destroyed = false; f.top.position.y = 0;
  waveEvent = { type: 'siege', fort: f, t: 200 };
  announce('🏰 Siege! Storm the fort before its garrison sinks you', 3.5);
  sfxFor('bell');
}
function endSiege(f) { f.siege = false; f.maxHp = 220; if (!f.destroyed) f.hp = Math.min(f.hp, f.maxHp); }

function spawnKraken(center, extra) {
  kraken = new Kraken(center.x + 60, center.z + 60, Math.round((1400 + 450 * extra) * DIFF.hp));
  waveEvent = { type: 'kraken' };
  announce('🐙 Something stirs beneath the waves… THE KRAKEN!', 3.5);
  sfxFor('boss');
}

// objectives tick on the host; text and markers are mirrored to guests
function updateEvent(dt) {
  const ev = waveEvent;
  if (!ev || ev.done) { objective = { text: '', marker: null }; return; }
  if (ev.type === 'treasure') {
    const e = ev.ship;
    if (!isAlive(e) || e.kind !== 'e') { ev.done = true; if (e.kind === 'a') announce('💰 The treasure galleon is ours!', 3); return; }
    const left = TREASURE_RUN - Math.hypot(e.pos.x - e.start.x, e.pos.z - e.start.z);
    if (left <= 0) { e.remove(); ev.done = true; announce('The treasure galleon escaped over the horizon…', 3); return; }
    objective = { text: `💰 Catch the treasure galleon — ${Math.round(left)} m from escaping (board her for a fortune!)`, marker: [e.pos.x, e.pos.z, 'treasureShip'] };
  } else if (ev.type === 'convoy') {
    for (const c of ev.ships) {
      if (isAlive(c) && !c.arrived && Math.hypot(c.pos.x - ev.dest.x, c.pos.z - ev.dest.z) < 35) {
        c.arrived = true; ev.arrived++;
        const r = 150 * wave;
        for (const p of profiles.values()) giveGold(p, r);
        announce(`⚓ A merchantman reached harbour! +${r} gold`, 2.5);
        c.remove();
      }
    }
    const afloat = ev.ships.filter(c => !c.arrived && isAlive(c));
    if (!afloat.length) {
      ev.done = true;
      announce(ev.arrived ? `Convoy complete — ${ev.arrived}/${ev.ships.length} ships saved` : 'The convoy was lost…', 3);
      return;
    }
    const d = Math.round(Math.min(...afloat.map(c => Math.hypot(c.pos.x - ev.dest.x, c.pos.z - ev.dest.z))));
    objective = { text: `⚓ Escort the convoy to harbour — ${afloat.length} afloat, ${d} m to go`, marker: [ev.dest.x, ev.dest.z, 'harbor'] };
  } else if (ev.type === 'siege') {
    const f = ev.fort;
    ev.t -= dt;
    if (f.destroyed) {
      ev.done = true; endSiege(f);
      const r = 150 * wave;
      for (const p of profiles.values()) giveGold(p, r);
      announce(`🏰 The fort has fallen! +${r} gold`, 3);
    } else if (ev.t <= 0) { ev.done = true; endSiege(f); announce('The siege failed — the fort holds', 3); }
    else objective = { text: `🏰 Destroy the fort — ${Math.ceil(ev.t)}s left`, marker: [f.x, f.z, 'fort'] };
  } else if (ev.type === 'kraken') {
    if (!kraken || kraken.dying || kraken.dead) { ev.done = true; return; }
    objective = { text: `🐙 Slay the Kraken — shoot its tentacles, and its head when it surfaces`, marker: [kraken.x, kraken.z, 'kraken'] };
  } else if (ev.type === 'king') {
    const k = ev.king;
    if (!isAlive(k)) { ev.done = true; return; }
    const f = k.hp / k.maxHp;
    if (k.kphase === 1 && f < 0.66) {
      k.kphase = 2; k.reloadTime *= 0.85;
      announce('☠ "All hands to me!" — the Pirate King calls his raiders', 3);
      for (let i = 0; i < 4; i++) spawnEnemy(i < 3 ? ENEMY_TYPES.raider : ENEMY_TYPES.fireship, wave, k.pos.x + rand(-40, 40), k.pos.z + rand(-40, 40), k.heading);
    } else if (k.kphase === 2 && f < 0.33) {
      k.kphase = 3; k.reloadTime *= 0.8; k.maxSpeed += 2; k.ammo = 'fire';
      announce('🔥 The Pirate King is enraged — his guns are loaded with fire!', 3);
      for (let i = 0; i < 2; i++) spawnEnemy(ENEMY_TYPES.raider, wave, k.pos.x + rand(-40, 40), k.pos.z + rand(-40, 40), k.heading);
    }
    objective = { text: `☠ Sink the Pirate King${k.kphase === 3 ? ' — he is enraged!' : ''}`, marker: null };
  }
}

function victory() {
  if (victoryShown) return;
  victoryShown = true;
  announce('☠ The Pirate King is sunk! The seas are yours! ☠', 4);
  after(3.5, () => {
    const data = { wave, players: [...profiles.values()].map(p => [p.name, p.earned, p.kills]) };
    emit(['vic', data]);
    showVictory(data);
  });
}

function onShipSunk(s) {
  const killer = s.lastHitBy && s.lastHitBy.profile;
  if (s.role === 'convoy') { announce('⚓ A merchantman has been sunk!', 2); return; }
  if (s.kind === 'a') {
    if (s.fleetEntry) { announce(`⛵ The ${s.name} has been sunk!`, 2.5, s.ownerProf); after(0.1, () => relinkFleet(s.ownerProf)); }
    else notify('Your escort has been sunk!', s.ownerProf);
    spawnCrates(s.pos, 1); return;
  }
  if (s.selfDestruct) return;   // fireships that blew themselves up pay nothing
  if (s.role === 'flag') { fleet.brokenT = 12; announce('Flagship sunk — the enemy crews lose heart!', 3); }
  if (s.kind === 'p') {
    const prof = s.profile;
    if (!prof) return;
    if (gameMode === 'pvp') {
      prof.respawnT = 6;
      if (killer && killer !== prof) {
        killer.kills++;
        giveGold(killer, 250);
        announce(`${killer.name} sank ${prof.name}!`, 2.5);
      } else announce('Your ship is going down!', 2.5, prof);
    } else {
      // co-op: respawn beside a living crewmate; if nobody is left afloat, hostLogic ends the game
      const mateAlive = [...profiles.values()].some(q => q !== prof && isAlive(q.ship));
      prof.respawnT = mateAlive ? 12 : 0;
      announce('Your ship is going down!', 2.5, prof);
    }
    return;
  }
  // AI ship sunk: killer gets the full bounty, teammates a share
  const reward = s.kind === 'b' ? 600 + 60 * Math.max(1, wave) : killBounty(s.bounty || 1);
  for (const p of profiles.values()) {
    if (p === killer) { giveGold(p, reward); p.kills++; notify(`Enemy sunk! +${reward} gold`, p); }
    else { const share = Math.round(reward * 0.4); giveGold(p, share); notify(`Crewmate sank a ship! +${share} gold`, p); }
  }
  if (s.kind === 'b') { announce(`${s.name} has been sunk!`, 3); spawnCrates(s.pos, 5, 9); if (s.isKing) victory(); }
  else spawnCrates(s.pos);
  if (!s.selfDestruct && Math.random() < (s.kind === 'b' ? 1 : s.colorIdx === 4 ? 0.3 : 0.12)) spawnMap(s.pos);
}

// ---------- boarding ----------
const BOARD_HP = 0.35;
function boardable(s, e) {
  return e && e.kind === 'e' && isAlive(e) && e.role !== 'fireship' && !e.grappled && isAlive(s) && !s.grappled &&
    e.hp / e.maxHp < BOARD_HP && Math.hypot(e.pos.x - s.pos.x, e.pos.z - s.pos.z) < 9 * (s.scale + e.scale) + 6;
}
function boardCandidate(s) {
  let best = null, bd = Infinity;
  for (const e of ships) if (boardable(s, e)) { const d = Math.hypot(e.pos.x - s.pos.x, e.pos.z - s.pos.z); if (d < bd) { bd = d; best = e; } }
  return best;
}
// kill bounty grows gently with the wave (fleet size already grows), so gold doesn't snowball past the shop
function killBounty(mul = 1) { return Math.round((60 + 15 * Math.max(1, wave)) * mul); }
function boardLoot(e) { return killBounty(e.bounty || 1); }
function startBoarding(prof) {
  const s = prof.ship;
  if (prof.board || !isAlive(s)) return;
  const e = boardCandidate(s);
  if (!e) { notify(`Nothing to board — get alongside an enemy below ${BOARD_HP * 100}% hull`, prof); return; }
  s.grappled = e; e.grappled = s;
  prof.board = { target: e, phase: 'fight', t: 0, dur: 2.5 + 1.5 * e.scale, ropes: null };
  announce('⚔ Boarders away!', 1.5, prof);
  sfxFor('clang', prof);
}
function endBoarding(prof) {
  const b = prof.board;
  if (!b) return;
  if (b.ropes) { scene.remove(b.ropes); b.ropes.geometry.dispose(); }
  if (prof.ship) prof.ship.grappled = null;
  if (b.target) b.target.grappled = null;
  prof.board = null;
}
function updateBoarding(prof, dt) {
  const b = prof.board, s = prof.ship, e = b.target;
  if (!isAlive(s) || !isAlive(e)) { endBoarding(prof); return; }
  // lash the hulls together
  s.speed *= Math.max(0, 1 - dt * 2.5); e.speed *= Math.max(0, 1 - dt * 2.5);
  const dx = e.pos.x - s.pos.x, dz = e.pos.z - s.pos.z, d = Math.hypot(dx, dz) || 1, want = 4.6 * (s.scale + e.scale);
  e.pos.x -= dx / d * (d - want) * Math.min(1, dt * 2); e.pos.z -= dz / d * (d - want) * Math.min(1, dt * 2);
  e.heading += angDiff(s.heading, e.heading) * Math.min(1, dt * 1.5);
  if (!b.ropes) {
    b.ropes = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0x3a2a18 }));
    b.ropes.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(18), 3));
    b.ropes.frustumCulled = false;
    scene.add(b.ropes);
  }
  const rp = b.ropes.geometry.attributes.position;
  [-3, 0, 3].forEach((z, i) => {
    const a = s.local(0, 3, z), c = e.local(0, 3, z * 0.8);
    rp.setXYZ(i * 2, a.x, a.y, a.z); rp.setXYZ(i * 2 + 1, c.x, c.y, c.z);
  });
  rp.needsUpdate = true;
  if (b.phase === 'fight') {
    b.t += dt;
    s.damage(1.2 * e.scale * dt, e, true, true);   // their crew fights back
    if (Math.random() < dt * 10) {
      const m = s.pos.clone().lerp(e.pos, rand(0.3, 0.7)).setY(s.pos.y + 3);
      P({ pos: m, vel: rv(3).setY(rand(1, 4)), color: Math.random() < 0.5 ? 0xffe080 : 0xffffff, size: 0.18, life: 0.35, basic: true });
      if (Math.random() < 0.25) sfx('clang', m);
    }
    if (b.t >= b.dur) { b.phase = 'choose'; b.t = 8; announce('The ship is yours, Captain!', 1.5, prof); }

}
function resolveBoarding(prof, choice) {
  const b = prof.board;

  const capFull = net.mode === 'solo' ? prof.fleet.length >= fleetCap() : escortCount(prof) >= MAX_ESCORTS + 1;
  if (choice === 'capture' && capFull) { notify('Your fleet is full — plundering instead', prof); choice = 'plunder'; }
  if (choice === 'plunder') {
    giveGold(prof, Math.round(loot * 2.5));
    s.hp = Math.min(s.maxHp, s.hp + s.maxHp * 0.2);
    notify(`💰 Plundered ${Math.round(loot * 2.5)} gold and ship's stores (+20% hull)`, prof);
    e.selfDestruct = true; e.hp = 0; e.startSinking();
  } else if (choice === 'capture') {
    if (e.role === 'merchant') e.role = 'line';
    e.kind = 'a'; e.ownerProf = prof; e.profile = prof; e.station = escortCount(prof) % 2 ? -1 : 1;
    e.name = 'Captured ' + (e.aiType && e.aiType.label ? e.aiType.label.replace(/^[^A-Za-z]+/, '') : 'Cutter');
    e.hp = e.maxHp * 0.6; e.lastHitBy = null; e.reloadMul = 1; e.engaged = true; e.regen = e.maxHp / 80;
    e.burnT = 0; e.slowT = 0;
    e.flag.material = new THREE.MeshStandardMaterial({ map: JOLLY_ROGER, side: THREE.DoubleSide, roughness: 0.9 });
    removeTag(e);
    if (net.mode === 'solo') addFleetEntry(prof, e, e.scale < 0.9 ? 'sloop' : e.scale < 1.2 ? 'frigate' : 'manowar', e.name.replace('Captured ', 'Prize '));
    giveGold(prof, Math.round(loot * 0.5));

  } else {

    notify('🔥 Scuttled! Her powder magazine goes up…', prof);
    const pos = e.pos.clone();
    after(1.2, () => {
      fxHit(pos.clone().setY(2), 3);
      for (const o of ships) if (teamOf(o) === 'E' && isAlive(o) && o !== e && Math.hypot(o.pos.x - pos.x, o.pos.z - pos.z) < 18) { o.damage(55 + 3 * wave, s); applyBurn(o, 2, 3 + 0.2 * wave, s); }
    });
    e.selfDestruct = true; e.hp = 0; e.startSinking();
  }
  sfxFor('coin', prof);
}

function hostLogic(dt) {
  for (const p of profiles.values()) {
    for (const k in p.cd) p.cd[k] = Math.max(0, p.cd[k] - dt);
    if (p.ship) p.ship.ammo = p.ammo;
    if (p.board) updateBoarding(p, dt);
    if (p.treasure) updateDig(p, dt);
    if (p.ship && !isAlive(p.ship) && p.respawnT > 0 && !overPending) {
      p.respawnT -= dt;
      if (p.respawnT <= 0) { spawnPlayerShip(p); announce('Back at the helm!', 1.5, p); }
    }
  }
  if (gameMode !== 'coop') return;
  const alive = [...profiles.values()].some(p => isAlive(p.ship));
  if (!alive && !overPending) { overPending = true; announce('All hands lost!', 3); after(3.5, gameOver); }
  updateEvent(dt);
  const eventOpen = (waveEvent && !waveEvent.done) || (kraken && !kraken.dying && !kraken.dead);
  if (wave > 0 && alive && !eventOpen && !ships.some(s => teamOf(s) === 'E' && !s.sinking && !s.dead)) {
    if (waveClearT < 0) {
      waveClearT = 7;
      announce(`Wave ${wave} cleared!`, 2.5);
      for (const p of profiles.values()) {
        // crew patches half the damage between waves, fleet included
        for (const sh of ships) if ((sh === p.ship || (sh.kind === 'a' && sh.ownerProf === p)) && isAlive(sh)) sh.hp += (sh.maxHp - sh.hp) * 0.5;
        giveGold(p, 50 * wave);
      }
      if (net.mode === 'solo') { waveClearT = 10; after(2.6, () => notify(`+${50 * wave} gold bounty · sailing home to port in a moment — [Enter] go now`)); }
      else after(2.6, () => notify(`+${50 * wave} gold bounty · hull half patched — press B for repairs & kits`));
    }
    waveClearT -= dt;
    if (waveClearT <= 0) { waveClearT = -1; if (net.mode === 'solo') enterPort(); else startWave(wave + 1); }
  }
}

function gameOver() {
  const data = { wave, mode: gameMode, players: [...profiles.values()].map(p => [p.name, p.earned, p.kills]) };
  emit(['over', data]);
  sendSnapshot();
  showGameOver(data);
}

function escortCount(prof) { return ships.filter(x => x.kind === 'a' && x.ownerProf === prof && isAlive(x)).length; }
function spawnEscort(prof) {
  const lead = prof.ship;
  const station = escortCount(prof) % 2 ? -1 : 1;
  const f = lead.forward();
  const e = new Ship({
    kind: 'a', colors: designColors(prof.design), x: lead.pos.x - f.x * 20 + f.z * 22 * station, z: lead.pos.z - f.z * 20 - f.x * 22 * station,
    heading: lead.heading, scale: 0.9, masts: 2, cannons: 4, maxHp: 150 + 15 * wave, maxSpeed: 14.5, turnRate: 0.7,
    reloadTime: 2.4, aimErr: 0.03, dmg: 10 + 0.5 * wave,
  });
  e.ownerProf = prof; e.profile = prof; e.station = station; e.design = prof.design;
  e.name = `${prof.name}'s escort`; e.regen = e.maxHp / 80; e.prefRange = rand(45, 60);
  e.speed = lead.speed; e.sail = lead.sail;
  ships.push(e);
}

function useAbility(prof, k, ax, az, elev = 0.2) {
  const s = prof.ship, L = k === 'special' ? 1 : prof.up[k] || 0;
  if (!L || !isAlive(s) || !gameActive || prof.cd[k] > 0) return;
  if (k === 'special') {
    const sp = SHIP_CLASSES[prof.design.cls].special;
    if (sp.key === 'smoke') {
      s.smokeT = 5; s.boostT = Math.max(s.boostT, 5);
      for (let i = 0; i < 26; i++) P({ pos: s.local(rand(-6, 6), rand(0.5, 5), rand(-9, 9)), vel: rv(3).setY(rand(0.5, 2)), color: 0xb9bcc0, size: rand(3, 5), life: rand(4, 5.5), grow: 1.5, drag: 1.2, opacity: 0.9 });
      notify('🌫 Smoke screen! They’ve lost sight of you', prof);
    } else if (sp.key === 'rapid') {
      s.reload.port = s.reload.star = 0; s.rapidT = 6;
      notify('⚡ Rapid reload!', prof);
    } else if (sp.key === 'volley') {
      if (ax == null || Math.hypot(ax - s.pos.x, az - s.pos.z) > 170) { notify('Aim at the water first (the mortar needs a target zone)', prof); return; }
      const dmg = (16 + 0.8 * wave) * (1 + 0.1 * (prof.up.guns || 0));
      for (let i = 0; i < 6; i++) {
        const tx = ax + (i ? rand(-8, 8) : 0), tz = az + (i ? rand(-8, 8) : 0), T = 2.2, delay = i * 0.12;
        warnAt(tx, tz, T + delay, 0xffc030);
        after(delay, () => {
          if (!isAlive(s)) return;
          const from = s.local(0, 4, 2);
          const vel = new THREE.Vector3((tx - from.x) / T, (0 - from.y + 0.5 * G * T * T) / T, (tz - from.z) / T);
          spawnBall(from, vel, s, { aoe: 7, dmg }); fx.muzzle(from, vel.clone().normalize()); sfx('cannon', from);
        });
      }
      notify('🎯 Mortar volley away!', prof);
    } else if (sp.key === 'blaze') {
      s.reload.port = s.reload.star = 0;
      s.fire('port', elev); s.fire('star', elev);
      notify('💥 All guns blazing!', prof);
    }
    prof.cd.special = sp.cd;
    sfxFor('bell', prof);
    return;
  }
  if (k === 'kegs') {
    const n = 2 + L, f = s.forward();
    for (let i = 0; i < n; i++) {
      const sx = (i - (n - 1) / 2) * 4;
      addKeg('k' + (++kegSeq), s.pos.x - f.x * 9 * s.scale + f.z * sx, s.pos.z - f.z * 9 * s.scale - f.x * sx, s, 30 + 15 * L + 0.5 * wave);
    }
    notify('Powder kegs dropped!', prof);
  } else if (k === 'mortar') {
    if (ax == null || Math.hypot(ax - s.pos.x, az - s.pos.z) > 170) return;
    const n = 4 + 2 * L, dmg = 22 + 8 * L + 0.5 * wave;
    for (let i = 0; i < n; i++) {
      const tx = ax + (i ? rand(-7, 7) : 0), tz = az + (i ? rand(-7, 7) : 0), T = 2.2, delay = i * 0.14;
      warnAt(tx, tz, T + delay, 0xffc030);
      after(delay, () => {
        if (!isAlive(s)) return;
        const from = s.local(0, 4, 0);
        const vel = new THREE.Vector3((tx - from.x) / T, (0 - from.y + 0.5 * G * T * T) / T, (tz - from.z) / T);
        spawnBall(from, vel, s, { aoe: 7, dmg });
        fx.muzzle(from, vel.clone().normalize());
        sfx('cannon', from);
      });
    }
  } else if (k === 'boost') {
    s.boostT = 3 + L;
    notify('Full speed ahead!', prof);
  }
  prof.cd[k] = ABILITIES[k].cd(L);
  sfxFor('bell', prof);
}

// repair kit: heal over time and put out fires; limited stock with a cooldown
function useKit(prof) {
  const s = prof.ship;
  if (!isAlive(s) || !gameActive || (prof.up.kit | 0) <= 0 || (prof.cd.kit || 0) > 0 || s.hp >= s.maxHp) return;
  prof.up.kit--;
  prof.cd.kit = KIT_CD;
  s.kitT = KIT_TIME; s.kitRate = s.maxHp * KIT_HEAL / KIT_TIME;

  sfxFor('pickup', prof);
