// ============================================================
//  Collisions (host only)
// ============================================================
function collisions() {
  const live = ships.filter(isAlive);
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
    const a = live[i], b = live[j];
    const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), R = 4.5 * (a.scale + b.scale);
    if (d < R && d > 0.001) {
      const push = (R - d) / 2, nx = dx / d, nz = dz / d;
      a.pos.x -= nx * push; a.pos.z -= nz * push; b.pos.x += nx * push; b.pos.z += nz * push;
      const impact = (a.speed + b.speed) * 0.5;
      const friendly = teamOf(a) === teamOf(b) && !(gameMode === 'pvp' && a.kind === 'p' && b.kind === 'p');
      if (!friendly && impact > 4 && a.bumpCd <= 0 && b.bumpCd <= 0) {
        a.damage(impact * 0.8 / a.scale, b); b.damage(impact * 0.8 / b.scale, a);
        a.bumpCd = b.bumpCd = 1.5;
        fxHit(a.pos.clone().add(b.pos).multiplyScalar(0.5).setY(1.5), 0.6);
      }
      a.speed *= 0.97; b.speed *= 0.97;
    }
  }
  for (const s of live) for (const isl of islands) {
    const dx = s.pos.x - isl.x, dz = s.pos.z - isl.z, d = Math.hypot(dx, dz), R = isl.r + 3 * s.scale;
    if (d < R) {
      s.pos.x = isl.x + dx / d * R; s.pos.z = isl.z + dz / d * R;
      if (s.speed > 5 && s.bumpCd <= 0) { s.damage(s.speed * 0.8, null); s.bumpCd = 1.5; sfx('thud', s.pos); fx.dust(s.local(0, 1, 7)); }
      s.speed *= 0.9;
    }
  }
}

// ============================================================
//  Enemy AI (host only)
// ============================================================
function nearestPlayerShip(x, z, maxD = Infinity) { return nearestOfTeam('P', x, z, maxD); }
function nearestOfTeam(team, x, z, maxD = Infinity) {
  let best = null, bd = maxD;
  for (const s of ships) {
    if (teamOf(s) !== team || !isAlive(s) || s === menuShip) continue;
    const d = Math.hypot(s.pos.x - x, s.pos.z - z);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}

// Fleet coordination: a shared focus target, a rotating "ring" the line ships hold around it,
// the flagship's reload aura, and morale collapse when the flagship sinks.
const fleet = { angle: 0, target: null, retargetT: 0, brokenT: 0, flag: null };
function updateFleet(dt) {
  fleet.angle += dt * 0.06;
  fleet.brokenT = Math.max(0, fleet.brokenT - dt);
  fleet.retargetT -= dt;
  const foes = ships.filter(s => teamOf(s) === 'E' && isAlive(s));
  if (!foes.length) return;
  if (fleet.retargetT <= 0 || !isAlive(fleet.target)) {
    fleet.retargetT = 5;
    const c = new THREE.Vector3();
    foes.forEach(f => c.add(f.pos)); c.divideScalar(foes.length);
    let best = null, bs = Infinity;
    for (const s of ships) {
      if (teamOf(s) !== 'P' || !isAlive(s) || s === menuShip) continue;
      // focus the weakest nearby captain; escorts are a lower priority
      const score = (s.hp / s.maxHp) * 120 + Math.hypot(s.pos.x - c.x, s.pos.z - c.z) * 0.5 + (s.kind === 'a' ? 60 : 0);
      if (score < bs) { bs = score; best = s; }
    }
    fleet.target = best;
  }
  fleet.flag = foes.find(s => s.role === 'flag') || null;
  for (const e of foes) {
    let m = 1;
    if (fleet.flag && e !== fleet.flag && Math.hypot(e.pos.x - fleet.flag.pos.x, e.pos.z - fleet.flag.pos.z) < 80) m *= 1.35;
    if (fleet.brokenT > 0) m *= 0.65;
    e.reloadMul = m;
  }
}

// tall land between two points blocks a flat cannon shot
function losBlocked(ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz || 1;
  for (const isl of islands) {
    if (isl.h < 4) continue;
    const u = ((isl.x - ax) * dx + (isl.z - az) * dz) / L2;
    if (u <= 0.05 || u >= 0.95) continue;
    const px = ax + dx * u - isl.x, pz = az + dz * u - isl.z;
    if (px * px + pz * pz < (isl.r * 0.85) ** 2) return true;
  }
  return false;
}

// telegraphed mortar barrage (boss and bomb ketches) — arcs right over islands
function enemyMortar(e, tgt, n, spread, dmg, T = 2.6) {
  const tf = tgt.forward();
  const cx = tgt.pos.x + tf.x * tgt.speed * T * 0.85, cz = tgt.pos.z + tf.z * tgt.speed * T * 0.85;
  for (let i = 0; i < n; i++) {
    const tx = cx + (i ? rand(-spread, spread) : 0), tz = cz + (i ? rand(-spread, spread) : 0);
    const delay = i * 0.18;
    warnAt(tx, tz, T + delay);
    after(delay, () => {
      if (!isAlive(e)) return;
      const from = e.local(0, 4, -2);
      const vel = new THREE.Vector3((tx - from.x) / T, (0 - from.y + 0.5 * G * T * T) / T, (tz - from.z) / T);
      spawnBall(from, vel, e, { aoe: 7, dmg });
      fx.muzzle(from, vel.clone().normalize());
      sfx('cannon', from);
    });
  }
}

function fireshipExplode(e) {
  const p = e.pos.clone().setY(1.5);
  fxHit(p, 3);
  for (const s of ships) {
    if (!canHit(e, s) || Math.hypot(s.pos.x - p.x, s.pos.z - p.z) > 13 * s.scale) continue;
    s.damage(e.dmg * 3.5, e);
    s.burnT = 4; s.burnDps = e.dmg * 0.4; s.burnBy = e;
  }
  e.selfDestruct = true;
  e.hp = 0;
  e.startSinking();
}

// steer away from land, and (for deep hulls) shallows and reefs
function avoidObstacles(e, desired) {
  const sc = e.scale, deep = sc >= 0.95;
  const check = (x, z, R) => {
    const ix = x - e.pos.x, iz = z - e.pos.z, d = Math.hypot(ix, iz);
    if (d < R) {
      const a = Math.atan2(ix, iz), diff = angDiff(a, e.heading);
      if (Math.abs(diff) < 1.3) desired = a - Math.sign(diff || 1) * 1.7;
    }
  };
  for (const isl of islands) check(isl.x, isl.z, (deep ? isl.r + (isl.shallowR - isl.r) * 0.55 : isl.r) + 22 * sc);
  if (deep) for (const rf of reefs) check(rf.x, rf.z, rf.r + 6 + 22 * sc);
  return desired;
}

function updateAI(e, dt) {
  if (!isAlive(e)) return;
  const sc = e.scale, ally = e.kind === 'a', role = e.role || 'line';
  let tgt;
  if (ally) tgt = nearestOfTeam('E', e.pos.x, e.pos.z, 220);
  else {
    tgt = isAlive(fleet.target) ? fleet.target : nearestPlayerShip(e.pos.x, e.pos.z);
    const near = role !== 'fireship' && nearestPlayerShip(e.pos.x, e.pos.z, 40 * sc);   // fight back at close range
    if (near) tgt = near;
  }
  let desired, dx = 0, dz = 0, dist = Infinity, blocked = false;
  const lead = ally && e.ownerProf && isAlive(e.ownerProf.ship) ? e.ownerProf.ship : null;
  if (!tgt && lead) {
    // escort with nothing to fight: keep station beside its captain
    const f = lead.forward(), side = e.station || 1;
    const px = lead.pos.x - f.x * 18 + f.z * 22 * side, pz = lead.pos.z - f.z * 18 - f.x * 22 * side;
    const dd = Math.hypot(px - e.pos.x, pz - e.pos.z);
    desired = dd > 8 ? Math.atan2(px - e.pos.x, pz - e.pos.z) : lead.heading;
    e.sail = dd > 40 ? 1 : dd > 12 ? 2 / 3 : clamp(lead.sail, 1 / 3, 1);
  }
  else if (!tgt) { desired = e.heading + 0.4; e.sail = 1 / 3; }
  else {
    dx = tgt.pos.x - e.pos.x; dz = tgt.pos.z - e.pos.z; dist = Math.hypot(dx, dz);
    const toT = Math.atan2(dx, dz);
    blocked = losBlocked(e.pos.x, e.pos.z, tgt.pos.x, tgt.pos.z);
    if (role === 'fireship') {
      // charge, leading the target, and blow up alongside
      const f = tgt.forward(), T = Math.min(3, dist / Math.max(4, e.speed));
      desired = Math.atan2(tgt.pos.x + f.x * tgt.speed * T - e.pos.x, tgt.pos.z + f.z * tgt.speed * T - e.pos.z);
      e.sail = 1;
      if (dist < 6 * (sc + tgt.scale)) { fireshipExplode(e); return; }
    } else {
      // take up a station around the target according to role
      let slot;
      if (ally) slot = Math.atan2(e.pos.x - tgt.pos.x, e.pos.z - tgt.pos.z);
      else if (role === 'raider') slot = tgt.heading + Math.PI + e.flank * 0.5;   // rake from astern, outside the broadside arcs
      else if (role === 'heavy') slot = tgt.heading + e.flank * 0.4;              // park across the bow
      else if (role === 'ketch') slot = fleet.angle + Math.PI + e.flank * 0.3;    // hang back on the far side
      else slot = fleet.angle + e.slotOff;                                        // line ships spread around the target
      slot += e.losShift;
      const gx = tgt.pos.x + Math.sin(slot) * e.prefRange, gz = tgt.pos.z + Math.cos(slot) * e.prefRange;
      const gd = Math.hypot(gx - e.pos.x, gz - e.pos.z);
      if (dist < 22 * sc) { desired = toT + Math.PI; e.sail = 1; }
      else if (gd > 28 * sc) { desired = Math.atan2(gx - e.pos.x, gz - e.pos.z); e.sail = gd > 70 ? 1 : 2 / 3; }
      else {
        // on station: swing broadside-on, adjusting to hold range
        const a1 = toT + Math.PI / 2, a2 = toT - Math.PI / 2;
        const useA1 = Math.abs(angDiff(a1, e.heading)) < Math.abs(angDiff(a2, e.heading));
        const adj = clamp((dist - e.prefRange) / 40, -0.5, 0.5);
        desired = useA1 ? a1 - adj : a2 + adj;
        e.sail = role === 'raider' ? 2 / 3 : 0.5;
      }
      // land in the way: work around it toward a clear firing line
      if (blocked && role !== 'ketch') e.losShift += dt * 0.45 * e.flank;
      else e.losShift *= Math.max(0, 1 - dt * 0.05);
    }
  }
  desired = avoidObstacles(e, desired);
  // keep some distance from friendly ships
  for (const o of ships) {
    if (o === e || o.kind === 'p' || teamOf(o) !== teamOf(e) || o.sinking) continue;
    const ox = o.pos.x - e.pos.x, oz = o.pos.z - e.pos.z, d = Math.hypot(ox, oz);
    if (d < 12 * (sc + o.scale)) {
      const a = Math.atan2(ox, oz), diff = angDiff(a, e.heading);
      if (Math.abs(diff) < 1.2) desired = a - Math.sign(diff || 1) * 1.4;
    }
  }
  e.steer = clamp(angDiff(desired, e.heading) * 2, -1, 1);
  if (!tgt) return;

  // broadside when the target is abeam and no land is in the way
  if (dist < 115 && !blocked && e.cannonZ.length) {
    for (const side of ['port', 'star']) {
      if (e.reload[side] > 0) continue;
      const sd = e.sideDir(side);
      if ((dx * sd.x + dz * sd.z) / dist > 0.9) {
        const tFlight = dist / (BALL_SPEED * 0.85);
        const pf = tgt.forward();
        const lx = tgt.pos.x + pf.x * tgt.speed * tFlight - e.pos.x, lz = tgt.pos.z + pf.z * tgt.speed * tFlight - e.pos.z;
        const d2 = Math.hypot(lx, lz);
        const elev = 0.5 * Math.asin(clamp(d2 * G / (BALL_SPEED * BALL_SPEED), 0, 1)) - 0.015 + rand(-1, 1) * e.aimErr;
        e.fire(side, clamp(elev, -0.05, 0.75));
      }
    }
  }

  // mortars arc over islands, so hiding is never completely safe
  if (e.kind === 'b' || role === 'ketch') {
    e.mortarT -= dt * e.reloadMul;
    if (e.mortarT <= 0 && dist < 175) {
      if (e.kind === 'b') { e.mortarT = rand(6, 8); enemyMortar(e, tgt, 5, 13, e.dmg + 4); }
      else { e.mortarT = rand(6.5, 8.5); enemyMortar(e, tgt, 3, 9, e.dmg + 2); }
    }
  }
}

// ============================================================
//  Audio (synthesized with WebAudio)
// ============================================================
let actx = null, master, noiseBuf;
function initAudio() {
  if (actx) { actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
  master = actx.createGain(); master.gain.value = 0.55; master.connect(actx.destination);
  noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // ambient sea
  const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 450;
  const g = actx.createGain(); g.gain.value = 0.06;
  const lfo = actx.createOscillator(); lfo.frequency.value = 0.12;
  const lg = actx.createGain(); lg.gain.value = 0.04;
  lfo.connect(lg).connect(g.gain); lfo.start();
  src.connect(f).connect(g).connect(master); src.start();
}
function noiseBurst(vol, dur, type, f0, f1, q = 0.7) {
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(master);
  src.start(t, Math.random()); src.stop(t + dur);
}
function tone(vol, dur, f0, f1, type = 'sine') {
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur);
}
function sfx(name, pos) {
  if (!actx || actx.state !== 'running') return;
  const att = pos ? 1 / (1 + pos.distanceTo(focusPos()) / 35) : 1;
  if (att < 0.04) return;
  switch (name) {
    case 'cannon': noiseBurst(0.9 * att, 1.1, 'lowpass', 1200, 120); tone(0.9 * att, 0.45, 90, 30); break;
    case 'hit': noiseBurst(0.9 * att, 0.7, 'lowpass', 3000, 200); tone(0.6 * att, 0.3, 140, 40, 'triangle'); break;
    case 'splash': noiseBurst(0.35 * att, 0.6, 'bandpass', 1800, 500, 0.8); break;
    case 'thud': noiseBurst(0.5 * att, 0.4, 'lowpass', 800, 100); break;
    case 'pickup': tone(0.25, 0.15, 660, 880, 'triangle'); setTimeout(() => tone(0.25, 0.25, 880, 1320, 'triangle'), 110); break;
    case 'coin': tone(0.2, 0.1, 990, 1320, 'square'); setTimeout(() => tone(0.18, 0.2, 1320, 1760, 'square'), 80); break;
    case 'bell': tone(0.3, 1.2, 880, 870, 'triangle'); tone(0.15, 1.2, 1760, 1740); break;
    case 'boss': tone(0.5, 2.0, 110, 55, 'sawtooth'); tone(0.4, 2.0, 82, 41, 'square'); break;
  }
}

// ============================================================
//  Messages (local + broadcast to guests)
// ============================================================
function showBanner(text, dur = 2.5) {
  const b = $('banner'); b.textContent = text; b.style.opacity = 1;
  clearTimeout(showBanner.t); showBanner.t = setTimeout(() => (b.style.opacity = 0), dur * 1000);
}
function toast(text) {
  const b = $('toast'); b.textContent = text; b.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => (b.style.opacity = 0), 1400);
}
function announce(text, dur = 2.5, prof = null) {
  if (!prof || prof.id === myId) showBanner(text, dur);
  if (!prof || prof.id !== myId) emit(['n', text, dur, prof ? prof.id : null]);
}
function notify(text, prof = null) {
  if (!prof || prof.id === myId) toast(text);
  if (!prof || prof.id !== myId) emit(['t', text, prof ? prof.id : null]);
}
function sfxFor(name, prof = null) {
  if (!prof || prof.id === myId) sfx(name);
  if (!prof || prof.id !== myId) emit(['s', name, prof ? prof.id : null]);
}
function flashDamage() {
  const d = $('dmg'); d.style.transition = 'none'; d.style.opacity = 1;
  requestAnimationFrame(() => { d.style.transition = 'opacity .5s'; d.style.opacity = 0; });
}
function hurtFx() { shake = Math.min(1.4, shake + 0.45); flashDamage(); }

// ============================================================
//  Game flow (host / solo authority)
// ============================================================
const timers = [];
function after(t, fn) { timers.push({ t, fn }); }
function runTimers(dt) {
  for (let i = timers.length - 1; i >= 0; i--) {
    timers[i].t -= dt;
    if (timers[i].t <= 0) { const fn = timers[i].fn; timers.splice(i, 1); fn(); }
  }
}

function makeProfile(id, name, colorIdx, design = DEFAULT_DESIGN) {
  return { id, name, colorIdx, design: cleanDesign(design), gold: 0, earned: 0, kills: 0, up: freshUp(), ammo: 'round', cd: { kegs: 0, mortar: 0, boost: 0 },
           ship: null, respawnT: 0, gen: 0, input: { steer: 0, sail: 2 / 3 } };
}
function giveGold(prof, amt) { prof.gold += amt; prof.earned += amt; sfxFor('coin', prof); }

function clearEntities() {
  for (const s of ships) s.remove();
  ships = [];
  netShips.clear(); netMe = null; menuShip = null; me = null;
  for (const b of balls) scene.remove(b.m); balls.length = 0;
  for (const c of crates) scene.remove(c.m); crates.length = 0;
  for (const w of warnings) scene.remove(w.m); warnings.length = 0;
  for (const k of kegs) scene.remove(k.m); kegs.length = 0;
  for (const p of particles) { scene.remove(p.m); p.m.material.dispose(); } particles.length = 0;
  for (const f of forts) f.reset();
  for (const p of profiles.values()) p.ship = null;
  timers.length = 0;
  fleet.target = null; fleet.brokenT = 0;
  wave = 0; waveClearT = -1; overPending = false; gameActive = false; shake = 0;
  camYaw = Math.PI; camPitch = 0.32; aimElev = 0.22;
  closeShop(true);
}

function makePlayerShip(design, extra = {}) {
  const c = SHIP_CLASSES[design.cls];
  const s = new Ship({ kind: 'p', colors: designColors(design), scale: c.scale, masts: c.masts, cannons: c.guns,
    maxSpeed: c.speed, turnRate: c.turn, reloadTime: c.reload, dmg: c.dmg, spread: c.spread, ...extra });
  s.design = design;
  return s;
}

function spawnPlayerShip(p, x, z, h = 0) {
  if (x === undefined) {
    const mate = [...profiles.values()].map(q => q.ship).find(s => s && isAlive(s) && s.profile !== p);
    if (gameMode === 'coop' && mate) { x = mate.pos.x + rand(-30, 30); z = mate.pos.z + rand(-30, 30); h = mate.heading; }
    else { const a = rand(0, Math.PI * 2), d = rand(60, 140); x = Math.sin(a) * d; z = Math.cos(a) * d; h = a + Math.PI; }
    for (let k = 0; k < 10 && islands.some(o => Math.hypot(o.x - x, o.z - z) < o.r + 15); k++) { x += 25; z += 10; }
  }
  p.gen++;
  const s = makePlayerShip(p.design, { id: `${p.id}#${p.gen}`, colorIdx: p.colorIdx, x, z, heading: h, maxHp: SHIP_CLASSES[p.design.cls].hp });
  s.profile = p; s.pid = p.id; s.name = p.name;
  s.applyStats(p); s.hp = s.maxHp; s.ammo = p.ammo;
  s.sail = p.input.sail;
  ships.push(s);
  p.ship = s; p.respawnT = 0;
  return s;
}

function startMatch() {
  clearEntities();
  const n = profiles.size;
  let i = 0;
  for (const p of profiles.values()) {
    Object.assign(p, { gold: 0, earned: 0, kills: 0, up: freshUp(), ammo: 'round', cd: { kegs: 0, mortar: 0, boost: 0 }, respawnT: 0, input: { steer: 0, sail: 2 / 3 } });
    if (gameMode === 'pvp') { const a = i / n * Math.PI * 2; spawnPlayerShip(p, Math.sin(a) * 90, Math.cos(a) * 90, a + Math.PI / 2); }
    else spawnPlayerShip(p, (i - (n - 1) / 2) * 25, 0, 0);
    i++;
  }
  gameActive = true; state = 'playing'; mySail = 2 / 3;
  setOverlay('');
  lockPointer();
  clock.getDelta();
  broadcast({ t: 'start', mode: gameMode });
  if (gameMode === 'coop') { announce('Set sail, Captain!', 2); after(1.5, () => startWave(1)); }
  else announce('Free-for-all! Sink your rivals for gold!', 3);
}

// pick a fleet for wave n from a growing points budget; new ship types unlock as waves go on
function buildFleetList(n, budget) {
  const list = [];
  let flagUsed = false, guard = 0;
  while (budget >= 1 && list.length < MAX_FLEET && guard++ < 200) {
    const opts = Object.values(ENEMY_TYPES).filter(t => n >= t.from && t.cost <= budget && !(t.unique && flagUsed));
    if (!opts.length) break;
    let r = Math.random() * opts.reduce((a, t) => a + t.weight, 0), pick = opts[0];
    for (const t of opts) { r -= t.weight; if (r <= 0) { pick = t; break; } }
    list.push(pick); budget -= pick.cost;
    if (pick.unique) flagUsed = true;
  }
  return list;
}

function clearSpot(x, z, deep) {
  for (let k = 0; k < 12; k++) {
    const bad = islands.some(o => Math.hypot(o.x - x, o.z - z) < (deep ? o.shallowR : o.r + 12)) || (deep && reefs.some(o => Math.hypot(o.x - x, o.z - z) < o.r + 12));
    if (!bad) break;
    x += rand(-25, 25); z += rand(-25, 25);
  }
  return [x, z];
}

function startWave(n) {
  wave = n;
  const alive = ships.filter(s => s.kind === 'p' && isAlive(s));
  const center = new THREE.Vector3();
  for (const s of alive) center.add(s.pos);
  if (alive.length) center.divideScalar(alive.length);
  const extra = Math.max(0, profiles.size - 1);
  const isBoss = n % 5 === 0;
  const k = n / 5;
  const budget = (1.2 + n * 1.25 + extra * 2) * (isBoss ? 0.5 : 1);
  const list = buildFleetList(n, budget);

  // the whole fleet arrives together from one direction, in formation
  const a = rand(0, Math.PI * 2);
  const dir = new THREE.Vector3(Math.sin(a), 0, Math.cos(a)), perp = new THREE.Vector3(Math.cos(a), 0, -Math.sin(a));
  fleet.angle = a; fleet.target = null; fleet.retargetT = 0; fleet.brokenT = 0;
  const line = list.filter(t => t.role === 'line').length;
  let li = 0, vets = 0;
  list.forEach((type, i) => {
    let fwd = 0, lat = (i - (list.length - 1) / 2) * 22;
    if (type.role === 'heavy' || type.role === 'flag') fwd = -25;
    if (type.role === 'ketch') fwd = 40;
    if (type.role === 'raider') lat = (i % 2 ? 1 : -1) * rand(60, 90);
    if (type.role === 'fireship') { fwd = -40; lat = (i % 2 ? 1 : -1) * rand(20, 50); }
    let x = center.x + dir.x * (220 + fwd) + perp.x * lat, z = center.z + dir.z * (220 + fwd) + perp.z * lat;
    [x, z] = clearSpot(x, z, type.scale >= 0.95);
    const veteran = n >= 7 && type.role !== 'fireship' && Math.random() < Math.min(0.5, 0.08 + 0.025 * (n - 7));
    if (veteran) vets++;
    const ci = type.role === 'flag' ? 5 : veteran ? 4 : Math.floor(Math.random() * 4);
    const e = new Ship({
      kind: 'e', colors: ENEMY_COLORS[ci], colorIdx: ci, scale: type.scale, masts: type.masts, cannons: type.guns,
      x, z, heading: Math.atan2(center.x - x, center.z - z),
      maxHp: Math.round((45 + n * 12) * type.hp * (veteran ? 1.35 : 1)),
      maxSpeed: Math.min(13.5, 9.5 + n * 0.5) + type.speed,
      turnRate: type.turn,
      reloadTime: Math.max(1.9, 3.6 - n * 0.2) * type.reload,
      aimErr: Math.max(0.025, 0.11 - n * 0.012) * (veteran ? 0.5 : 1),
      dmg: (9 + 0.6 * n) * (veteran ? 1.2 : 1),          // enemy shots hit harder every wave
    });
    e.aiType = type; e.role = type.role; e.bounty = type.bounty * (veteran ? 1.5 : 1);
    e.name = veteran ? '★ ' + (type.label || 'Veteran') : type.label;
    e.prefRange = rand(type.range[0], type.range[1]);
    if (type.role === 'line') { e.slotOff = line > 1 ? (li / (line - 1) - 0.5) * 2.6 : 0; li++; }
    e.flank = i % 2 ? 1 : -1;
    e.speed = e.maxSpeed * 0.5;
    ships.push(e);
  });

  if (isBoss) {
    const [x, z] = clearSpot(center.x + dir.x * 245, center.z + dir.z * 245, true);
    const boss = new Ship({
      kind: 'b', colors: BOSS_COLORS, masts: 3, x, z, heading: Math.atan2(center.x - x, center.z - z),
      scale: BOSS_SCALE, cannons: 6, maxHp: 450 + 200 * (k - 1) + 120 * extra, maxSpeed: 9.5,
      reloadTime: 2.4, aimErr: 0.04, turnRate: 0.4, dmg: 12 + 0.6 * n,
    });
    boss.name = BOSS_NAMES[(k - 1) % BOSS_NAMES.length];
    boss.mortarT = 6; boss.prefRange = rand(65, 85); boss.speed = 5; boss.role = 'heavy';
    ships.push(boss);
    announce(`⚠ BOSS: ${boss.name} ⚠`, 3.5);
    sfxFor('boss');
  } else {
    announce(`Wave ${n} — ${list.length} ships approach!`);
    sfxFor('bell');
  }
  // tell captains what is coming
  const counts = {};
  for (const t of list) if (t.label) counts[t.label] = (counts[t.label] || 0) + 1;
  const parts = Object.entries(counts).map(([l, c]) => `${c} ${l}`);
  if (vets) parts.push(`${vets} ★ veteran${vets > 1 ? 's' : ''}`);
  if (parts.length) after(2.8, () => notify('Spotted: ' + parts.join(' · ')));
}

function onShipSunk(s) {
  const killer = s.lastHitBy && s.lastHitBy.profile;
  if (s.kind === 'a') { notify('Your escort has been sunk!', s.ownerProf); spawnCrates(s.pos, 1); return; }
  if (s.selfDestruct) return;   // fireships that blew themselves up pay nothing
  if (s.role === 'flag') { fleet.brokenT = 12; announce('Flagship sunk — the enemy crews lose heart!', 3); }
  if (s.kind === 'p') {
    const prof = s.profile;
    if (!prof) return;
    if (gameMode === 'pvp') {
      prof.respawnT = 6;
      if (killer && killer !== prof) {
        killer.kills++;
        giveGold(killer, 250);
        announce(`${killer.name} sank ${prof.name}!`, 2.5);
      } else announce('Your ship is going down!', 2.5, prof);
    } else {
      // co-op: respawn beside a living crewmate; if nobody is left afloat, hostLogic ends the game
      const mateAlive = [...profiles.values()].some(q => q !== prof && isAlive(q.ship));
      prof.respawnT = mateAlive ? 12 : 0;
      announce('Your ship is going down!', 2.5, prof);
    }
    return;
  }
  // AI ship sunk: killer gets the full bounty, teammates a share
  const reward = Math.round(s.kind === 'b' ? 1000 * Math.max(1, wave / 5) : 100 * Math.max(1, wave) * (s.bounty || 1));
  for (const p of profiles.values()) {
    if (p === killer) { giveGold(p, reward); p.kills++; notify(`Enemy sunk! +${reward} gold`, p); }
    else { const share = Math.round(reward * 0.4); giveGold(p, share); notify(`Crewmate sank a ship! +${share} gold`, p); }
  }
  if (s.kind === 'b') { announce(`${s.name} has been sunk!`, 3); spawnCrates(s.pos, 5, 9); }
  else spawnCrates(s.pos);
}

function hostLogic(dt) {
  for (const p of profiles.values()) {
    for (const k in p.cd) p.cd[k] = Math.max(0, p.cd[k] - dt);
    if (p.ship) p.ship.ammo = p.ammo;
    if (p.ship && !isAlive(p.ship) && p.respawnT > 0 && !overPending) {
      p.respawnT -= dt;
      if (p.respawnT <= 0) { spawnPlayerShip(p); announce('Back at the helm!', 1.5, p); }
    }
  }
  if (gameMode !== 'coop') return;
  const alive = [...profiles.values()].some(p => isAlive(p.ship));
  if (!alive && !overPending) { overPending = true; announce('All hands lost!', 3); after(3.5, gameOver); }
  if (wave > 0 && alive && !ships.some(s => teamOf(s) === 'E' && !s.sinking && !s.dead)) {
    if (waveClearT < 0) {
      waveClearT = 7;
      announce(`Wave ${wave} cleared!`, 2.5);
      for (const p of profiles.values()) {
        if (isAlive(p.ship)) p.ship.hp = Math.min(p.ship.maxHp, p.ship.hp + 20);
        giveGold(p, 50 * wave);
      }
      after(2.6, () => notify(`+${50 * wave} gold bounty — press B to visit the shipwright`));
    }
    waveClearT -= dt;
    if (waveClearT <= 0) { waveClearT = -1; startWave(wave + 1); }
  }
}

function gameOver() {
  const data = { wave, mode: gameMode, players: [...profiles.values()].map(p => [p.name, p.earned, p.kills]) };
  emit(['over', data]);
  sendSnapshot();
  showGameOver(data);
}

function escortCount(prof) { return ships.filter(x => x.kind === 'a' && x.ownerProf === prof && isAlive(x)).length; }
function spawnEscort(prof) {
  const lead = prof.ship;
  const station = escortCount(prof) % 2 ? -1 : 1;
  const f = lead.forward();
  const e = new Ship({
    kind: 'a', colors: designColors(prof.design), x: lead.pos.x - f.x * 20 + f.z * 22 * station, z: lead.pos.z - f.z * 20 - f.x * 22 * station,
    heading: lead.heading, scale: 0.9, masts: 2, cannons: 4, maxHp: 150 + 15 * wave, maxSpeed: 14.5, turnRate: 0.7,
    reloadTime: 2.4, aimErr: 0.03, dmg: 10 + 0.5 * wave,
  });
  e.ownerProf = prof; e.profile = prof; e.station = station; e.design = prof.design;
  e.name = `${prof.name}'s escort`; e.regen = e.maxHp / 80; e.prefRange = rand(45, 60);
  e.speed = lead.speed; e.sail = lead.sail;
  ships.push(e);
}

function useAbility(prof, k, ax, az) {
  const s = prof.ship, L = prof.up[k] || 0;
  if (!L || !isAlive(s) || !gameActive || prof.cd[k] > 0) return;
  if (k === 'kegs') {
    const n = 2 + L, f = s.forward();
    for (let i = 0; i < n; i++) {
      const sx = (i - (n - 1) / 2) * 4;
      addKeg('k' + (++kegSeq), s.pos.x - f.x * 9 * s.scale + f.z * sx, s.pos.z - f.z * 9 * s.scale - f.x * sx, s, 30 + 15 * L + 0.5 * wave);
    }
    notify('Powder kegs dropped!', prof);
  } else if (k === 'mortar') {
    if (ax == null || Math.hypot(ax - s.pos.x, az - s.pos.z) > 170) return;
    const n = 4 + 2 * L, dmg = 22 + 8 * L + 0.5 * wave;
    for (let i = 0; i < n; i++) {
      const tx = ax + (i ? rand(-7, 7) : 0), tz = az + (i ? rand(-7, 7) : 0), T = 2.2, delay = i * 0.14;
      warnAt(tx, tz, T + delay, 0xffc030);
      after(delay, () => {
        if (!isAlive(s)) return;
        const from = s.local(0, 4, 0);
        const vel = new THREE.Vector3((tx - from.x) / T, (0 - from.y + 0.5 * G * T * T) / T, (tz - from.z) / T);
        spawnBall(from, vel, s, { aoe: 7, dmg });
        fx.muzzle(from, vel.clone().normalize());
        sfx('cannon', from);
      });
    }
  } else if (k === 'boost') {
    s.boostT = 3 + L;
    notify('Full speed ahead!', prof);
  }
  prof.cd[k] = ABILITIES[k].cd(L);
  sfxFor('bell', prof);
}

function applyBuy(prof, key) {
  const u = UPGRADES[key];
  if (!u) return;
  const s = prof.ship;
  const lvl = prof.up[key] || 0;
  let cost;
  if (key === 'escort') {
    if (gameMode !== 'coop' || !isAlive(s) || escortCount(prof) >= MAX_ESCORTS || prof.gold < ESCORT_COST) return;
    prof.gold -= ESCORT_COST;
    spawnEscort(prof);
    notify('An escort frigate joins your fleet!', prof);
    sfxFor('bell', prof);
    return;
  }
  if (key === 'repair') {
    if (!isAlive(s) || s.hp >= s.maxHp) return;
    cost = repairCost(s);
  } else {
    if (lvl >= u.max) return;
    cost = u.cost[lvl];
  }
  if (prof.gold < cost) return;
  prof.gold -= cost;
  if (key === 'repair') s.hp = s.maxHp;
  else {
    prof.up[key] = lvl + 1;
    if (s && !s.dead) s.applyStats(prof);
    if (u.cat === 'ammo') { prof.ammo = key.slice(5); if (s) s.ammo = prof.ammo; }   // auto-load newly bought ammo
  }
  notify(`${u.name}${key === 'repair' ? '' : ' — level ' + (lvl + 1)}!`, prof);
  sfxFor('pickup', prof);
}

// ============================================================
//  Networking (PeerJS / WebRTC, host-authoritative)
// ============================================================
function genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
function broadcast(msg) { for (const c of net.conns.values()) if (c.open) { try { c.send(msg); } catch {} } }
function leaveNet() {
  const peer = net.peer;
  net.mode = 'solo'; net.peer = null; net.hostConn = null; net.conns.clear(); net.events = [];
  net.token = (net.token || 0) + 1;   // invalidates any connection still being set up
  if (peer) try { peer.destroy(); } catch {}
}
function lobbyInfo() { return { t: 'lobby', mode: gameMode, players: [...profiles.values()].map(p => [p.name, p.colorIdx]) }; }
function broadcastLobby() { broadcast(lobbyInfo()); }

function startHost() {
  if (!window.Peer) { showMainMenu('Online play needs the PeerJS library — check your internet connection.'); return; }
  leaveNet();
  clearEntities(); profiles.clear();
  net.mode = 'host'; myId = 'host'; state = 'lobby';
  profiles.set(myId, makeProfile(myId, myName, 0, myDesign));
  net.code = genCode();
  renderHostLobby('Opening a room…');
  const token = net.token;
  getPeerOpts().then(opts => { if (token === net.token && net.mode === 'host') openHostPeer(opts); });
}

function openHostPeer(opts) {
  const peer = new Peer(PEER_PREFIX + net.code, opts);
  net.peer = peer;
  peer.on('open', () => { if (state === 'lobby') renderHostLobby(); });
  peer.on('connection', (conn) => {
    conn.on('data', (m) => onGuestMsg(conn, m));
    conn.on('close', () => onGuestLeft(conn));
    conn.on('error', () => onGuestLeft(conn));
  });
  peer.on('disconnected', () => { try { if (net.peer === peer) peer.reconnect(); } catch {} });
  peer.on('error', (err) => {
    if (net.peer !== peer) return;
    if (err.type === 'unavailable-id') startHost();
    else if (state === 'lobby') renderHostLobby('Network error: ' + err.type);
  });
}

function onGuestMsg(conn, m) {
  if (net.mode !== 'host' || !m || typeof m !== 'object') return;
  const prof = profiles.get(conn.peer);
  switch (m.t) {
    case 'join': {
      if (prof) return;
      if (profiles.size >= MAX_PLAYERS) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 300); return; }
      const used = new Set([...profiles.values()].map(p => p.colorIdx));
      let ci = 0; while (used.has(ci)) ci++;
      const name = String(m.name || 'Pirate').slice(0, 16) || 'Pirate';
      const p = makeProfile(conn.peer, name, ci, designFromArr(m.design));
      profiles.set(conn.peer, p);
      net.conns.set(conn.peer, conn);
      conn.send({ t: 'welcome', id: conn.peer });
      broadcastLobby();
      if (state === 'lobby') renderHostLobby();
      if (gameActive) {
        conn.send({ t: 'start', mode: gameMode });
        spawnPlayerShip(p);
        announce(`${name} has joined the battle!`, 2);
      }
      break;
    }
    case 'in':
      if (prof) { prof.input.steer = clamp(+m.s || 0, -1, 1); prof.input.sail = clamp(+m.l || 0, 0, 1); }
      break;
    case 'fire':
      if (prof && gameActive && isAlive(prof.ship)) prof.ship.fire(m.side === 'port' ? 'port' : 'star', clamp(+m.e || 0, 0, 0.44));
      break;
    case 'ammo': {
      const a = AMMO[m.a];
      if (prof && a && (!a.unlock || prof.up[a.unlock])) prof.ammo = m.a;
      break;
    }
    case 'ab':
      if (prof && ABILITIES[m.k]) useAbility(prof, m.k, Number.isFinite(m.x) ? m.x : null, Number.isFinite(m.z) ? m.z : null);
      break;
    case 'buy':
      if (prof && gameActive) applyBuy(prof, String(m.k));
      break;
  }
}

function onGuestLeft(conn) {
  const p = profiles.get(conn.peer);
  net.conns.delete(conn.peer);
  if (!p || net.mode !== 'host') return;
  profiles.delete(conn.peer);
  if (p.ship && !p.ship.dead) p.ship.remove();
  announce(`${p.name} has left`, 2);
  broadcastLobby();
  if (state === 'lobby') renderHostLobby();
}

function buildSnapshot() {
  return {
    t: 'snap', w: wave, m: gameMode,
    s: ships.filter(s => !s.dead && s !== menuShip).map(s => [
      s.id, s.kind, r2(s.pos.x), r2(s.pos.z), r2(s.heading), r2(s.speed), r2(s.sail),
      Math.ceil(s.hp), s.maxHp, s.sinking ? 1 : 0, s.colorIdx, s.cannonCount,
      r2(s.reload.port), r2(s.reload.star), r2(s.reloadTime), s.pid, s.name, s.design ? designArr(s.design) : s.aiType ? ['ai', s.aiType.scale, s.aiType.masts, s.role] : 0,
      (s.burnT > 0 ? 1 : 0) | (s.slowT > 0 ? 2 : 0) | (s.boostT > 0 ? 4 : 0) | (s.repairing ? 8 : 0)]),
    f: forts.map(f => [Math.ceil(f.hp), f.destroyed ? 1 : 0, r2(f.aim)]),
    c: crates.map(c => [c.id, r2(c.x), r2(c.z)]),
    p: [...profiles.values()].map(p => [p.id, p.name, p.gold, p.earned, p.kills,
      p.up, r2(p.respawnT), p.colorIdx, p.ammo, p.cd]),
    k: kegs.map(k => [k.id, r2(k.x), r2(k.z)]),
    ev: net.events,
  };
}
function sendSnapshot() {
  if (net.mode === 'host' && net.conns.size) broadcast(buildSnapshot());
  net.events = [];
}

// ---------- guest side ----------
function startJoin(code) {
  code = String(code || '').trim().toUpperCase();
  if (!code) { showMainMenu('Enter a room code to join.'); return; }
  if (!window.Peer) { showMainMenu('Online play needs the PeerJS library — check your internet connection.'); return; }
  leaveNet();
  clearEntities(); profiles.clear(); netPlayers.clear();
  net.mode = 'guest'; state = 'lobby'; myId = null; net.lobby = [];
  net.lastCode = code;
  renderGuestLobby(`Step 1/3: reaching the matchmaking server…`);
  const token = net.token;
  getPeerOpts().then(opts => { if (token === net.token && net.mode === 'guest') openGuestPeer(opts, code); });
}

function openGuestPeer(opts, code) {
  const peer = new Peer(opts);
  net.peer = peer;
  // never hang forever: give up with a useful message
  clearTimeout(net.joinTimer);
  net.joinTimer = setTimeout(() => {
    if (net.peer !== peer || myId) return;
    hostLost(`Could not connect to room ${code} (stuck at: ${net.joinStage}). ` +
      'Check the code, make sure the host’s game tab is still open on the lobby screen, and try again. ' +
      'If it keeps failing, one of your networks (school/office Wi-Fi, some mobile data) may be blocking direct connections — try another network or a phone hotspot.');
  }, JOIN_TIMEOUT);
  net.joinStage = 'matchmaking server';
  peer.on('open', () => {
    net.joinStage = 'finding the host';
    renderGuestLobby(`Step 2/3: looking for room ${code}…`);
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    net.hostConn = conn;
    conn.on('iceStateChanged', (s) => {
      if (net.hostConn !== conn || myId) return;
      net.joinStage = 'direct connection (' + s + ')';
      if (s === 'checking') renderGuestLobby(`Step 3/3: found room ${code}, opening a direct connection…`);
      if (s === 'failed') hostLost(`Found room ${code}, but your browsers could not connect directly. One of the networks is blocking it — try another Wi-Fi or a phone hotspot.`);
    });
    conn.on('open', () => { net.joinStage = 'joining the crew'; conn.send({ t: 'join', name: myName, design: designArr(myDesign) }); });
    conn.on('data', onHostMsg);
    conn.on('close', () => { if (net.hostConn === conn) hostLost('The host closed the game.'); });
    conn.on('error', (e) => { if (net.hostConn === conn && !myId) hostLost('Connection error: ' + (e && e.type || e)); });
  });
  peer.on('error', (err) => {
    if (net.peer !== peer) return;
    hostLost(err.type === 'peer-unavailable' ? `Room ${code} was not found — check the code and that the host is still in the lobby.` : 'Network error: ' + err.type);
  });
}

function hostLost(msg) {
  if (net.mode !== 'guest') return;
  clearTimeout(net.joinTimer);
  leaveNet();
  if (document.pointerLockElement) document.exitPointerLock();
  showMainMenu(msg);
}

function onHostMsg(m) {
  if (net.mode !== 'guest' || !m) return;
  switch (m.t) {
    case 'welcome': myId = m.id; clearTimeout(net.joinTimer); renderGuestLobby(); break;
    case 'full': hostLost('That room is full (4 captains max).'); break;
    case 'lobby':
      net.lobby = m.players; gameMode = m.mode;
      if (state === 'lobby') renderGuestLobby();
      break;
    case 'start':
      clearEntities();
      gameMode = m.mode; gameActive = true; mySail = 2 / 3;
      state = 'paused';
      pausePanel('The battle begins!', '⚓ Take the helm');
      break;
    case 'snap':
      applySnapshot(m);
      for (const ev of m.ev || []) handleEvent(ev);
      break;
  }
}

function entById(id) { return ships.find(s => s.id === id) || forts.find(f => f.id === id) || null; }

function handleEvent(ev) {
  switch (ev[0]) {
    case 'b': {
      const pos = new THREE.Vector3(ev[1], ev[2], ev[3]), vel = new THREE.Vector3(ev[4], ev[5], ev[6]);
      spawnBall(pos, vel, entById(ev[7]), { aoe: ev[8], ammo: AMMO_IDS[ev[9]] || 'round' });
      fx.muzzle(pos, vel.clone().normalize());
      sfx('cannon', pos);
      break;
    }
    case 'x': {
      const p = new THREE.Vector3(ev[1], ev[2], ev[3]);
      let bi = -1, bd = 6;
      balls.forEach((b, i) => { const d = b.m.position.distanceTo(p); if (d < bd) { bd = d; bi = i; } });
      if (bi >= 0) removeBall(bi);
      fx.explosion(p, ev[4]); sfx('hit', p);
      break;
    }
    case 'w': warnAt(ev[1], ev[2], ev[3], ev[4]); break;
    case 'n': if (ev[3] == null || ev[3] === myId) showBanner(ev[1], ev[2]); break;
    case 't': if (ev[2] == null || ev[2] === myId) toast(ev[1]); break;
    case 's': if (ev[2] == null || ev[2] === myId) sfx(ev[1]); break;
    case 'over': showGameOver(ev[1]); break;
  }
}

function applySnapshot(m) {
  wave = m.w; gameMode = m.m;
  const seen = new Set();
  let mine = null;
  for (const a of m.s) {
    const [id, kind, x, z, h, sp, sail, hp, maxHp, sink, ci, cn, rp, rs, rt, pid, name, des, fl] = a;
    seen.add(id);
    let s = netShips.get(id);
    if (!s) {
      if (kind === 'p' || kind === 'a') s = makePlayerShip(designFromArr(des), { id, colorIdx: ci, x, z, heading: h, cannons: cn, maxHp });
      else s = new Ship({ kind, id, colors: kind === 'b' ? BOSS_COLORS : ENEMY_COLORS[ci % ENEMY_COLORS.length], colorIdx: ci,
        x, z, heading: h, scale: kind === 'b' ? BOSS_SCALE : (des && des[0] === 'ai' ? des[1] : 1),
        masts: kind === 'b' ? 3 : (des && des[0] === 'ai' ? des[2] : 2), cannons: cn, maxHp });
      s.remote = true; s.pid = pid; s.name = name; s.hp = hp;
      netShips.set(id, s); ships.push(s);
    }
    if (s.dead) continue;
    s.net = { x, z, h, sp };
    s.sail = sail; s.maxHp = maxHp;
    if (des && des[0] === 'ai') s.role = des[3];
    s.burnT = fl & 1 ? 0.3 : 0; s.slowT = fl & 2 ? 0.3 : 0; s.boostT = fl & 4 ? 0.3 : 0; s.repairing = !!(fl & 8);
    if (pid === myId && hp < s.hp - 0.5) hurtFx();
    s.hp = hp;
    s.reload.port = rp; s.reload.star = rs; s.reloadTime = rt;
    if (cn !== s.cannonCount) s.setCannons(cn);
    if (sink && !s.sinking) s.beginSinkFx();
    if (pid === myId && (!mine || (mine.sinking && !s.sinking))) mine = s;
  }
  for (const [id, s] of netShips) if (!seen.has(id)) { if (!s.dead) s.remove(); netShips.delete(id); }
  netMe = mine;

  m.f.forEach(([hp, d, aim], i) => { const f = forts[i]; if (!f) return; f.hp = hp; f.aim = aim; if (d) f.setDestroyed(true); else f.destroyed = false; });

  const ids = new Set(m.c.map(c => c[0]));
  for (let i = crates.length - 1; i >= 0; i--) if (!ids.has(crates[i].id)) { scene.remove(crates[i].m); crates.splice(i, 1); }
  for (const [id, x, z] of m.c) if (!crates.some(c => c.id === id)) addCrate(id, x, z);

  netPlayers.clear();
  for (const [id, name, gold, earned, kills, up, respawnT, ci, ammo, cd] of m.p) {
    netPlayers.set(id, { id, name, gold, earned, kills, respawnT, colorIdx: ci, up: { ...freshUp(), ...up }, ammo, cd: cd || {} });
  }
  const kids = new Set((m.k || []).map(k => k[0]));
  for (let i = kegs.length - 1; i >= 0; i--) if (!kids.has(kegs[i].id)) { scene.remove(kegs[i].m); kegs.splice(i, 1); }
  for (const [id, x, z] of m.k || []) if (!kegs.some(k => k.id === id)) addKeg(id, x, z, null, 0);
}

function netTick(dt) {
  if (net.mode === 'host') {
    net.snapT -= dt;
    if (net.snapT <= 0) { net.snapT = 0.05; sendSnapshot(); }
  } else if (net.mode === 'guest' && gameActive && net.hostConn && net.hostConn.open) {
    net.inT -= dt;
    if (net.inT <= 0) { net.inT = 0.05; net.hostConn.send({ t: 'in', s: localSteer, l: mySail }); }
  }
}
function sendToHost(msg) { if (net.hostConn && net.hostConn.open) net.hostConn.send(msg); }

function showMainMenu(msg = '') {

  leaveNet();

function renderShop() {

  const sig = JSON.stringify([prof.gold, prof.up, me ? Math.ceil(me.hp) : 0, me ? me.maxHp : 0, ships.filter(x => x.kind === 'a' && isAlive(x)).length]);

  const escorts = net.mode === 'guest' ? ships.filter(x => x.kind === 'a' && x.name === prof.name + "'s escort" && isAlive(x)).length : escortCount(prof);

      if (key === 'repair') {
        cost = repairCost(me); info = me ? `${Math.ceil(me.hp)} / ${me.maxHp}` : '';
        can = isAlive(me) && me.hp < me.maxHp && prof.gold >= cost;
      } else if (key === 'escort') {
        cost = ESCORT_COST; info = gameMode === 'coop' ? `${escorts} / ${MAX_ESCORTS} sailing` : 'co-op only';
        maxed = escorts >= MAX_ESCORTS;
        can = gameMode === 'coop' && isAlive(me) && !maxed && prof.gold >= cost;
      } else {
        maxed = lvl >= u.max; cost = maxed ? 0 : u.cost[lvl];

// ============================================================
//  Aim preview
// ============================================================
function aimSide() { return Math.sin(camYaw) < 0 ? 'port' : 'star'; }
function aimElevation() { return aimElev; }

// ---- shot simulation shared by the aim display ----
const AIM_DT = 0.04;
let aimPoint = null;
function aimCanHit(s) { return s !== me && isAlive(s) && (teamOf(s) !== teamOf(me) || (gameMode === 'pvp' && s.kind === 'p')); }
// steps a cannonball forward; stops on water, land, or an enemy hull/fort
function simulateShot(p, v, t, pts) {
  for (let i = 0; i < 160; i++) {
    v.y -= G * AIM_DT;
    p.addScaledVector(v, AIM_DT);
    if (pts) pts.push(p.clone());
    for (const s of ships) if (aimCanHit(s) && hitShip(s, p)) return { end: p, hit: 'target' };
    for (const f of forts) if (f.hit(p)) return { end: p, hit: 'target' };
    for (const isl of islands) {
      const d = Math.hypot(p.x - isl.x, p.z - isl.z);
      if (d < isl.r && p.y < isl.h * (1 - d / isl.r) + 1.5) return { end: p, hit: 'land' };
    }
    if (p.y < waveHeight(p.x, p.z, t)) return { end: p, hit: null };
  }
  return { end: p, hit: null };
}
function shotStart(side, cz, elev) {
  const sd = me.sideDir(side);
  const p = me.local(side === 'port' ? 3.15 : -3.15, 1.05, cz);
  const v = new THREE.Vector3(sd.x * Math.cos(elev), Math.sin(elev), sd.z * Math.cos(elev))
    .multiplyScalar(BALL_SPEED).addScaledVector(me.forward(), me.speed);
  return [p, v];
}

// ---- flowing trajectory ribbon (billboarded toward the camera) ----
const ARC_N = 170;
const arcPos = new Float32Array(ARC_N * 2 * 3), arcLine = new Float32Array(ARC_N * 2 * 2);
const arcGeo = new THREE.BufferGeometry();
arcGeo.setAttribute('position', new THREE.BufferAttribute(arcPos, 3));
arcGeo.setAttribute('aLine', new THREE.BufferAttribute(arcLine, 2));
const arcIdx = [];
for (let i = 0; i < ARC_N - 1; i++) { const a = i * 2; arcIdx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
arcGeo.setIndex(arcIdx);
const arcMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
  uniforms: { uColor: { value: new THREE.Color() }, uTime: { value: 0 } },
  vertexShader: `attribute vec2 aLine; varying vec2 vL;
    void main(){ vL = aLine; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 uColor; uniform float uTime; varying vec2 vL;
    void main(){
      float dash = step(0.4, fract(vL.x * 0.3 - uTime * 1.8));
      float a = mix(0.2, 0.95, vL.y) * mix(0.35, 1.0, dash);
      gl_FragColor = vec4(uColor * mix(0.75, 1.3, dash), a);
      #include <colorspace_fragment>
    }`,
});
const arcMesh = new THREE.Mesh(arcGeo, arcMat);
arcMesh.frustumCulled = false;
arcMesh.renderOrder = 9;

// ---- impact zone covering the whole broadside's landing spread ----
const zoneMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, depthTest: false, fog: false,
  uniforms: { uColor: { value: new THREE.Color() }, uTime: { value: 0 }, uFill: { value: 1 }, uSize: { value: new THREE.Vector2(10, 5) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 uColor; uniform float uTime, uFill; uniform vec2 uSize; varying vec2 vUv;
    void main(){
      vec2 p = (vUv - 0.5) * uSize;
      float r = 1.6;
      vec2 q = abs(p) - (uSize * 0.5 - r);
      float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;   // rounded-rectangle distance
      if (d > 0.0) discard;
      float edge = smoothstep(-0.6, 0.0, d);
      float stripes = 0.5 + 0.5 * sin((p.x + p.y) * 1.4 - uTime * 5.0);
      float filled = step(vUv.x, uFill);
      float a = edge * 0.95 + (0.10 + 0.12 * stripes) * mix(0.3, 1.0, filled);
      gl_FragColor = vec4(uColor, a);
      #include <colorspace_fragment>
    }`,
});
const zone = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), zoneMat);
zone.renderOrder = 10;

// per-cannon impact markers and a rotating center reticle
const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, depthTest: false, depthWrite: false, fog: false });
const DOT_GEO = new THREE.RingGeometry(0.45, 0.85, 18).rotateX(-Math.PI / 2);
const dots = [];
for (let i = 0; i < 10; i++) { const d = new THREE.Mesh(DOT_GEO, dotMat); d.renderOrder = 11; dots.push(d); }
const reticle = new THREE.Group();
reticle.add(new THREE.Mesh(new THREE.RingGeometry(2.3, 2.65, 40).rotateX(-Math.PI / 2), dotMat));
for (let i = 0; i < 4; i++) {
  const tick = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 1.4).rotateX(-Math.PI / 2), dotMat);
  const a = i * Math.PI / 2;
  tick.position.set(Math.sin(a) * 3.3, 0, Math.cos(a) * 3.3); tick.rotation.y = a;
  reticle.add(tick);
}
reticle.traverse(o => { o.renderOrder = 11; });
scene.add(arcMesh, zone, reticle, ...dots);

const AIM_COLORS = { ready: new THREE.Color(0xffd34d), target: new THREE.Color(0x4dff88), reload: new THREE.Color(0x9aa7b5), land: new THREE.Color(0xd08a40) };
const _tan = new THREE.Vector3(), _toCam = new THREE.Vector3(), _perp = new THREE.Vector3();

function updateAimPreview(t) {
  const label = $('aimLabel');
  const visible = state === 'playing' && !shopOpen && isAlive(me) && me !== menuShip;
  arcMesh.visible = zone.visible = reticle.visible = visible;
  if (!visible) { dots.forEach(d => (d.visible = false)); label.style.display = 'none'; aimPoint = null; return; }

  const side = aimSide(), elev = aimElevation();
  // 1) one landing point per cannon on this side
  const lands = [];
  let anyTarget = false, allLand = true;
  me.cannonZ.forEach((cz, i) => {
    const [p, v] = shotStart(side, cz, elev);
    const r = simulateShot(p, v, t, null);
    lands.push(r.end);
    if (r.hit === 'target') anyTarget = true;
    if (r.hit !== 'land') allLand = false;
    const d = dots[i];
    d.visible = true;
    d.position.set(r.end.x, waveHeight(r.end.x, r.end.z, t) + 0.3, r.end.z);
  });
  for (let i = me.cannonZ.length; i < dots.length; i++) dots[i].visible = false;

  // 2) the center trajectory as a flowing ribbon
  const mid = me.cannonZ.reduce((a, b) => a + b, 0) / me.cannonZ.length;
  const [p0, v0] = shotStart(side, mid, elev);
  const pts = [p0.clone()];
  simulateShot(p0, v0, t, pts);
  const n = Math.min(pts.length, ARC_N);
  let dist = 0;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[Math.min(i + 1, n - 1)], c = pts[Math.max(i - 1, 0)];
    _tan.subVectors(b, c).normalize();
    _toCam.subVectors(camera.position, a);
    _perp.crossVectors(_tan, _toCam).normalize();
    const f = i / Math.max(1, n - 1), w = 0.16 + 0.34 * f;
    if (i > 0) dist += a.distanceTo(pts[i - 1]);
    arcPos.set([a.x + _perp.x * w, a.y + _perp.y * w, a.z + _perp.z * w, a.x - _perp.x * w, a.y - _perp.y * w, a.z - _perp.z * w], i * 6);
    arcLine.set([dist, f, dist, f], i * 4);
  }
  arcGeo.setDrawRange(0, Math.max(0, n - 1) * 6);
  arcGeo.attributes.position.needsUpdate = true;
  arcGeo.attributes.aLine.needsUpdate = true;

  // 3) impact zone spanning all landing points, aligned with the ship
  const fwd = me.forward();
  const c = new THREE.Vector3();
  lands.forEach(l => c.add(l));
  c.divideScalar(lands.length);
  let lo = Infinity, hi = -Infinity;
  for (const l of lands) { const k = (l.x - c.x) * fwd.x + (l.z - c.z) * fwd.z; lo = Math.min(lo, k); hi = Math.max(hi, k); }
  const len = (hi - lo) + 6 * me.scale, wid = 5.5 * me.scale;
  const cy = waveHeight(c.x, c.z, t) + 0.3;
  zone.position.set(c.x + fwd.x * (lo + hi) / 2, cy, c.z + fwd.z * (lo + hi) / 2);
  zone.rotation.y = me.heading - Math.PI / 2;
  zone.scale.set(len, 1, wid);
  zoneMat.uniforms.uSize.value.set(len, wid);
  aimRange = Math.hypot(c.x - me.pos.x, c.z - me.pos.z);
  aimPoint = { x: zone.position.x, z: zone.position.z };

  // 4) state: on target / ready / blocked by land / reloading
  const reload = me.reload[side], ready = reload <= 0;
  const col = !ready ? AIM_COLORS.reload : anyTarget ? AIM_COLORS.target : allLand ? AIM_COLORS.land : AIM_COLORS.ready;
  arcMat.uniforms.uColor.value.copy(col);
  zoneMat.uniforms.uColor.value.copy(col);
  dotMat.color.copy(col);
  arcMat.uniforms.uTime.value = zoneMat.uniforms.uTime.value = t;
  zoneMat.uniforms.uFill.value = ready ? 1 : clamp(1 - reload / me.reloadTime, 0, 1);
  reticle.position.set(zone.position.x, cy + 0.05, zone.position.z);
  reticle.rotation.y = t * (anyTarget ? 2.5 : 0.6);
  reticle.scale.setScalar(me.scale * (anyTarget && ready ? 1 + 0.12 * Math.sin(t * 10) : 1));

  // 5) floating label above the impact zone
  TV.set(zone.position.x, cy + 4, zone.position.z).project(camera);
  if (TV.z > 1) { label.style.display = 'none'; return; }
  label.style.display = 'block';
  label.style.left = ((TV.x * 0.5 + 0.5) * innerWidth) + 'px';
  label.style.top = ((-TV.y * 0.5 + 0.5) * innerHeight) + 'px';
  label.style.color = '#' + col.getHexString(THREE.SRGBColorSpace);
  const m = `${Math.round(aimRange)} m`;
  label.textContent = !ready ? `Reloading ${reload.toFixed(1)}s · ${m}`
    : anyTarget ? `◎ ON TARGET · ${m}` : allLand ? `Blocked by land · ${m}` : m;
}

function selectAmmo(k) {
  const prof = myProf(), a = AMMO[k];
  if (!prof || !a) return;
  if (a.unlock && !prof.up[a.unlock]) { toast(`${a.name} shot is locked — buy it at the shipwright (B)`); return; }
  if (net.mode === 'guest') { sendToHost({ t: 'ammo', a: k }); prof.ammo = k; }
  else { prof.ammo = k; if (prof.ship) prof.ship.ammo = k; }
  toast(`${a.icon} ${a.name} shot loaded`);
}
function triggerAbility(k) {
  const prof = myProf();
  if (!prof || !isAlive(me)) return;
  if (!prof.up[k]) { toast(`${UPGRADES[k].name} not owned — buy it at the shipwright (B)`); return; }
  if ((prof.cd[k] || 0) > 0) { toast(`${UPGRADES[k].name} ready in ${Math.ceil(prof.cd[k])}s`); return; }
  const ax = aimPoint ? aimPoint.x : null, az = aimPoint ? aimPoint.z : null;
  if (net.mode === 'guest') sendToHost({ t: 'ab', k, x: ax, z: az });
  else useAbility(prof, k, ax, az);
}

// Q/E: first press swings the view and aim to that broadside; pressing again (once aimed) fires
function aimOrFire(side) {
  if (aimSide() === side && camYawTarget === null) { fireSide(side); return; }
  camYawTarget = side === 'port' ? -SIDE_VIEW_YAW : SIDE_VIEW_YAW;
}

function fireSide(side) {
  if (!isAlive(me) || me === menuShip) return;
  const elev = aimElevation();
  if (net.mode === 'guest') { if (me.reload[side] <= 0) sendToHost({ t: 'fire', side, e: elev }); }
  else me.fire(side, elev);
}

// ============================================================
//  HUD
// ============================================================
const TV = new THREE.Vector3();
function updateTag(ent, wx, wy, wz, label, frac, color) {
  if (!ent.tag) {
    const d = document.createElement('div');
    d.className = 'tag';
    d.innerHTML = '<div class="nm"></div><div class="ebar"><div></div></div>';
    hud.appendChild(d);
    ent.tag = d; d._label = null;
  }
  const d = ent.tag;
  TV.set(wx, wy, wz);
  const dist = TV.distanceTo(camera.position);
  TV.project(camera);
  if (TV.z > 1 || dist > 320) { d.style.display = 'none'; return; }
  d.style.display = 'block';
  d.style.left = ((TV.x * 0.5 + 0.5) * innerWidth) + 'px';
  d.style.top = ((-TV.y * 0.5 + 0.5) * innerHeight) + 'px';
  if (d._label !== label) { d.firstChild.textContent = label; d._label = label; }
  const fill = d.lastChild.firstChild;
  fill.style.width = (clamp(frac, 0, 1) * 100) + '%';
  fill.style.background = color;
}
function removeTag(ent) { if (ent.tag) { ent.tag.remove(); ent.tag = null; } }

const mm = $('minimap').getContext('2d'), bm = $('bigmap').getContext('2d');
let bigMapOpen = false;
function toggleBigMap(v = !bigMapOpen) { bigMapOpen = v; $('bigmapWrap').style.display = v ? 'flex' : 'none'; }
function updateHUD() {
  const prof = myProf();
  const hp = isAlive(me) ? me.hp / me.maxHp : 0;
  const fill = $('hpFill');
  fill.style.width = (hp * 100) + '%';
  fill.style.background = hp > 0.5 ? 'linear-gradient(#7fe07a,#2f9a3a)' : hp > 0.25 ? 'linear-gradient(#ffd56a,#d18b12)' : 'linear-gradient(#ff7a6a,#b0201a)';
  $('gold').textContent = `Gold: ${prof ? prof.gold : 0}`;
  if (gameMode === 'pvp') {
    $('wave').textContent = `Kills: ${prof ? prof.kills : 0}`;
    $('foes').textContent = `Rivals: ${ships.filter(s => s.kind === 'p' && isAlive(s) && s !== me).length}`;
  } else {
    $('wave').textContent = `Wave ${wave}`;
    $('foes').textContent = `Foes: ${ships.filter(s => teamOf(s) === 'E' && isAlive(s)).length}`;
  }
  $('repairing').textContent = isAlive(me) && me.repairing ? '🔧 repairing' : '';
  // ammo + abilities bar
  if (prof) {
    const ammo = prof.ammo || 'round', cd = prof.cd || {};
    let html = '';
    for (const [k, a] of Object.entries(AMMO)) {
      const owned = !a.unlock || prof.up[a.unlock];
      html += `<div class="slot ${ammo === k ? 'sel' : ''} ${owned ? '' : 'off'}"><b>${a.key}</b>${a.icon} ${a.name}</div>`;
    }
    let first = true;
    for (const [k, a] of Object.entries(ABILITIES)) {
      if (!prof.up[k]) continue;
      const c = cd[k] || 0;
      html += `<div class="slot ${first ? 'gap' : ''} ${c > 0 ? 'cool' : ''}"><b>${a.key}</b>${a.icon} ${c > 0 ? Math.ceil(c) + 's' : a.name}</div>`;
      first = false;
    }
    if (html !== updateHUD.loadout) { $('loadout').innerHTML = html; updateHUD.loadout = html; }
  }
  const lvl = Math.round(mySail * 3);
  $('sails').textContent = 'SAILS ' + '▮'.repeat(lvl) + '▯'.repeat(3 - lvl);
  $('speed').textContent = `${((me ? me.speed : 0) * 1.2).toFixed(1)} knots`;
  $('range').textContent = `▲▼ Range ${Math.round(aimRange)} m`;
  const side = aimSide();
  for (const [id, s] of [['rPort', 'port'], ['rStar', 'star']]) {
    const el = $(id);
    el.classList.toggle('aim', side === s);
    el.querySelector('.bar > div').style.width = (me ? clamp(1 - me.reload[s] / me.reloadTime, 0, 1) * 100 : 0) + '%';
  }
  // shallow-water hints
  const wt = $('warnTxt');
  const shNow = isAlive(me) ? shallowAt(me.pos.x, me.pos.z) : 0;
  if (shNow > 0.5 && me.scale >= 0.95) { wt.textContent = '⚠ Running aground — your deep hull is scraping the shallows!'; wt.style.color = '#ffb070'; }
  else if (shNow > 0.5) { wt.textContent = '🌊 Shallows — deep-hulled ships can’t follow you here'; wt.style.color = '#9ff0e6'; }
  else wt.textContent = '';
  // respawn countdown
  const rs = $('respawn');
  if (prof && prof.respawnT > 0 && !isAlive(me) && gameActive) rs.textContent = `Respawning in ${Math.ceil(prof.respawnT)}…`;
  else rs.textContent = '';

  // floating tags
  let boss = null;
  for (const s of ships) {
    if (s === me || !isAlive(s)) { removeTag(s); continue; }
    if (s.kind === 'b') boss = s;
    const frac = s.hp / s.maxHp;
    if (s.kind === 'a') updateTag(s, s.pos.x, s.pos.y + 15, s.pos.z, s.ownerProf === myProf() ? 'Escort' : s.name, frac, '#6fe07a');
    else if (s.kind === 'p') updateTag(s, s.pos.x, s.pos.y + 17, s.pos.z, s.name, frac, gameMode === 'pvp' ? '#e2412f' : PLAYER_CSS[s.colorIdx % 4]);
    else updateTag(s, s.pos.x, s.pos.y + 17 * s.scale, s.pos.z, s.name || '', frac, s.role === 'flag' || s.colorIdx === 4 ? '#ffc040' : '#e2412f');
  }
  for (const f of forts) {
    if (f.destroyed || !gameActive) removeTag(f);
    else updateTag(f, f.x, 21, f.z, 'Fort', f.hp / f.maxHp, '#ff9a30');
  }
  // boss bar
  const bb = $('bossbar');
  if (boss) { bb.style.display = 'block'; $('bossName').textContent = '☠ ' + boss.name + ' ☠'; $('bossFill').style.width = (boss.hp / boss.maxHp * 100) + '%'; }
  else bb.style.display = 'none';
  // scoreboard (online)
  const sb = $('scoreboard');
  if (net.mode !== 'solo') {
    const list = net.mode === 'guest' ? [...netPlayers.values()] : [...profiles.values()];
    list.sort((a, b) => gameMode === 'pvp' ? b.kills - a.kills : b.earned - a.earned);
    sb.style.display = 'block';
    sb.innerHTML = list.map(p => `<div style="color:${PLAYER_CSS[p.colorIdx % 4]}"><span>${esc(p.name)}</span><span>${gameMode === 'pvp' ? p.kills + ' ☠ · ' : ''}${p.earned} 💰</span></div>`).join('');
  } else sb.style.display = 'none';

  // minimap: rotates with the ship (bow up); M opens the full chart
  const fp = focusPos();
  drawChart(mm, 220, fp.x, fp.z, 110 / 280, me ? me.heading : 0, true);
  if (bigMapOpen) drawChart(bm, 620, 0, 0, 310 / 720, 0, false);

  if (shopOpen) renderShop();
}

// ============================================================
//  Input
// ============================================================
const canvas = renderer.domElement;
const keys = {};
let mouseDown = false;
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') {
    if (e.code === 'Enter' && e.target.id === 'codeIn') { readName(); startJoin(e.target.value); }
    return;
  }
  keys[e.code] = true;
  if (e.code === 'KeyM' && (state === 'playing' || state === 'paused')) { toggleBigMap(); return; }
  if (e.code === 'KeyB' && gameActive && (state === 'playing' || shopOpen)) { shopOpen ? closeShop() : openShop(); return; }
  if (e.code === 'Escape' && shopOpen) { closeShop(); return; }
  if (state === 'playing' && e.code.startsWith('Arrow')) e.preventDefault();
  if (state !== 'playing' || shopOpen || e.repeat) return;
  if (e.code === 'KeyW') mySail = Math.min(1, Math.round(mySail * 3 + 1) / 3);
  if (e.code === 'KeyS') mySail = Math.max(0, Math.round(mySail * 3 - 1) / 3);
  if (/^Digit[1-4]$/.test(e.code)) selectAmmo(AMMO_IDS[+e.code.slice(5) - 1]);
  if (e.code === 'KeyF') triggerAbility('kegs');
  if (e.code === 'KeyR') triggerAbility('mortar');
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') triggerAbility('boost');
  if (e.code === 'KeyQ') aimOrFire('port');
  if (e.code === 'KeyE') aimOrFire('star');
  if (e.code === 'Space') { fireSide(aimSide()); e.preventDefault(); }
  if (e.code === 'KeyP') pause();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
canvas.addEventListener('mousedown', (e) => {
  mouseDown = true;
  if (state !== 'playing' || shopOpen) return;
  if (!document.pointerLockElement) { lockPointer(); return; }
  if (e.button === 0) fireSide(aimSide());
});
addEventListener('mouseup', () => { mouseDown = false; });
addEventListener('mousemove', (e) => {
  if (state !== 'playing' || shopOpen) return;
  if (!document.pointerLockElement && !mouseDown) return;
  camYaw -= e.movementX * 0.0028;
  if (e.movementX) camYawTarget = null;   // the mouse takes over again
  camPitch = clamp(camPitch + e.movementY * 0.002, 0.06, 1.2);
});
addEventListener('wheel', (e) => { camDist = clamp(camDist + e.deltaY * 0.03, 14, 80); }, { passive: true });
function lockPointer() {
  try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch {}
}
document.addEventListener('pointerlockchange', () => {
  if (!document.pointerLockElement && state === 'playing' && !shopOpen) pause();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
//  Main loop
// ============================================================
function getMe() {
  if (net.mode === 'guest') return netMe;
  const p = profiles.get(myId);
  return (p && p.ship) || menuShip || null;
}

function updateCamera(dt, focus) {
  const yaw = (me ? me.heading : 0) + camYaw;
  const sz = me ? me.scale : 1, dist = camDist * (0.6 + 0.4 * sz);
  camY += (focus.y * 0.5 + 4 * sz - camY) * Math.min(1, dt * 3);
  const target = new THREE.Vector3(focus.x, camY, focus.z);
  const cp = Math.cos(camPitch);
  camera.position.set(
    target.x + Math.sin(yaw) * cp * dist,
    target.y + Math.sin(camPitch) * dist,
    target.z + Math.cos(yaw) * cp * dist
  );
  camera.position.y = Math.max(camera.position.y, waveHeight(camera.position.x, camera.position.z, time) + 1.5);
  if (shake > 0) { camera.position.add(rv(shake * 0.6)); shake = Math.max(0, shake - dt * 2.5); }
  camera.lookAt(target);
  sky.position.copy(camera.position);
  sun.position.copy(target).add(SUN_OFFSET);
  sun.target.position.copy(target);
}

function step(dt) {
  time += dt;
  runTimers(dt);
  const host = net.mode !== 'guest';
  me = getMe();
  const canControl = state === 'playing' && !shopOpen && isAlive(me);
  localSteer = canControl ? ((keys.KeyA || keys.ArrowLeft) ? 1 : 0) - ((keys.KeyD || keys.ArrowRight) ? 1 : 0) : 0;
  if (canControl) aimElev = clamp(aimElev + ((keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0)) * 0.22 * dt, AIM_MIN, AIM_MAX);
  if (state === 'menu' || state === 'lobby') camYaw += dt * 0.08;
  if (camYawTarget !== null) {
    const dYaw = angDiff(camYawTarget, camYaw);
    camYaw += dYaw * Math.min(1, dt * 9);
    if (Math.abs(dYaw) < 0.03) { camYaw = camYawTarget; camYawTarget = null; }
  }

  if (host) {
    const mp = profiles.get(myId);
    if (mp) { mp.input.steer = localSteer; mp.input.sail = mySail; }
    for (const p of profiles.values()) if (isAlive(p.ship)) { p.ship.steer = p.input.steer; p.ship.sail = p.input.sail; }
    if (gameActive) {
      updateFleet(dt);
      for (const s of ships) if (s.kind !== 'p') updateAI(s, dt);   // enemies and escorts
      hostLogic(dt);
    }
  }
  for (const s of ships) s.update(dt, time);
  ships = ships.filter(s => !s.dead);
  for (const f of forts) f.update(dt, time, host);
  if (host) collisions();
  updateBalls(dt, time, host);
  updateWarnings(dt, time);
  updateParticles(dt);
  updateCrates(dt, time, host);
  updateKegs(dt, time, host);

  const focus = focusPos();
  updateOcean(time, focus.x, focus.z);
  updateCamera(dt, focus);
  updateAimPreview(time);
  if (state !== 'menu' && state !== 'lobby') updateHUD();
  netTick(dt);
}

const clock = new THREE.Clock();
showMainMenu();
// test hook (only with ?debug in the URL)
if (location.search.includes('debug')) window.__dbg = {
  get state() { return state; }, get wave() { return wave; }, get ships() { return ships; }, get me() { return me; },
  profiles, islands, reefs, forts, fleet, shallowAt, startWave, applyBuy, useAbility, triggerAbility, selectAmmo,
  gold(n) { const p = profiles.get(myId); p.gold += n; },
};
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const frozen = net.mode === 'solo' && (state === 'paused' || shopOpen);
  if (!frozen) step(dt);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
