  if (el) { myName = el.value.trim().slice(0, 16) || 'Captain'; localStorage.setItem('broadsideName', myName); }
}

function startSolo() {
  leaveNet();
  net.mode = 'solo'; myId = 'host'; gameMode = 'coop';
  profiles.clear();
  profiles.set(myId, makeProfile(myId, myName, 0));
  startMatch();
}

$('overlay').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  initAudio();
  switch (btn.dataset.act) {
    case 'solo': readName(); startSolo(); break;
    case 'host': readName(); startHost(); break;
    case 'join': readName(); startJoin($('codeIn').value); break;
    case 'mode-coop': gameMode = 'coop'; renderHostLobby(); broadcastLobby(); break;
    case 'mode-pvp': gameMode = 'pvp'; renderHostLobby(); broadcastLobby(); break;
    case 'start': if (net.mode === 'host') startMatch(); break;
    case 'again': if (net.mode !== 'guest') startMatch(); break;
    case 'resume': resume(); break;
    case 'menu': showMainMenu(); break;
  }
});

// ---------- shipwright shop ----------
function myProf() { return net.mode === 'guest' ? netPlayers.get(myId) : profiles.get(myId); }
function openShop() {
  if (!gameActive || shopOpen) return;
  shopOpen = true;
  renderShop.sig = null; renderShop();
  $('shop').style.display = 'flex';
  if (document.pointerLockElement) document.exitPointerLock();
}
function closeShop(silent = false) {
  if (!shopOpen) return;
  shopOpen = false;
  $('shop').style.display = 'none';
  if (!silent && state === 'playing') { lockPointer(); clock.getDelta(); }
}
function renderShop() {
  const prof = myProf();
  if (!prof) return;
  const sig = JSON.stringify([prof.gold, prof.up, me ? Math.ceil(me.hp) : 0, me ? me.maxHp : 0]);
  if (sig === renderShop.sig) return;
  renderShop.sig = sig;
  let html = `<h2>⚓ The Shipwright</h2><div class="gold">💰 ${prof.gold} gold</div><div class="cards">`;
  for (const [key, u] of Object.entries(UPGRADES)) {
    const lvl = prof.up[key] || 0;
    const maxed = key !== 'repair' && lvl >= u.max;
    const cost = key === 'repair' ? REPAIR_COST : (maxed ? 0 : u.cost[lvl]);
    const pips = key === 'repair' ? `<div class="pips">${me ? Math.ceil(me.hp) + ' / ' + me.maxHp : ''}</div>` : `<div class="pips">${'●'.repeat(lvl)}${'○'.repeat(u.max - lvl)}</div>`;
    const can = !maxed && prof.gold >= cost && (key !== 'repair' || (isAlive(me) && me.hp < me.maxHp));
    html += `<div class="card"><div class="cn">${u.icon} ${u.name}</div><div class="cd">${u.desc}</div>${pips}
      <button data-buy="${key}" ${can ? '' : 'disabled'}>${maxed ? 'MAXED' : cost + ' gold'}</button></div>`;
  }
  html += `</div><button class="ghost" data-close="1">Back to sea (B)</button>
    ${net.mode === 'solo' ? '<div style="opacity:.7;font-size:13px;margin-top:6px">Time is paused while you shop.</div>' : '<div style="opacity:.7;font-size:13px;margin-top:6px">Careful — the battle continues while you shop!</div>'}`;
  $('shopBox').innerHTML = html;
}
$('shop').addEventListener('click', (e) => {
  const b = e.target.closest('[data-buy]');
  if (b && !b.disabled) {
    if (net.mode === 'guest') sendToHost({ t: 'buy', k: b.dataset.buy });
    else applyBuy(profiles.get(myId), b.dataset.buy);
    renderShop.sig = null; renderShop();
    return;
  }
  if (e.target.closest('[data-close]')) closeShop();
});

// ============================================================
//  Aim preview
// ============================================================
function aimSide() { return Math.sin(camYaw) < 0 ? 'port' : 'star'; }
function aimElevation() { return clamp(0.44 - (camPitch - 0.08) * 0.48, 0, 0.44); }

const TRAJ_N = 90;
const trajPos = new Float32Array(TRAJ_N * 3);
const trajGeo = new THREE.BufferGeometry();
trajGeo.setAttribute('position', new THREE.BufferAttribute(trajPos, 3));
const trajLine = new THREE.Line(trajGeo, new THREE.LineBasicMaterial({ color: 0xffe28a, transparent: true, opacity: 0.85, fog: false }));
trajLine.frustumCulled = false;
const marker = new THREE.Mesh(new THREE.RingGeometry(1.6, 2.4, 28).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffe28a, transparent: true, opacity: 0.8, fog: false }));
scene.add(trajLine, marker);

function updateAimPreview(t) {
  const visible = state === 'playing' && !shopOpen && isAlive(me) && me !== menuShip;
  trajLine.visible = marker.visible = visible;
  if (!visible) return;
  const side = aimSide(), elev = aimElevation();
  const p = me.local(side === 'port' ? 3.15 : -3.15, 1.05, 0);
  const sd = me.sideDir(side);
  const v = new THREE.Vector3(sd.x * Math.cos(elev), Math.sin(elev), sd.z * Math.cos(elev))
    .multiplyScalar(BALL_SPEED).addScaledVector(me.forward(), me.speed);
  let n = 0;
  while (n < TRAJ_N) {
    trajPos[n * 3] = p.x; trajPos[n * 3 + 1] = p.y; trajPos[n * 3 + 2] = p.z; n++;
    if (p.y < waveHeight(p.x, p.z, t)) break;
    v.y -= G * 0.05; p.addScaledVector(v, 0.05);
  }
  trajGeo.setDrawRange(0, n);
  trajGeo.attributes.position.needsUpdate = true;
  marker.position.set(p.x, waveHeight(p.x, p.z, t) + 0.25, p.z);
  const ready = me.reload[side] <= 0;
  trajLine.material.color.set(ready ? 0xffe28a : 0x8a8a8a);
  marker.material.color.set(ready ? 0xffe28a : 0x8a8a8a);
}

function fireSide(side) {
  if (!isAlive(me) || me === menuShip) return;
  const elev = aimElevation();
  if (net.mode === 'guest') { if (me.reload[side] <= 0) sendToHost({ t: 'fire', side, e: elev }); }
  else me.fire(side, elev);
}

// ============================================================
//  HUD
// ============================================================
const TV = new THREE.Vector3();
function updateTag(ent, wx, wy, wz, label, frac, color) {
  if (!ent.tag) {
    const d = document.createElement('div');
    d.className = 'tag';
    d.innerHTML = '<div class="nm"></div><div class="ebar"><div></div></div>';
    hud.appendChild(d);
    ent.tag = d; d._label = null;
  }
  const d = ent.tag;
  TV.set(wx, wy, wz);
  const dist = TV.distanceTo(camera.position);
  TV.project(camera);
  if (TV.z > 1 || dist > 320) { d.style.display = 'none'; return; }
  d.style.display = 'block';
  d.style.left = ((TV.x * 0.5 + 0.5) * innerWidth) + 'px';
  d.style.top = ((-TV.y * 0.5 + 0.5) * innerHeight) + 'px';
  if (d._label !== label) { d.firstChild.textContent = label; d._label = label; }
  const fill = d.lastChild.firstChild;
  fill.style.width = (clamp(frac, 0, 1) * 100) + '%';
  fill.style.background = color;
}
function removeTag(ent) { if (ent.tag) { ent.tag.remove(); ent.tag = null; } }

const mm = $('minimap').getContext('2d');
function updateHUD() {
  const prof = myProf();
  const hp = isAlive(me) ? me.hp / me.maxHp : 0;
  const fill = $('hpFill');
  fill.style.width = (hp * 100) + '%';
  fill.style.background = hp > 0.5 ? 'linear-gradient(#7fe07a,#2f9a3a)' : hp > 0.25 ? 'linear-gradient(#ffd56a,#d18b12)' : 'linear-gradient(#ff7a6a,#b0201a)';
  $('gold').textContent = `Gold: ${prof ? prof.gold : 0}`;
  if (gameMode === 'pvp') {
    $('wave').textContent = `Kills: ${prof ? prof.kills : 0}`;
    $('foes').textContent = `Rivals: ${ships.filter(s => s.kind === 'p' && isAlive(s) && s !== me).length}`;
  } else {
    $('wave').textContent = `Wave ${wave}`;
    $('foes').textContent = `Foes: ${ships.filter(s => s.kind !== 'p' && isAlive(s)).length}`;
  }
  const lvl = Math.round(mySail * 3);
  $('sails').textContent = 'SAILS ' + '▮'.repeat(lvl) + '▯'.repeat(3 - lvl);
  $('speed').textContent = `${((me ? me.speed : 0) * 1.2).toFixed(1)} knots`;
  const side = aimSide();
  for (const [id, s] of [['rPort', 'port'], ['rStar', 'star']]) {
    const el = $(id);
    el.classList.toggle('aim', side === s);
    el.querySelector('.bar > div').style.width = (me ? (1 - me.reload[s] / me.reloadTime) * 100 : 0) + '%';
  }
  // respawn countdown
  const rs = $('respawn');
  if (prof && prof.respawnT > 0 && !isAlive(me) && gameActive) rs.textContent = `Respawning in ${Math.ceil(prof.respawnT)}…`;
  else rs.textContent = '';

  // floating tags
  let boss = null;
  for (const s of ships) {
    if (s === me || !isAlive(s)) { removeTag(s); continue; }
    if (s.kind === 'b') boss = s;
    const frac = s.hp / s.maxHp;
    if (s.kind === 'p') updateTag(s, s.pos.x, s.pos.y + 17, s.pos.z, s.name, frac, gameMode === 'pvp' ? '#e2412f' : PLAYER_CSS[s.colorIdx % 4]);
    else updateTag(s, s.pos.x, s.pos.y + 17 * s.scale, s.pos.z, s.kind === 'b' ? s.name : '', frac, '#e2412f');
  }
  for (const f of forts) {
    if (f.destroyed || !gameActive) removeTag(f);
    else updateTag(f, f.x, 21, f.z, 'Fort', f.hp / f.maxHp, '#ff9a30');
  }
  // boss bar
  const bb = $('bossbar');
  if (boss) { bb.style.display = 'block'; $('bossName').textContent = '☠ ' + boss.name + ' ☠'; $('bossFill').style.width = (boss.hp / boss.maxHp * 100) + '%'; }
  else bb.style.display = 'none';
  // scoreboard (online)
  const sb = $('scoreboard');
  if (net.mode !== 'solo') {
    const list = net.mode === 'guest' ? [...netPlayers.values()] : [...profiles.values()];
    list.sort((a, b) => gameMode === 'pvp' ? b.kills - a.kills : b.earned - a.earned);
    sb.style.display = 'block';
    sb.innerHTML = list.map(p => `<div style="color:${PLAYER_CSS[p.colorIdx % 4]}"><span>${esc(p.name)}</span><span>${gameMode === 'pvp' ? p.kills + ' ☠ · ' : ''}${p.earned} 💰</span></div>`).join('');
  } else sb.style.display = 'none';

  // minimap (rotates with the ship, bow is up)
  const W = 180, R = 90, S = R / 260;
  const fp = focusPos(), h = me ? me.heading : 0;
  mm.clearRect(0, 0, W, W);
  mm.save();
  mm.beginPath(); mm.arc(R, R, R - 2, 0, Math.PI * 2); mm.clip();
  const toMap = (x, z) => {
    const dx = x - fp.x, dz = z - fp.z;
    const fwd = dx * Math.sin(h) + dz * Math.cos(h);
    const right = -(dx * Math.cos(h) - dz * Math.sin(h));
    return [R + right * S, R - fwd * S];
  };
  mm.fillStyle = '#d9c27a';
  for (const isl of islands) { const [x, y] = toMap(isl.x, isl.z); mm.beginPath(); mm.arc(x, y, Math.max(2, isl.r * S), 0, Math.PI * 2); mm.fill(); }
  for (const f of forts) { const [x, y] = toMap(f.x, f.z); mm.fillStyle = f.destroyed ? '#666' : '#ff8a20'; mm.fillRect(x - 4, y - 4, 8, 8); }
  mm.fillStyle = '#ffd34d';
  for (const c of crates) { const [x, y] = toMap(c.x, c.z); mm.fillRect(x - 2, y - 2, 4, 4); }
  for (const s of ships) {
    if (s === me || s.dead) continue;
    const [x, y] = toMap(s.pos.x, s.pos.z);
    mm.fillStyle = s.sinking ? '#555' : s.kind === 'p' ? (gameMode === 'pvp' ? '#ff4a3a' : PLAYER_CSS[s.colorIdx % 4]) : '#ff4a3a';
    mm.beginPath(); mm.arc(clamp(x, 6, W - 6), clamp(y, 6, W - 6), s.kind === 'b' ? 7 : 4, 0, Math.PI * 2); mm.fill();
  }
  mm.strokeStyle = 'rgba(255,255,255,.2)'; mm.beginPath(); mm.arc(R, R, 100 * S, 0, Math.PI * 2); mm.stroke();
  mm.fillStyle = '#fff';
  mm.beginPath(); mm.moveTo(R, R - 8); mm.lineTo(R + 5, R + 6); mm.lineTo(R - 5, R + 6); mm.closePath(); mm.fill();
  mm.restore();

  if (shopOpen) renderShop();
}

// ============================================================
//  Input
// ============================================================
const canvas = renderer.domElement;
const keys = {};
let mouseDown = false;
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') {
    if (e.code === 'Enter' && e.target.id === 'codeIn') { readName(); startJoin(e.target.value); }
    return;
  }
  keys[e.code] = true;
  if (e.code === 'KeyB' && gameActive && (state === 'playing' || shopOpen)) { shopOpen ? closeShop() : openShop(); return; }
  if (e.code === 'Escape' && shopOpen) { closeShop(); return; }
  if (state !== 'playing' || shopOpen || e.repeat) return;
  if (e.code === 'KeyW' || e.code === 'ArrowUp') mySail = Math.min(1, Math.round(mySail * 3 + 1) / 3);
  if (e.code === 'KeyS' || e.code === 'ArrowDown') mySail = Math.max(0, Math.round(mySail * 3 - 1) / 3);
  if (e.code === 'KeyQ') fireSide('port');
  if (e.code === 'KeyE') fireSide('star');
  if (e.code === 'Space') { fireSide(aimSide()); e.preventDefault(); }
  if (e.code === 'KeyP') pause();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
canvas.addEventListener('mousedown', (e) => {
  mouseDown = true;
  if (state !== 'playing' || shopOpen) return;
  if (!document.pointerLockElement) { lockPointer(); return; }
  if (e.button === 0) fireSide(aimSide());
});
addEventListener('mouseup', () => { mouseDown = false; });
addEventListener('mousemove', (e) => {
  if (state !== 'playing' || shopOpen) return;
  if (!document.pointerLockElement && !mouseDown) return;
  camYaw -= e.movementX * 0.0028;
  camPitch = clamp(camPitch + e.movementY * 0.002, 0.06, 1.2);
});
addEventListener('wheel', (e) => { camDist = clamp(camDist + e.deltaY * 0.03, 14, 80); }, { passive: true });
function lockPointer() {
  try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch {}
}
document.addEventListener('pointerlockchange', () => {
  if (!document.pointerLockElement && state === 'playing' && !shopOpen) pause();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
//  Main loop
// ============================================================
function getMe() {
  if (net.mode === 'guest') return netMe;
  const p = profiles.get(myId);
  return (p && p.ship) || menuShip || null;
}

function updateCamera(dt, focus) {
  const yaw = (me ? me.heading : 0) + camYaw;
  camY += (focus.y * 0.5 + 4 - camY) * Math.min(1, dt * 3);
  const target = new THREE.Vector3(focus.x, camY, focus.z);
  const cp = Math.cos(camPitch);
  camera.position.set(
    target.x + Math.sin(yaw) * cp * camDist,
    target.y + Math.sin(camPitch) * camDist,
    target.z + Math.cos(yaw) * cp * camDist
  );
  camera.position.y = Math.max(camera.position.y, waveHeight(camera.position.x, camera.position.z, time) + 1.5);
  if (shake > 0) { camera.position.add(rv(shake * 0.6)); shake = Math.max(0, shake - dt * 2.5); }
  camera.lookAt(target);
  sky.position.copy(camera.position);
  sun.position.copy(target).add(SUN_OFFSET);
  sun.target.position.copy(target);
}

function step(dt) {
  time += dt;
  runTimers(dt);
  const host = net.mode !== 'guest';
  me = getMe();
  const canControl = state === 'playing' && !shopOpen && isAlive(me);
  localSteer = canControl ? ((keys.KeyA || keys.ArrowLeft) ? 1 : 0) - ((keys.KeyD || keys.ArrowRight) ? 1 : 0) : 0;
  if (state === 'menu' || state === 'lobby') camYaw += dt * 0.08;

  if (host) {
    const mp = profiles.get(myId);
    if (mp) { mp.input.steer = localSteer; mp.input.sail = mySail; }
    for (const p of profiles.values()) if (isAlive(p.ship)) { p.ship.steer = p.input.steer; p.ship.sail = p.input.sail; }
    if (gameActive) {
      for (const s of ships) if (s.kind !== 'p') updateAI(s, dt);
      hostLogic(dt);
    }
  }
  for (const s of ships) s.update(dt, time);
  ships = ships.filter(s => !s.dead);
  for (const f of forts) f.update(dt, time, host);
  if (host) collisions();
  updateBalls(dt, time, host);
  updateWarnings(dt, time);
  updateParticles(dt);
  updateCrates(dt, time, host);

  const focus = focusPos();
  updateOcean(time, focus.x, focus.z);
  updateCamera(dt, focus);
  updateAimPreview(time);
  if (state !== 'menu' && state !== 'lobby') updateHUD();
  netTick(dt);
}

const clock = new THREE.Clock();
showMainMenu();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const frozen = net.mode === 'solo' && (state === 'paused' || shopOpen);
  if (!frozen) step(dt);
  renderer.render(scene, camera);
});
</script>
