// ============================================================
//  Your fleet (solo): ships bought at the Dockyard sail with the flagship,
//  take simple orders (V) and return to the home port after every wave
// ============================================================
const FLEET_PRICE = { sloop: 900, frigate: 1500, galleon: 2400, manowar: 3000 };
const FLEET_UPS = {
  armor:  { icon: '🛡', name: 'Hull', desc: '+30 max hull', cost: [90, 150, 240, 360, 510] },
  guns:   { icon: '💥', name: 'Guns', desc: '+2.5 damage', cost: [120, 190, 290, 420, 570] },
  reload: { icon: '⏱', name: 'Crews', desc: '-12% reload', cost: [90, 160, 240, 350, 480] },
  sails:  { icon: '⛵', name: 'Sails', desc: '+10% speed', cost: [70, 130, 210, 310, 450] },
};
const FLEET_NAMES = ['Sea Wolf', 'Merry Meg', 'Black Gull', 'Revenge', 'Storm Petrel', 'Lucky Jack', 'Grey Widow', 'Silver Eel', 'Fortune', 'Red Heron', 'Salty Kate', 'Neptune'];
const ORDERS = { follow: { icon: '⚓', name: 'Follow', desc: 'keep formation, defend the flagship' }, attack: { icon: '⚔', name: 'Attack', desc: 'all ships attack your target' }, hold: { icon: '✋', name: 'Hold back', desc: 'stay out of the fight' } };
const ORDER_KEYS = Object.keys(ORDERS);
// berths grow with the campaign: 1 ship early, up to 4 alongside the flagship
function fleetCap() { return Math.min(4, 1 + Math.floor(Math.max(1, wave) / 5)); }
// later ships come with seasoned crews: stronger, and dearer
function fleetPrice(cls) { return Math.round(FLEET_PRICE[cls] * (1 + 0.05 * Math.max(1, wave)) / 10) * 10; }
function fleetShips(prof) { return ships.filter(x => x.kind === 'a' && x.ownerProf === prof && x.fleetEntry && isAlive(x)); }
function fleetSlotPos(lead, slot, back = 0) {
  const f = lead.forward(), side = slot % 2 ? -1 : 1, row = Math.floor(slot / 2);
  const b = 22 + 20 * row + back, l = 24 * side;
  return [lead.pos.x - f.x * b + f.z * l, lead.pos.z - f.z * b - f.x * l];
}
function makeFleetShip(prof, entry, x, z, h) {
  const c = SHIP_CLASSES[entry.cls], k = entry.seasoned || 1;
  const e = new Ship({ kind: 'a', colors: designColors(prof.design), scale: c.scale, masts: c.masts, cannons: c.guns, x, z, heading: h,
    maxHp: Math.round(c.hp * k), maxSpeed: c.speed, turnRate: c.turn, reloadTime: c.reload, aimErr: 0.02 + c.spread, dmg: c.dmg * (1 + (k - 1) * 0.6) });
  e.ownerProf = prof; e.profile = prof; e.fleetEntry = entry; e.design = { ...prof.design, cls: entry.cls };
  e.name = entry.name; e.regen = e.maxHp / c.repairTime; e.prefRange = rand(45, 60);
  e.dodge = c.dodge || 0; e.armor = c.armor || 0; if (c.windEff != null) e.windEff = c.windEff;
  for (const [k2, L] of Object.entries(entry.up)) for (let i = 0; i < L; i++) fleetUpEffect(e, k2);
  e.hp = e.maxHp;
  ships.push(e);
  return e;
}
// upgrades apply as increments, so they work the same on bought and captured ships
function fleetUpEffect(e, k) {
  if (k === 'armor') { e.maxHp += 30; e.hp += 30; }
  else if (k === 'guns') e.dmg += 2.5;
  else if (k === 'reload') e.reloadTime *= 0.88;
  else if (k === 'sails') { e.maxSpeed *= 1.1; e.turnRate *= 1.1; }
}
function relinkFleet(prof) { prof.fleet = prof.fleet.filter(en => isAlive(en.ship)); prof.fleet.forEach((en, i) => { en.ship.slot = i; }); }
function addFleetEntry(prof, e, cls, name) {
  const entry = { id: 'f' + (++shipSeq), cls, name, up: { armor: 0, guns: 0, reload: 0, sails: 0 }, ship: e };
  e.fleetEntry = entry; e.name = name;
  prof.fleet.push(entry); relinkFleet(prof);
  return entry;
}
function nextFleetName(prof) {
  const used = new Set(prof.fleet.map(f => f.name));
  return FLEET_NAMES.find(n => !used.has(n)) || 'Ship ' + (prof.fleet.length + 1);
}
function buyFleetShip(prof, cls) {
  if (!SHIP_CLASSES[cls] || !classUnlocked(cls) || prof.fleet.length >= fleetCap()) return;
  const cost = fleetPrice(cls);
  if (prof.gold < cost) return;
  prof.gold -= cost;
  const entry = { id: 'f' + (++shipSeq), cls, name: nextFleetName(prof), up: { armor: 0, guns: 0, reload: 0, sails: 0 }, seasoned: 1 + 0.05 * Math.max(1, wave), paid: cost };
  const [x, z, h] = berthPos(prof.fleet.length + 1);
  entry.ship = makeFleetShip(prof, entry, x, z, h);
  prof.fleet.push(entry); relinkFleet(prof);
  sfx('bell');
  toast(`⛵ The ${entry.name} joins your fleet!`);
}
function fleetUpCost(entry, k) { const L = entry.up[k] | 0; return L >= 5 ? 0 : FLEET_UPS[k].cost[L]; }
function buyFleetUp(prof, entry, k) {
  const cost = fleetUpCost(entry, k);
  if (!cost || prof.gold < cost || !isAlive(entry.ship)) return;
  prof.gold -= cost; entry.up[k] = (entry.up[k] | 0) + 1;
  fleetUpEffect(entry.ship, k);
  sfx('coin');
}
function sellFleetShip(prof, entry) {
  const refund = Math.round((entry.paid || 600) * 0.4);
  prof.gold += refund;
  if (entry.ship) entry.ship.remove();
  entry.ship = null; relinkFleet(prof);
  toast(`Sold the ${entry.name} for ${refund} gold`);
}
function setFleetOrder(prof, o, focus = null) {
  prof.order = o; prof.focus = focus;
  notify(`${ORDERS[o].icon} Fleet orders: ${ORDERS[o].name} — ${ORDERS[o].desc}`, prof);
}
function cycleFleetOrder() {
  const prof = myProf();
  if (!prof || net.mode !== 'solo' || !prof.fleet || !prof.fleet.length) { toast('No fleet yet — buy ships at the Dockyard in port'); return; }
  const o = ORDER_KEYS[(ORDER_KEYS.indexOf(prof.order || 'follow') + 1) % ORDER_KEYS.length];
  let focus = null;
  if (o === 'attack' && me) {   // target: the enemy nearest your aim point, else nearest to you
    const ax = aimPoint ? aimPoint.x : me.pos.x, az = aimPoint ? aimPoint.z : me.pos.z;
    focus = nearestOfTeam('E', ax, az, 400);
  }
  setFleetOrder(prof, o, focus);
}
// which enemy a fleet ship should fight, according to its orders
function fleetTarget(e, lead) {
  const prof = e.ownerProf, o = prof.order || 'follow';
  if (!lead) return nearestOfTeam('E', e.pos.x, e.pos.z, 220);
  if (o === 'attack') {
    if (!isAlive(prof.focus)) prof.focus = nearestOfTeam('E', lead.pos.x, lead.pos.z, 400);
    return prof.focus;
  }
  if (o === 'hold') return nearestOfTeam('E', e.pos.x, e.pos.z, 45);
  return nearestOfTeam('E', lead.pos.x, lead.pos.z, 110) || nearestOfTeam('E', e.pos.x, e.pos.z, 60);
}

// ============================================================
//  Home port: a harbour town far to the south where the fleet docks between waves
// ============================================================
const HARBOR = { x: 0, z: -2600 };
let inPort = false, portSel = 0, portCam = null;
function berthPos(i) { return [HARBOR.x + (i - 2) * 36 + 10, HARBOR.z - 14, 0]; }
function buildHarbour() {
  const g = new THREE.Group(), M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.9, flatShading: true, ...o });
  const stone = M(0x8d877b), wood = M(0x6b4a2b), plank = M(0x8a6238), grass = M(0x3f8f3a), sand = M(0xe6cf8f);
  const box = (w, h, d, m, x, y, z, ry = 0) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.rotation.y = ry; b.castShadow = b.receiveShadow = true; g.add(b); return b; };

  box(330, 4, 26, stone, H.x, 0.6, QZ - 13);
  box(380, 3, 160, sand, H.x, -0.2, QZ - 100);
  const hill = new THREE.Mesh(new THREE.SphereGeometry(120, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2), grass);
  hill.scale.set(1.6, 0.35, 0.8); hill.position.set(H.x, 0, QZ - 150); hill.receiveShadow = true; g.add(hill);
  // piers with posts
  for (let i = 0; i < 5; i++) {
    const px = H.x + (i - 2) * 36;
    box(5, 0.6, 40, plank, px, 2.1, QZ + 20);
    for (let k = 0; k < 5; k++) for (const sx of [-2.2, 2.2]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 5, 6), wood); post.position.set(px + sx, 0, QZ + 2 + k * 9.5); g.add(post);
    }
  }

  box(10, 4, 120, stone, H.x + 150, 0.6, QZ + 50);
  const LX = H.x + 150, LZ = QZ + 112;
  const white = M(0xf2efe6), red = M(0xb8322a);
  for (let k = 0; k < 6; k++) {
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(4.2 - k * 0.45, 4.6 - k * 0.45, 4, 12), k % 2 ? red : white);

  lamp.position.set(LX, 30, LZ); g.add(lamp);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(2.8, 3, 10), red); cap.position.set(LX, 33, LZ); g.add(cap);
  // warehouses along the quay and houses up the hill
  const walls = [M(0xd9c7a0), M(0xc9a27a), M(0xe8dcc0), M(0xb88a60)], roofs = [M(0x9a3b2b), M(0x6b4a2b), M(0x7a2a20)];
  const house = (w, h, d, x, z, i) => {
    box(w, h, d, walls[i % walls.length], x, h / 2 + 2.5, z);
    const r = new THREE.Mesh(new THREE.ConeGeometry(Math.hypot(w, d) / 2 * 1.05, h * 0.7, 4), roofs[i % roofs.length]);
    r.rotation.y = Math.PI / 4; r.scale.set(1, 1, d / w); r.position.set(x, h + 2.5 + h * 0.35, z); r.castShadow = true; g.add(r);
  };
  for (let i = 0; i < 6; i++) house(20, 9, 12, H.x - 125 + i * 50, QZ - 34, i);
  const rng = mulberry32(77);
  for (let i = 0; i < 22; i++) {
    const x = H.x + (rng() - 0.5) * 300, z = QZ - 60 - rng() * 70, w = 8 + rng() * 6;
    house(w, 6 + rng() * 4, w * (0.7 + rng() * 0.4), x, z, i + 1);
  }
  // cargo on the quay, and the shipwright's crane
  for (let i = 0; i < 14; i++) {
    const c = box(2.2, 2.2, 2.2, i % 3 ? wood : plank, H.x + (rng() - 0.5) * 300, 3.7, QZ - 8 - rng() * 14, rng());
    if (i % 4 === 0) c.scale.y = 1.6;
  }
  const crane = new THREE.Group();
  const mast = new THREE.Mesh(new THREE.BoxGeometry(1.4, 22, 1.4), wood); mast.position.y = 13; crane.add(mast);
  const jib = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 18), wood); jib.position.set(0, 23, 7); crane.add(jib);
  crane.position.set(H.x - 160, 0, QZ - 4); g.add(crane);
  // flags along the quay
  for (let i = 0; i < 4; i++) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 14, 6), wood); pole.position.set(H.x - 90 + i * 60, 9.5, QZ - 2); g.add(pole);
    const fl = new THREE.Mesh(new THREE.PlaneGeometry(5, 3), new THREE.MeshStandardMaterial({ map: JOLLY_ROGER, side: THREE.DoubleSide }));

buildHarbour();

// every ship you own, flagship first
function portShips(prof) { return [prof.ship, ...prof.fleet.map(f => f.ship)].filter(isAlive); }
function enterPort() {
  const prof = profiles.get(myId);
  if (!prof || !isAlive(prof.ship)) return;
  closeShop(true); toggleBigMap(false);
  inPort = true; state = 'port'; portSel = 0;
  if (document.pointerLockElement) document.exitPointerLock();
  prof.seaPos = { x: prof.ship.pos.x, z: prof.ship.pos.z, h: prof.ship.heading };
  relinkFleet(prof);
  // tidy the sea: loose shot, kegs and burning wrecks don't follow us home
  for (const b of balls) scene.remove(b.m); balls.length = 0;
  for (const k of kegs) scene.remove(k.m); kegs.length = 0;
  portShips(prof).forEach((s, i) => {
    const [x, z, h] = berthPos(i);
    s.pos.set(x, 0, z); s.heading = h; s.speed = 0; s.sail = 0; s.steer = 0;
    s.burnT = 0; s.burnStacks = 0; s.slowT = 0; s.kitT = 0; s.boostT = 0;
  });
  mySail = 0;
  setWeather('clear', true);
  hud.style.display = 'none';
  $('port').style.display = 'block';
  portCam = null;
  renderPort();

}
function leavePort() {
  const prof = profiles.get(myId);
  if (!inPort || !prof) return;
  inPort = false; state = 'playing';
  $('port').style.display = 'none';
  hud.style.display = 'block';
  const sp = prof.seaPos || { x: 0, z: 0, h: 0 };
  const lead = prof.ship;
  lead.pos.set(sp.x, 0, sp.z); lead.heading = sp.h;
  prof.fleet.forEach((f, i) => { const [x, z] = fleetSlotPos(lead, i); f.ship.pos.set(x, 0, z); f.ship.heading = sp.h; f.ship.speed = 0; });
  mySail = 2 / 3; prof.focus = null;
  lockPointer(); clock.getDelta();
  announce(`Wave ${wave + 1} — weigh anchor!`, 2);
  after(2, () => startWave(wave + 1));
}
// harbour camera: a slow drift toward whichever ship is being worked on

  const prof = profiles.get(myId), list = prof ? portShips(prof) : [];
  const s = list[Math.min(portSel, list.length - 1)];
  const tx = s ? s.pos.x : HARBOR.x, tz = s ? s.pos.z : HARBOR.z;
  const want = new THREE.Vector3(tx + 34 + Math.sin(time * 0.15) * 6, 15, tz + 44);   // framed left of the side panel

function portRepairCost(s) { return s && s.hp < s.maxHp ? repairCost(s) : 0; }

      <button data-pbuy="${k}" ${locked || full || prof.gold < price ? 'disabled' : ''}>${locked ? 'Locked' : '🪙 ' + price}</button></div>`;
  }).join('');
  $('port').innerHTML = `<div class="phead"><div><div class="ptitle">⚓ Home Port</div><div class="psub">Wave ${wave} cleared — refit before the next voyage</div></div><div class="purse">💰 <b>${prof.gold}</b></div></div>
    <div class="psec">Your fleet <span>${prof.fleet.length} / ${cap} ships besides the flagship${cap < 4 ? ` · next berth at wave ${(Math.floor(Math.max(1, wave) / 5) + 1) * 5}` : ''}</span>
      ${allCost ? `<button class="small" data-prepall="1" ${prof.gold >= allCost ? '' : 'disabled'}>Repair all · 🪙 ${allCost}</button>` : ''}</div>
    <div class="plist2">${rows}</div>
    ${detail}
    <div class="psec">Dockyard <span>${full ? 'All berths taken' : 'Buy a ship to sail with you'}</span></div>

$('port').addEventListener('click', (e) => {
  const prof = profiles.get(myId);
  if (!prof || !inPort) return;
  const t = e.target.closest('[data-psel],[data-prep],[data-prepall],[data-pshop],[data-psell],[data-pup],[data-pbuy],[data-psail]');
  if (!t || t.disabled) return;
  initAudio();
  const list = portShips(prof), d = t.dataset;
  const repair = (s) => { const c = portRepairCost(s); if (c && prof.gold >= c) { prof.gold -= c; s.hp = s.maxHp; sfx('coin'); } };
  if (d.psel) portSel = +d.psel;
  else if (d.prep) repair(list[+d.prep]);
  else if (d.prepall) list.forEach(repair);
  else if (d.pshop) { openShop(); return; }
  else if (d.psell) { const s = list[+d.psell]; if (s && s.fleetEntry) { sellFleetShip(prof, s.fleetEntry); portSel = 0; } }
  else if (d.pup) { const s = list[portSel]; if (s && s.fleetEntry) buyFleetUp(prof, s.fleetEntry, d.pup); }
  else if (d.pbuy) { buyFleetShip(prof, d.pbuy); portSel = portShips(prof).length - 1; }
  else if (d.psail) { leavePort(); return; }
  renderPort.sig = null; renderPort();
});

function applyBuy(prof, key) {
  const u = UPGRADES[key];
  if (!u) return;
  const s = prof.ship;
  const lvl = prof.up[key] || 0;
  let cost;
  if (key === 'escort') {
    if (gameMode !== 'coop' || !isAlive(s) || escortCount(prof) >= MAX_ESCORTS || prof.gold < ESCORT_COST) return;
    prof.gold -= ESCORT_COST;
    spawnEscort(prof);
    notify('An escort frigate joins your fleet!', prof);
    sfxFor('bell', prof);
    return;
  }
  if (key === 'repair' || key === 'kit') {
    const why = combatReason(s);
    if (why) { notify(`The shipwright can't work while ${why}!`, prof); return; }
  }
  if (key === 'repair') {
    if (!isAlive(s) || s.hp >= s.maxHp) return;
    cost = repairCost(s);
  } else if (key === 'kit') {
    if (lvl >= KIT_MAX) return;
    cost = kitCost();
  } else {
    if (lvl >= u.max) return;
    cost = u.cost[lvl];
  }
  if (prof.gold < cost) return;
  prof.gold -= cost;
  if (key === 'repair') s.hp = s.maxHp;
  else if (key === 'kit') prof.up.kit = lvl + 1;
  else {
    prof.up[key] = lvl + 1;
    if (s && !s.dead) s.applyStats(prof);
    if (u.cat === 'ammo') { prof.ammo = key.slice(5); if (s) s.ammo = prof.ammo; }   // auto-load newly bought ammo
  }
  notify(key === 'repair' ? `${u.name}!` : key === 'kit' ? `🧰 Repair kit stowed (${lvl + 1}/${KIT_MAX})` : `${u.name} — level ${lvl + 1}!`, prof);
  sfxFor('pickup', prof);
}

// ============================================================
//  Networking (PeerJS / WebRTC, host-authoritative)
// ============================================================
function genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
function broadcast(msg) { for (const c of net.conns.values()) if (c.open) { try { c.send(msg); } catch {} } }
function leaveNet() {
  const peer = net.peer;
  net.mode = 'solo'; net.peer = null; net.hostConn = null; net.conns.clear(); net.events = [];
  net.token = (net.token || 0) + 1;   // invalidates any connection still being set up
  if (peer) try { peer.destroy(); } catch {}
}
function lobbyInfo() { return { t: 'lobby', mode: gameMode, players: [...profiles.values()].map(p => [p.name, p.colorIdx]) }; }
function broadcastLobby() { broadcast(lobbyInfo()); }

function startHost() {
  if (!window.Peer) { showMainMenu('Online play needs the PeerJS library — check your internet connection.'); return; }
  leaveNet();
  clearEntities(); profiles.clear();
  net.mode = 'host'; myId = 'host'; state = 'lobby';
  if (!classUnlocked(myDesign.cls)) myDesign.cls = 'frigate';
  profiles.set(myId, makeProfile(myId, myName, 0, myDesign, myMeta()));
  net.code = genCode();
  renderHostLobby('Opening a room…');
  const token = net.token;
  getPeerOpts().then(opts => { if (token === net.token && net.mode === 'host') openHostPeer(opts); });
}

function openHostPeer(opts) {
  const peer = new Peer(PEER_PREFIX + net.code, opts);
  net.peer = peer;
  peer.on('open', () => { if (state === 'lobby') renderHostLobby(); });
  peer.on('connection', (conn) => {
    conn.on('data', (m) => onGuestMsg(conn, m));
    conn.on('close', () => onGuestLeft(conn));
    conn.on('error', () => onGuestLeft(conn));
  });
  peer.on('disconnected', () => { try { if (net.peer === peer) peer.reconnect(); } catch {} });
  peer.on('error', (err) => {
    if (net.peer !== peer) return;
    if (err.type === 'unavailable-id') startHost();
    else if (state === 'lobby') renderHostLobby('Network error: ' + err.type);
  });
}

function onGuestMsg(conn, m) {
  if (net.mode !== 'host' || !m || typeof m !== 'object') return;
  const prof = profiles.get(conn.peer);
  switch (m.t) {
    case 'join': {
      if (prof) return;
      if (profiles.size >= MAX_PLAYERS) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 300); return; }
      const used = new Set([...profiles.values()].map(p => p.colorIdx));
      let ci = 0; while (used.has(ci)) ci++;
      const name = String(m.name || 'Pirate').slice(0, 16) || 'Pirate';
      const mm = m.meta || {};
      const p = makeProfile(conn.peer, name, ci, designFromArr(m.design), { seed: clamp(mm.seed | 0, 0, 3), chain: !!mm.chain, armor: !!mm.armor, trait: TRAITS[mm.trait] ? mm.trait : '' });
      profiles.set(conn.peer, p);
      net.conns.set(conn.peer, conn);
      conn.send({ t: 'welcome', id: conn.peer });
      broadcastLobby();
      if (state === 'lobby') renderHostLobby();
      if (gameActive) {
        conn.send({ t: 'start', mode: gameMode });
        spawnPlayerShip(p);
        announce(`${name} has joined the battle!`, 2);
      }
      break;
    }
    case 'in':
      if (prof) { prof.input.steer = clamp(+m.s || 0, -1, 1); prof.input.sail = clamp(+m.l || 0, 0, 1); }
      break;
    case 'fire':
      if (prof && gameActive && isAlive(prof.ship)) prof.ship.fire(m.side === 'port' ? 'port' : 'star', clamp(+m.e || 0, 0, 0.44));
      break;
    case 'ammo': {
      const a = AMMO[m.a];
      if (prof && a && (!a.unlock || prof.up[a.unlock])) prof.ammo = m.a;
      break;
    }
    case 'ab':
      if (prof && (ABILITIES[m.k] || m.k === 'special')) useAbility(prof, m.k, Number.isFinite(m.x) ? m.x : null, Number.isFinite(m.z) ? m.z : null, clamp(+m.e || 0, 0, 0.44));
      break;
    case 'g': if (prof) hostActionG(prof); break;
    case 'bc': if (prof && ['plunder', 'capture', 'scuttle'].includes(m.c)) resolveBoarding(prof, m.c); break;
    case 'buy':
      if (prof && gameActive) applyBuy(prof, String(m.k));
      break;
    case 'kit': if (prof) useKit(prof); break;
  }
}

function onGuestLeft(conn) {
  const p = profiles.get(conn.peer);
  net.conns.delete(conn.peer);
  if (!p || net.mode !== 'host') return;
  profiles.delete(conn.peer);
  if (p.ship && !p.ship.dead) p.ship.remove();
  announce(`${p.name} has left`, 2);
  broadcastLobby();
  if (state === 'lobby') renderHostLobby();
}

function buildSnapshot() {
  return {
    t: 'snap', w: wave, m: gameMode,
    s: ships.filter(s => !s.dead && s !== menuShip).map(s => [
      s.id, s.kind, r2(s.pos.x), r2(s.pos.z), r2(s.heading), r2(s.speed), r2(s.sail),
      Math.ceil(s.hp), s.maxHp, s.sinking ? 1 : 0, s.colorIdx, s.cannonCount,
      r2(s.reload.port), r2(s.reload.star), r2(s.reloadTime), s.pid, s.name, s.design ? designArr(s.design) : s.aiType ? ['ai', s.aiType.scale, s.aiType.masts, s.role] : 0,
      (s.burnT > 0 ? 1 : 0) | (s.slowT > 0 ? 2 : 0) | (s.boostT > 0 ? 4 : 0) | (s.repairing ? 8 : 0) | (s.smokeT > 0 ? 16 : 0) | (Math.min(7, s.burnStacks | 0) << 5) | (s.kind === 'p' && combatReason(s) ? 256 : 0)]),
    f: forts.map(f => [Math.ceil(f.hp), f.destroyed ? 1 : 0, r2(f.aim), f.maxHp]),
    c: crates.map(c => [c.id, r2(c.x), r2(c.z), c.type]),
    ob: objective,
    kr: kraken && !kraken.dead ? [r2(kraken.x), r2(kraken.z), kraken.surfaced ? 1 : 0, Math.ceil(kraken.hp), kraken.maxHp, kraken.dying ? 1 : 0,
      kraken.tentacles.map(k => [k.id, r2(k.x), r2(k.z), k.state, r2(k.t), r2(k.yaw), r2(k.slamYaw)])] : 0,
    p: [...profiles.values()].map(p => [p.id, p.name, p.gold, p.earned, p.kills,
      p.up, r2(p.respawnT), p.colorIdx, p.ammo, p.cd, p.board ? [p.board.phase, r2(p.board.phase === 'fight' ? p.board.t / p.board.dur : p.board.t), p.board.target.name || 'ship', boardLoot(p.board.target)] : 0,
      p.treasure ? [r2(p.treasure.x), r2(p.treasure.z), r2(p.treasure.dig)] : 0]),
    k: kegs.map(k => [k.id, r2(k.x), r2(k.z)]),
    env: [r2(wind.angle), r2(wind.strength), +env.dayT.toFixed(4), env.weather],
    ev: net.events,
  };
}
function sendSnapshot() {
  if (net.mode === 'host' && net.conns.size) broadcast(buildSnapshot());
  net.events = [];
}

// ---------- guest side ----------
function startJoin(code) {
  code = String(code || '').trim().toUpperCase();
  if (!code) { showMainMenu('Enter a room code to join.'); return; }
  if (!window.Peer) { showMainMenu('Online play needs the PeerJS library — check your internet connection.'); return; }
  leaveNet();
  clearEntities(); profiles.clear(); netPlayers.clear();
  net.mode = 'guest'; state = 'lobby'; myId = null; net.lobby = [];
  net.lastCode = code;
  renderGuestLobby(`Step 1/3: reaching the matchmaking server…`);
  const token = net.token;
  getPeerOpts().then(opts => { if (token === net.token && net.mode === 'guest') openGuestPeer(opts, code); });
}

function openGuestPeer(opts, code) {
  const peer = new Peer(opts);
  net.peer = peer;
  // never hang forever: give up with a useful message
  clearTimeout(net.joinTimer);
  net.joinTimer = setTimeout(() => {
    if (net.peer !== peer || myId) return;
    hostLost(`Could not connect to room ${code} (stuck at: ${net.joinStage}). ` +
      'Check the code, make sure the host’s game tab is still open on the lobby screen, and try again. ' +
      'If it keeps failing, one of your networks (school/office Wi-Fi, some mobile data) may be blocking direct connections — try another network or a phone hotspot.');
  }, JOIN_TIMEOUT);
  net.joinStage = 'matchmaking server';
  peer.on('open', () => {
    net.joinStage = 'finding the host';
    renderGuestLobby(`Step 2/3: looking for room ${code}…`);
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    net.hostConn = conn;
    conn.on('iceStateChanged', (s) => {
      if (net.hostConn !== conn || myId) return;
      net.joinStage = 'direct connection (' + s + ')';
      if (s === 'checking') renderGuestLobby(`Step 3/3: found room ${code}, opening a direct connection…`);
      if (s === 'failed') hostLost(`Found room ${code}, but your browsers could not connect directly. One of the networks is blocking it — try another Wi-Fi or a phone hotspot.`);
    });
    conn.on('open', () => { net.joinStage = 'joining the crew'; conn.send({ t: 'join', name: myName, design: designArr(myDesign), meta: myMeta() }); });
    conn.on('data', onHostMsg);
    conn.on('close', () => { if (net.hostConn === conn) hostLost('The host closed the game.'); });
    conn.on('error', (e) => { if (net.hostConn === conn && !myId) hostLost('Connection error: ' + (e && e.type || e)); });
  });
  peer.on('error', (err) => {
    if (net.peer !== peer) return;
    hostLost(err.type === 'peer-unavailable' ? `Room ${code} was not found — check the code and that the host is still in the lobby.` : 'Network error: ' + err.type);
  });
}

function hostLost(msg) {
  if (net.mode !== 'guest') return;
  clearTimeout(net.joinTimer);
  leaveNet();
  if (document.pointerLockElement) document.exitPointerLock();
  showMainMenu(msg);
}

function onHostMsg(m) {
  if (net.mode !== 'guest' || !m) return;
  switch (m.t) {
    case 'welcome': myId = m.id; clearTimeout(net.joinTimer); renderGuestLobby(); break;
    case 'full': hostLost('That room is full (4 captains max).'); break;
    case 'lobby':
      net.lobby = m.players; gameMode = m.mode;
      if (state === 'lobby') renderGuestLobby();
      break;
    case 'start':
      clearEntities();
      gameMode = m.mode; gameActive = true; mySail = 2 / 3;
      state = 'paused';
      pausePanel('The battle begins!', '⚓ Take the helm');
      break;
    case 'snap':
      applySnapshot(m);
      for (const ev of m.ev || []) handleEvent(ev);
      break;
  }
}

function entById(id) { return ships.find(s => s.id === id) || forts.find(f => f.id === id) || null; }

function handleEvent(ev) {
  switch (ev[0]) {
    case 'b': {
      const pos = new THREE.Vector3(ev[1], ev[2], ev[3]), vel = new THREE.Vector3(ev[4], ev[5], ev[6]);
      spawnBall(pos, vel, entById(ev[7]), { aoe: ev[8], ammo: AMMO_IDS[ev[9]] || 'round' });
      fx.muzzle(pos, vel.clone().normalize());
      sfx('cannon', pos);
      break;
    }
    case 'x': {
      const p = new THREE.Vector3(ev[1], ev[2], ev[3]);
      let bi = -1, bd = 6;
      balls.forEach((b, i) => { const d = b.m.position.distanceTo(p); if (d < bd) { bd = d; bi = i; } });
      if (bi >= 0) removeBall(bi);
      fx.explosion(p, ev[4]); sfx('hit', p);
      break;
    }
    case 'w': warnAt(ev[1], ev[2], ev[3], ev[4]); break;
    case 'n': if (ev[3] == null || ev[3] === myId) showBanner(ev[1], ev[2]); break;
    case 't': if (ev[2] == null || ev[2] === myId) toast(ev[1]); break;
    case 's': if (ev[2] == null || ev[2] === myId) sfx(ev[1]); break;
    case 'over': showGameOver(ev[1]); break;
    case 'vic': showVictory(ev[1]); break;
    case 'd': if (ev[7] === myId) showNum(new THREE.Vector3(ev[1], ev[2], ev[3]), ev[4], ev[5], ev[6]); break;
  }
}

function applySnapshot(m) {
  wave = m.w; gameMode = m.m;
  if (m.env) { wind.angle = m.env[0]; wind.strength = m.env[1]; if (m.env[2] != null) env.dayT = m.env[2]; if (m.env[3]) env.weather = m.env[3]; }
  const seen = new Set();
  let mine = null;
  for (const a of m.s) {
    const [id, kind, x, z, h, sp, sail, hp, maxHp, sink, ci, cn, rp, rs, rt, pid, name, des, fl] = a;
    seen.add(id);
    let s = netShips.get(id);
    if (!s) {
      const ai = des && des[0] === 'ai';
      if ((kind === 'p' || kind === 'a') && !ai) s = makePlayerShip(designFromArr(des), { id, colorIdx: ci, x, z, heading: h, cannons: cn, maxHp });
      else s = new Ship({ kind, id, colors: kind === 'b' ? (ai && des[1] > 2 ? KING_COLORS : BOSS_COLORS) : ENEMY_COLORS[ci % ENEMY_COLORS.length], colorIdx: ci,
        x, z, heading: h, scale: ai ? des[1] : kind === 'b' ? BOSS_SCALE : 1, masts: ai ? des[2] : kind === 'b' ? 3 : 2, cannons: cn, maxHp });
      s.remote = true; s.pid = pid; s.name = name; s.hp = hp;
      netShips.set(id, s); ships.push(s);
    }
    if (s.dead) continue;
    s.net = { x, z, h, sp };
    s.sail = sail; s.maxHp = maxHp;
    if (des && des[0] === 'ai') s.role = des[3];
    s.kind = kind;
    s.burnT = fl & 1 ? 0.3 : 0; s.slowT = fl & 2 ? 0.3 : 0; s.boostT = fl & 4 ? 0.3 : 0; s.repairing = !!(fl & 8); s.smokeT = fl & 16 ? 0.3 : 0; s.burnStacks = (fl >> 5) & 7; s.netCombat = !!(fl & 256);
    if (pid === myId && hp < s.hp - 0.5) hurtFx();
    s.hp = hp;
    s.reload.port = rp; s.reload.star = rs; s.reloadTime = rt;
    if (cn !== s.cannonCount) s.setCannons(cn);
    if (sink && !s.sinking) s.beginSinkFx();
    if (pid === myId && (!mine || (mine.sinking && !s.sinking))) mine = s;
  }
  for (const [id, s] of netShips) if (!seen.has(id)) { if (!s.dead) s.remove(); netShips.delete(id); }
  netMe = mine;

  m.f.forEach(([hp, d, aim, mx], i) => { const f = forts[i]; if (!f) return; f.hp = hp; if (mx) f.maxHp = mx; f.aim = aim; if (d) f.setDestroyed(true); else f.destroyed = false; });

  if (m.ob) objective = m.ob;
  if (m.kr) {
    const [kx, kz, up, hp, mx, dying, tl] = m.kr;
    if (!kraken) kraken = new Kraken(kx, kz, mx);
    Object.assign(kraken, { x: kx, z: kz, surfaced: !!up, hp, maxHp: mx });
    if (dying) kraken.dying = true;
    const seen = new Set();
    for (const [id, x, z, st, t, yaw, sy] of tl) {
      seen.add(id);
      let k = kraken.tentacles.find(q => q.id === id);
      if (!k) { k = kraken.makeTentacle(id, x, z); kraken.tentacles.push(k); }
      if (k.state !== st) { k.state = st; k.t = t; }
      k.yaw = yaw; k.slamYaw = sy;
    }
    for (const k of kraken.tentacles) if (!seen.has(k.id)) k.state = 'gone';
  } else if (kraken && !kraken.dying) { kraken.dispose(); kraken = null; }
  const ids = new Set(m.c.map(c => c[0]));
  for (let i = crates.length - 1; i >= 0; i--) if (!ids.has(crates[i].id)) { scene.remove(crates[i].m); crates.splice(i, 1); }
  for (const [id, x, z, ty] of m.c) if (!crates.some(c => c.id === id)) addCrate(id, x, z, ty);

  netPlayers.clear();
  for (const [id, name, gold, earned, kills, up, respawnT, ci, ammo, cd, bd, tr] of m.p) {
    netPlayers.set(id, { id, name, gold, earned, kills, respawnT, colorIdx: ci, up: { ...freshUp(), ...up }, ammo, cd: cd || {}, bd: bd || null, treasure: tr ? { x: tr[0], z: tr[1], dig: tr[2] } : null, design: id === myId ? myDesign : DEFAULT_DESIGN });
  }
  const kids = new Set((m.k || []).map(k => k[0]));
  for (let i = kegs.length - 1; i >= 0; i--) if (!kids.has(kegs[i].id)) { scene.remove(kegs[i].m); kegs.splice(i, 1); }
  for (const [id, x, z] of m.k || []) if (!kegs.some(k => k.id === id)) addKeg(id, x, z, null, 0);
}

function netTick(dt) {
  if (net.mode === 'host') {
    net.snapT -= dt;
    if (net.snapT <= 0) { net.snapT = 0.05; sendSnapshot(); }
  } else if (net.mode === 'guest' && gameActive && net.hostConn && net.hostConn.open) {
    net.inT -= dt;
    if (net.inT <= 0) { net.inT = 0.05; net.hostConn.send({ t: 'in', s: localSteer, l: mySail }); }
  }
}

function buyQuarters(id) {
  let cost = 0;
  if (id.startsWith('bonus_')) {
    const k = id.slice(6), lvl = save.bonus[k] | 0;
    if (lvl >= BONUSES[k].costs.length) return;
    cost = BONUSES[k].costs[lvl];
    if (save.renown < cost) return;
    save.bonus[k] = lvl + 1;
  } else {
    if (save.unlocks[id]) return;
    cost = id === 'cls_galleon' ? 300 : id.startsWith('flag_') ? FLAGS[id.slice(5)].cost : id.startsWith('trait_') ? TRAITS[id.slice(6)].cost : 40;
    if (save.renown < cost) return;
    save.unlocks[id] = true;
    if (id.startsWith('trait_') && !save.trait) save.trait = id.slice(6);
  }
  save.renown -= cost;
  writeSave();
  sfx('coin');
  showQuarters();
}

let shopTab = 'ship';
const SHOP_TABS = [['ship', '⛵', 'Ship'], ['ammo', '💣', 'Ammo'], ['ability', '🎯', 'Abilities'], ['crew', '🧰', 'Supplies']];
const SHOP_QUIPS = ['"Fine timber, finer prices, captain."', '"Pay up front — the sea keeps no IOUs."', '"Every plank hand-picked, I swear on me mother."', '"Leaky hull? I can fix that. For a price."'];
function renderShop() {

      <div class="wbody"><div class="wn">${u.name}</div><div class="wd">${u.desc}</div><div class="wl">${st.info}</div>
      ${st.note ? `<div class="wnote">${st.note}</div>` : ''}</div>${tag}</div>`;

// price, level and whether the item can be bought right now
function itemState(prof, key, u, why, escorts) {
  const lvl = prof.up[key] || 0, gold = prof.gold;
  if (key === 'repair') {
    const cost = repairCost(me), full = !me || me.hp >= me.maxHp;
    if (full) return { stamp: 'HULL SOUND', info: '', can: false };
    return { cost, info: `Restores ${Math.ceil(me.maxHp - me.hp)} hull`, note: why ? `⚔ Can't haul out while ${why}` : '', can: !why && isAlive(me) && gold >= cost };
  }
  if (key === 'kit') {
    const info = `In the hold: ${'🧰'.repeat(lvl)}${'▫'.repeat(KIT_MAX - lvl)} ${lvl}/${KIT_MAX}`;
    if (lvl >= KIT_MAX) return { stamp: 'HOLD FULL', info, can: false };
    return { cost: kitCost(), info, note: why ? `⚔ Restock once out of combat (${why}) — use kits with H` : '', can: !why && gold >= kitCost() };
  }
  if (key === 'escort') {
    if (gameMode !== 'coop') return { stamp: 'CO-OP ONLY', info: '', can: false };
    const full = escorts >= MAX_ESCORTS, info = `${escorts} / ${MAX_ESCORTS} sailing`;
    return full ? { stamp: 'FLEET FULL', info, can: false } : { cost: ESCORT_COST, info, can: isAlive(me) && gold >= ESCORT_COST };
  }
  const info = u.max === 1 ? '' : `<span class="pips">${'●'.repeat(lvl)}${'○'.repeat(u.max - lvl)}</span> level ${lvl}/${u.max}`;
  if (lvl >= u.max) return { stamp: u.max === 1 ? 'OWNED' : 'MAXED', info, can: false };
  return { cost: u.cost[lvl], info, can: gold >= u.cost[lvl] };
}

// ============================================================
//  Aim preview
// ============================================================
function aimSide() { return Math.sin(camYaw) < 0 ? 'port' : 'star'; }
function aimElevation() { return aimElev; }

// ---- shot simulation shared by the aim display ----
const AIM_DT = 0.04;
let aimPoint = null;
function aimCanHit(s) { return s !== me && isAlive(s) && (teamOf(s) !== teamOf(me) || (gameMode === 'pvp' && s.kind === 'p')); }
// steps a cannonball forward; stops on water, land, or an enemy hull/fort
function simulateShot(p, v, t, pts) {
  for (let i = 0; i < 160; i++) {
    v.y -= G * AIM_DT;
    p.addScaledVector(v, AIM_DT);
    if (pts) pts.push(p.clone());
    for (const s of ships) if (aimCanHit(s) && hitShip(s, p)) return { end: p, hit: 'target' };
    for (const f of forts) if (f.hit(p)) return { end: p, hit: 'target' };
    if (kraken && kraken.hitTest(p)) return { end: p, hit: 'target' };
    for (const isl of islands) {
      const d = Math.hypot(p.x - isl.x, p.z - isl.z);
      if (d < isl.r && p.y < isl.h * (1 - d / isl.r) + 1.5) return { end: p, hit: 'land' };
    }
    if (p.y < waveHeight(p.x, p.z, t)) return { end: p, hit: null };
  }
  return { end: p, hit: null };
}
function shotStart(side, cz, elev) {
  const sd = me.sideDir(side);
  const p = me.local(side === 'port' ? 3.15 : -3.15, 1.05, cz);
  const v = new THREE.Vector3(sd.x * Math.cos(elev), Math.sin(elev), sd.z * Math.cos(elev))
    .multiplyScalar(BALL_SPEED).addScaledVector(me.forward(), me.speed);
  return [p, v];
}

// ---- flowing trajectory ribbon (billboarded toward the camera) ----
const ARC_N = 170;
const arcPos = new Float32Array(ARC_N * 2 * 3), arcLine = new Float32Array(ARC_N * 2 * 2);
const arcGeo = new THREE.BufferGeometry();
arcGeo.setAttribute('position', new THREE.BufferAttribute(arcPos, 3));
arcGeo.setAttribute('aLine', new THREE.BufferAttribute(arcLine, 2));
const arcIdx = [];
for (let i = 0; i < ARC_N - 1; i++) { const a = i * 2; arcIdx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
arcGeo.setIndex(arcIdx);
const arcMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
  uniforms: { uColor: { value: new THREE.Color() }, uTime: { value: 0 } },
  vertexShader: `attribute vec2 aLine; varying vec2 vL;
    void main(){ vL = aLine; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 uColor; uniform float uTime; varying vec2 vL;
    void main(){
      float dash = step(0.4, fract(vL.x * 0.3 - uTime * 1.8));
      float a = mix(0.2, 0.95, vL.y) * mix(0.35, 1.0, dash);
      gl_FragColor = vec4(uColor * mix(0.75, 1.3, dash), a);
      #include <colorspace_fragment>
    }`,
});
const arcMesh = new THREE.Mesh(arcGeo, arcMat);
arcMesh.frustumCulled = false;
arcMesh.renderOrder = 9;

// ---- impact zone covering the whole broadside's landing spread ----
const zoneMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, depthTest: false, fog: false,
  uniforms: { uColor: { value: new THREE.Color() }, uTime: { value: 0 }, uFill: { value: 1 }, uSize: { value: new THREE.Vector2(10, 5) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 uColor; uniform float uTime, uFill; uniform vec2 uSize; varying vec2 vUv;
    void main(){
      vec2 p = (vUv - 0.5) * uSize;
      float r = 1.6;
      vec2 q = abs(p) - (uSize * 0.5 - r);
      float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;   // rounded-rectangle distance
      if (d > 0.0) discard;
      float edge = smoothstep(-0.6, 0.0, d);
      float stripes = 0.5 + 0.5 * sin((p.x + p.y) * 1.4 - uTime * 5.0);
      float filled = step(vUv.x, uFill);
      float a = edge * 0.95 + (0.10 + 0.12 * stripes) * mix(0.3, 1.0, filled);
      gl_FragColor = vec4(uColor, a);
      #include <colorspace_fragment>
    }`,
});
const zone = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), zoneMat);
zone.renderOrder = 10;

// per-cannon impact markers and a rotating center reticle
const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, depthTest: false, depthWrite: false, fog: false });
const DOT_GEO = new THREE.RingGeometry(0.45, 0.85, 18).rotateX(-Math.PI / 2);
const dots = [];
for (let i = 0; i < 10; i++) { const d = new THREE.Mesh(DOT_GEO, dotMat); d.renderOrder = 11; dots.push(d); }
const reticle = new THREE.Group();
reticle.add(new THREE.Mesh(new THREE.RingGeometry(2.3, 2.65, 40).rotateX(-Math.PI / 2), dotMat));
for (let i = 0; i < 4; i++) {
  const tick = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 1.4).rotateX(-Math.PI / 2), dotMat);
  const a = i * Math.PI / 2;
  tick.position.set(Math.sin(a) * 3.3, 0, Math.cos(a) * 3.3); tick.rotation.y = a;
  reticle.add(tick);
}
reticle.traverse(o => { o.renderOrder = 11; });
scene.add(arcMesh, zone, reticle, ...dots);

const AIM_COLORS = { ready: new THREE.Color(0xffd34d), target: new THREE.Color(0x4dff88), reload: new THREE.Color(0x9aa7b5), land: new THREE.Color(0xd08a40) };
const _tan = new THREE.Vector3(), _toCam = new THREE.Vector3(), _perp = new THREE.Vector3();

function updateAimPreview(t) {
  const label = $('aimLabel');
  const visible = state === 'playing' && !shopOpen && isAlive(me) && me !== menuShip;
  arcMesh.visible = zone.visible = reticle.visible = visible;
  if (!visible) { dots.forEach(d => (d.visible = false)); label.style.display = 'none'; aimPoint = null; return; }

  const side = aimSide(), elev = aimElevation();
  // 1) one landing point per cannon on this side
  const lands = [];
  let anyTarget = false, allLand = true;
  me.cannonZ.forEach((cz, i) => {
    const [p, v] = shotStart(side, cz, elev);
    const r = simulateShot(p, v, t, null);
    lands.push(r.end);
    if (r.hit === 'target') anyTarget = true;
    if (r.hit !== 'land') allLand = false;
    const d = dots[i];
    d.visible = true;
    d.position.set(r.end.x, waveHeight(r.end.x, r.end.z, t) + 0.3, r.end.z);
  });
  for (let i = me.cannonZ.length; i < dots.length; i++) dots[i].visible = false;

  // 2) the center trajectory as a flowing ribbon
  const mid = me.cannonZ.reduce((a, b) => a + b, 0) / me.cannonZ.length;
  const [p0, v0] = shotStart(side, mid, elev);
  const pts = [p0.clone()];
  simulateShot(p0, v0, t, pts);
  const n = Math.min(pts.length, ARC_N);
  let dist = 0;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[Math.min(i + 1, n - 1)], c = pts[Math.max(i - 1, 0)];
    _tan.subVectors(b, c).normalize();
    _toCam.subVectors(camera.position, a);
    _perp.crossVectors(_tan, _toCam).normalize();
    const f = i / Math.max(1, n - 1), w = 0.16 + 0.34 * f;
    if (i > 0) dist += a.distanceTo(pts[i - 1]);
    arcPos.set([a.x + _perp.x * w, a.y + _perp.y * w, a.z + _perp.z * w, a.x - _perp.x * w, a.y - _perp.y * w, a.z - _perp.z * w], i * 6);
    arcLine.set([dist, f, dist, f], i * 4);
  }
  arcGeo.setDrawRange(0, Math.max(0, n - 1) * 6);
  arcGeo.attributes.position.needsUpdate = true;
  arcGeo.attributes.aLine.needsUpdate = true;

  // 3) impact zone spanning all landing points, aligned with the ship
  const fwd = me.forward();
  const c = new THREE.Vector3();
  lands.forEach(l => c.add(l));
  c.divideScalar(lands.length);
  let lo = Infinity, hi = -Infinity;
  for (const l of lands) { const k = (l.x - c.x) * fwd.x + (l.z - c.z) * fwd.z; lo = Math.min(lo, k); hi = Math.max(hi, k); }
  const len = (hi - lo) + 6 * me.scale, wid = 5.5 * me.scale;
  const cy = waveHeight(c.x, c.z, t) + 0.3;
  zone.position.set(c.x + fwd.x * (lo + hi) / 2, cy, c.z + fwd.z * (lo + hi) / 2);
  zone.rotation.y = me.heading - Math.PI / 2;
  zone.scale.set(len, 1, wid);
  zoneMat.uniforms.uSize.value.set(len, wid);
  aimRange = Math.hypot(c.x - me.pos.x, c.z - me.pos.z);
  aimPoint = { x: zone.position.x, z: zone.position.z };

  // 4) state: on target / ready / blocked by land / reloading
  const reload = me.reload[side], ready = reload <= 0;
  const col = !ready ? AIM_COLORS.reload : anyTarget ? AIM_COLORS.target : allLand ? AIM_COLORS.land : AIM_COLORS.ready;
  arcMat.uniforms.uColor.value.copy(col);
  zoneMat.uniforms.uColor.value.copy(col);
  dotMat.color.copy(col);
  arcMat.uniforms.uTime.value = zoneMat.uniforms.uTime.value = t;
  zoneMat.uniforms.uFill.value = ready ? 1 : clamp(1 - reload / me.reloadTime, 0, 1);
  reticle.position.set(zone.position.x, cy + 0.05, zone.position.z);
  reticle.rotation.y = t * (anyTarget ? 2.5 : 0.6);
  reticle.scale.setScalar(me.scale * (anyTarget && ready ? 1 + 0.12 * Math.sin(t * 10) : 1));

  // 5) floating label above the impact zone
  TV.set(zone.position.x, cy + 4, zone.position.z).project(camera);
  if (TV.z > 1) { label.style.display = 'none'; return; }
  label.style.display = 'block';
  label.style.left = ((TV.x * 0.5 + 0.5) * innerWidth) + 'px';
  label.style.top = ((-TV.y * 0.5 + 0.5) * innerHeight) + 'px';
  label.style.color = '#' + col.getHexString(THREE.SRGBColorSpace);
  const m = `${Math.round(aimRange)} m`;
  label.textContent = !ready ? `Reloading ${reload.toFixed(1)}s · ${m}`
    : anyTarget ? `◎ ON TARGET · ${m}` : allLand ? `Blocked by land · ${m}` : m;
}

    if (nearX && trh.dig >= 0) bhint.textContent = `⛏ Digging for treasure… ${Math.round(trh.dig * 100)}%`;
    else if (nearX) bhint.textContent = '[G] Drop anchor and dig for treasure!';
    else bhint.textContent = cand ? `[G] Board the crippled ${cand.name || 'enemy ship'}!` : '';
  }
  // respawn countdown
  const rs = $('respawn');
  if (prof && prof.respawnT > 0 && !isAlive(me) && gameActive) rs.textContent = `Respawning in ${Math.ceil(prof.respawnT)}…`;
  else rs.textContent = '';

  // floating tags
  let boss = null;
  for (const s of ships) {
    if (s === me || !isAlive(s)) { removeTag(s); continue; }
    if (s.kind === 'b') boss = s;
    const frac = s.hp / s.maxHp;
    if (s.kind === 'a') updateTag(s, s.pos.x, s.pos.y + 15, s.pos.z, s.ownerProf === myProf() ? 'Escort' : s.name, frac, '#6fe07a');
    else if (s.kind === 'p') updateTag(s, s.pos.x, s.pos.y + 17, s.pos.z, s.name, frac, gameMode === 'pvp' ? '#e2412f' : PLAYER_CSS[s.colorIdx % 4]);
    else updateTag(s, s.pos.x, s.pos.y + 17 * s.scale, s.pos.z, s.name || '', frac, s.role === 'flag' || s.colorIdx === 4 ? '#ffc040' : '#e2412f');
  }
  for (const f of forts) {
    if (f.destroyed || !gameActive) removeTag(f);
    else updateTag(f, f.x, 21, f.z, 'Fort', f.hp / f.maxHp, '#ff9a30');
  }
  // boss bar
  const bb = $('bossbar');
  $('objective').textContent = objective.text;
  const tr = myTreasure();
  if (tr && isAlive(me)) {
    const dx = tr.x - me.pos.x, dz = tr.z - me.pos.z;
    $('treasureTxt').textContent = `📜 Treasure: X marks the spot — ${Math.round(Math.hypot(dx, dz))} m ${compassName(Math.atan2(dx, dz))}`;
  } else $('treasureTxt').textContent = '';
  if (kraken && !kraken.dead && !kraken.dying) { bb.style.display = 'block'; $('bossName').textContent = kraken.name; $('bossFill').style.width = (kraken.hp / kraken.maxHp * 100) + '%'; }
  else if (boss) { bb.style.display = 'block'; $('bossName').textContent = '☠ ' + boss.name + ' ☠'; $('bossFill').style.width = (boss.hp / boss.maxHp * 100) + '%'; }
  else bb.style.display = 'none';
  // scoreboard (online)
  const sb = $('scoreboard');
  if (net.mode !== 'solo') {
    const list = net.mode === 'guest' ? [...netPlayers.values()] : [...profiles.values()];
    list.sort((a, b) => gameMode === 'pvp' ? b.kills - a.kills : b.earned - a.earned);
    sb.style.display = 'block';
    sb.innerHTML = list.map(p => `<div style="color:${PLAYER_CSS[p.colorIdx % 4]}"><span>${esc(p.name)}</span><span>${gameMode === 'pvp' ? p.kills + ' ☠ · ' : ''}${p.earned} 💰</span></div>`).join('');
  } else sb.style.display = 'none';

  // minimap: rotates with the ship (bow up); M opens the full chart
  const fp = focusPos();
  drawChart(mm, 220, fp.x, fp.z, 110 / 280, me ? me.heading : 0, true);
  if (bigMapOpen) { drawChart(bm, 620, 0, 0, 310 / 720, 0, false); drawWindRose(bm, 60, 60, 0); }
  drawCompass();
  drawNavTape();
  updateWaypoint();

  updateNums();
  updateTutorialHUD();
  if (shopOpen) renderShop();
}

// ============================================================
//  Input
// ============================================================
const canvas = renderer.domElement;
const keys = {};
let mouseDown = false;
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') {
    if (e.code === 'Enter' && e.target.id === 'codeIn') { readName(); startJoin(e.target.value); }
    return;
  }
  keys[e.code] = true;
  if (e.code === 'Enter' && tut) { finishTutorial(); return; }
  if (e.code === 'Enter' && state === 'playing' && net.mode === 'solo' && waveClearT > 0) { waveClearT = 0.01; return; }
  if (e.code === 'KeyN') { toggleMusic(); return; }
  if (e.code === 'KeyM' && (state === 'playing' || state === 'paused')) { toggleBigMap(); return; }
  if (e.code === 'KeyB' && gameActive && (state === 'playing' || shopOpen)) { shopOpen ? closeShop() : openShop(); return; }
  if (e.code === 'Escape' && shopOpen) { closeShop(); return; }
  if (state === 'playing' && e.code.startsWith('Arrow')) e.preventDefault();
  if (state !== 'playing' || shopOpen || e.repeat) return;
  if (e.code === 'KeyW') mySail = Math.min(1, Math.round(mySail * 3 + 1) / 3);
  if (e.code === 'KeyS') mySail = Math.max(0, Math.round(mySail * 3 - 1) / 3);
  const bp = myProf();
  if (bp && bp.board && bp.board.phase === 'choose' && /^Digit[1-3]$/.test(e.code)) { boardChoice(['plunder', 'capture', 'scuttle'][+e.code.slice(5) - 1]); return; }
  if (e.code === 'KeyG') actionG();
  if (/^Digit[1-4]$/.test(e.code)) selectAmmo(AMMO_IDS[+e.code.slice(5) - 1]);
  if (e.code === 'KeyC') triggerAbility('special');
  if (e.code === 'KeyH') triggerKit();
  if (e.code === 'KeyV') cycleFleetOrder();
  if (e.code === 'KeyF') triggerAbility('kegs');
  if (e.code === 'KeyR') triggerAbility('mortar');
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') triggerAbility('boost');
  if (e.code === 'KeyX') fireBoth();
  if (e.code === 'KeyQ') aimOrFire('port');
  if (e.code === 'KeyE') aimOrFire('star');
  if (e.code === 'Space') { fireSide(aimSide()); e.preventDefault(); }
  if (e.code === 'KeyP') pause();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
canvas.addEventListener('mousedown', (e) => {
  mouseDown = true;
  if (state !== 'playing' || shopOpen) return;
  if (!document.pointerLockElement) { lockPointer(); return; }
  if (e.button === 0) fireSide(aimSide());
  if (e.button === 2) fireBoth();
});
addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());   // right-click is a game control
addEventListener('mousemove', (e) => {
  if (state !== 'playing' || shopOpen) return;
  if (!document.pointerLockElement && !mouseDown) return;
  camYaw -= e.movementX * 0.0028;
  if (e.movementX) camYawTarget = null;   // the mouse takes over again
  camPitch = clamp(camPitch + e.movementY * 0.002, 0.06, 1.2);
});
addEventListener('wheel', (e) => { camDist = clamp(camDist + e.deltaY * 0.03, 14, 80); }, { passive: true });
// ---------- touch controls (phones & tablets) ----------
const isTouch = matchMedia('(pointer: coarse)').matches;   // phones & tablets (not touchscreen laptops with a mouse)
let touchSteer = 0;
if (isTouch) {
  document.body.classList.add('touch');
  const stick = $('stick'), knob = $('knob');
  let stickId = null, camId = null, camLast = null;
  const stickMove = (t) => {
    const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = (t.clientX - cx) / 60, dy = (t.clientY - cy) / 60;
    const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    knob.style.transform = `translate(${dx * 45}px, ${dy * 45}px)`;
    touchSteer = Math.abs(dx) > 0.2 ? -dx : 0;
    if (dy < -0.35) mySail = Math.min(1, 0.34 + (-dy - 0.35) * 1.2); else if (dy > 0.5) mySail = 0;
  };
  stick.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.changedTouches[0]; stickId = t.identifier; stickMove(t); initAudio(); }, { passive: false });
  addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) stickMove(t);
      else if (t.identifier === camId && camLast && state === 'playing') {
        camYaw -= (t.clientX - camLast[0]) * 0.006; camYawTarget = null;
        camPitch = clamp(camPitch + (t.clientY - camLast[1]) * 0.004, 0.06, 1.2);
        camLast = [t.clientX, t.clientY];
      }
    }
  }, { passive: false });
  addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) { stickId = null; touchSteer = 0; knob.style.transform = ''; }
      if (t.identifier === camId) { camId = null; camLast = null; }
    }
  });
  canvas.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; if (camId === null) { camId = t.identifier; camLast = [t.clientX, t.clientY]; } initAudio(); }, { passive: true });
  const act = {
    port: () => aimOrFire('port'), star: () => aimOrFire('star'), fire: () => fireSide(aimSide()), both: fireBoth,
    special: () => triggerAbility('special'), kegs: () => triggerAbility('kegs'), mortar: () => triggerAbility('mortar'), boost: () => triggerAbility('boost'),
    g: actionG, kit: triggerKit, orders: cycleFleetOrder, shop: () => { if (gameActive) shopOpen ? closeShop() : openShop(); }, map: () => toggleBigMap(), pause: () => pause(),
  };
  $('tbtns').addEventListener('touchstart', (e) => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    e.preventDefault(); initAudio();
    const k = b.dataset.t;
    if (k === 'up') keys.ArrowUp = true; else if (k === 'down') keys.ArrowDown = true;
    else if (state === 'playing' || k === 'shop' || k === 'map') act[k] && act[k]();
  }, { passive: false });
  $('tbtns').addEventListener('touchend', (e) => { const b = e.target.closest('[data-t]'); if (b && b.dataset.t === 'up') keys.ArrowUp = false; if (b && b.dataset.t === 'down') keys.ArrowDown = false; });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  sun.shadow.mapSize.set(1024, 1024);
}

function lockPointer() {
  if (isTouch) return;
  try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch {}
}
document.addEventListener('pointerlockchange', () => {
  if (!document.pointerLockElement && state === 'playing' && !shopOpen) pause();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
//  Main loop
// ============================================================
function getMe() {
  if (net.mode === 'guest') return netMe;
  const p = profiles.get(myId);
  return (p && p.ship) || menuShip || null;
}

function updateCamera(dt, focus) {
  const yaw = (me ? me.heading : 0) + camYaw;
  const sz = me ? me.scale : 1, dist = camDist * (0.6 + 0.4 * sz);
  camY += (focus.y * 0.5 + 4 * sz - camY) * Math.min(1, dt * 3);
  const target = new THREE.Vector3(focus.x, camY, focus.z);
  const cp = Math.cos(camPitch);
  camera.position.set(
    target.x + Math.sin(yaw) * cp * dist,
    target.y + Math.sin(camPitch) * dist,
    target.z + Math.cos(yaw) * cp * dist
  );
  camera.position.y = Math.max(camera.position.y, waveHeight(camera.position.x, camera.position.z, time) + 1.5);
  if (shake > 0) { camera.position.add(rv(shake * 0.6)); shake = Math.max(0, shake - dt * 2.5); }
  camera.lookAt(target);
  sky.position.copy(camera.position);
  sun.position.copy(target).add(SUN_OFFSET);   // SUN_OFFSET follows the time of day
  sun.target.position.copy(target);
}

function step(dt) {
  time += dt;
  runTimers(dt);
  const host = net.mode !== 'guest';
  me = getMe();
  const canControl = state === 'playing' && !shopOpen && isAlive(me);
  localSteer = canControl ? (((keys.KeyA || keys.ArrowLeft) ? 1 : 0) - ((keys.KeyD || keys.ArrowRight) ? 1 : 0) || touchSteer) : 0;
  updateTutorial(dt);
  if (canControl) aimElev = clamp(aimElev + ((keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0)) * 0.22 * dt, AIM_MIN, AIM_MAX);
  if (state === 'menu' || state === 'lobby') camYaw += dt * 0.08;
  if (camYawTarget !== null) {
    const dYaw = angDiff(camYawTarget, camYaw);
    camYaw += dYaw * Math.min(1, dt * 9);
    if (Math.abs(dYaw) < 0.03) { camYaw = camYawTarget; camYawTarget = null; }
  }

  if (host) {
    const mp = profiles.get(myId);
    if (mp) { mp.input.steer = localSteer; mp.input.sail = mySail; }
    for (const p of profiles.values()) if (isAlive(p.ship)) { p.ship.steer = p.board ? 0 : p.input.steer; p.ship.sail = p.board ? 0 : p.input.sail; }
    if (gameActive && !inPort) {
      updateFleet(dt);
      for (const s of ships) if (s.kind !== 'p') updateAI(s, dt);   // enemies and escorts
      hostLogic(dt);
    }
  }
  for (const s of ships) s.update(dt, time);
  ships = ships.filter(s => !s.dead);
  for (const f of forts) f.update(dt, time, host);
  if (host) collisions();
  updateBalls(dt, time, host);
  updateWarnings(dt, time);
  if (kraken) { kraken.update(dt, time, host && gameActive); if (kraken.dead) kraken = null; }
  updateBeacon(time);
  if (host) updateWind(dt);
  updateEnvironment(dt, time, focusPos(), host);
  updateStreaks(dt, time, focusPos());
  updateParticles(dt);
  updateCrates(dt, time, host);
  updateKegs(dt, time, host);

  const focus = focusPos();
  updateOcean(time, focus.x, focus.z);
  if (inPort) { updatePortCamera(dt); renderPort(); }
  else updateCamera(dt, focus);
  updateAimPreview(time);
  if (state !== 'menu' && state !== 'lobby' && !inPort) updateHUD();
  netTick(dt);
}

const clock = new THREE.Clock();
showMainMenu();
// test hook (only with ?debug in the URL)
if (location.search.includes('debug')) window.__dbg = {
  get state() { return state; }, get wave() { return wave; }, get ships() { return ships; }, get me() { return me; },
  profiles, islands, reefs, forts, fleet, shallowAt, startWave, applyBuy, useAbility, triggerAbility, selectAmmo,
  gold(n) { const p = profiles.get(myId); p.gold += n; },
  wind, sailEfficiency, windFactor, startBoarding, resolveBoarding, boardCandidate,
  get kraken() { return kraken; }, get tut() { return tut; }, finishTutorial, get musicOn() { return musicOn; }, save, showQuarters, buyQuarters, giveTreasureMap, spawnMap, env, setWeather, spawnEnemyTest: spawnEnemy, get objective() { return objective; }, get waveEvent() { return waveEvent; }, eventFor,
  applyBurnTest(s, n, per) { s.lastHitT = -99; applyBurn(s, n, per, null); },
  useKit, combatReason, openShop, get time() { return time; }, enterPort, leavePort, buyFleetShip, cycleFleetOrder, get inPort() { return inPort; },
};
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const frozen = net.mode === 'solo' && (state === 'paused' || state === 'victory' || shopOpen);
  if (!frozen) step(dt);
  updateMusic();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
