<style>

<script type="module">
import * as THREE from 'three';

// ============================================================
//  Constants & helpers
// ============================================================
const G = 20;              // gravity for cannonballs
const BALL_SPEED = 55;
const BOSS_SCALE = 1.8;
const SHIP_CLASSES = {
  sloop: { name: 'Sloop', tag: 'Small, fast & agile',
    desc: 'A nimble single-masted raider. Turns on a doubloon and reloads fast, but carries light guns and a thin hull.',

  frigate: { name: 'Frigate', tag: 'Balanced — the historical warship',
    desc: 'The classic two-masted fighting ship of the age of sail: a sound mix of speed and armour, with well-drilled, accurate gun crews.',
    scale: 1, masts: 2, repairTime: 70, hp: 115, speed: 15, turn: 0.75, guns: 4, dmg: 10, reload: 2.3, spread: 0.01 },
  manowar: { name: "Man-o'-War", tag: 'Huge, slow & heavily armed',
    desc: 'A three-masted floating fortress. Massive hull and a devastating broadside, but slow to sail and clumsy to turn.',
    scale: 1.35, masts: 3, repairTime: 110, hp: 180, speed: 10.5, turn: 0.48, guns: 6, dmg: 12, reload: 3.4, spread: 0.02 },
};
const HULL_COLORS = [0x6b4226, 0x3a2a1e, 0x3d4f63, 0x5a1f1f, 0x2f4a33, 0x1c1a1a];
const TRIM_COLORS = [0xd4a017, 0xcfcfcf, 0x5ab0ff, 0xc0302a, 0x55c060, 0xd070ff];
const SAIL_COLORS = [0xf3ead2, 0xffffff, 0x2a2a2a, 0xa33a2c, 0x3c6fb0, 0xe7c98a];
const DEFAULT_DESIGN = { cls: 'frigate', hull: 0, trim: 0, sail: 0 };
function cleanDesign(d) {
  d = d || {};
  const idx = (v, n) => Number.isInteger(v) && v >= 0 && v < n ? v : 0;
  return { cls: SHIP_CLASSES[d.cls] ? d.cls : 'frigate', hull: idx(d.hull, HULL_COLORS.length), trim: idx(d.trim, TRIM_COLORS.length), sail: idx(d.sail, SAIL_COLORS.length) };
}
function designColors(d) { return { hull: HULL_COLORS[d.hull], trim: TRIM_COLORS[d.trim], sail: SAIL_COLORS[d.sail], flag: TRIM_COLORS[d.trim] }; }
function designArr(d) { return [d.cls, d.hull, d.trim, d.sail]; }
function designFromArr(a) { return cleanDesign(Array.isArray(a) ? { cls: a[0], hull: a[1], trim: a[2], sail: a[3] } : null); }
let myDesign = cleanDesign((() => { try { return JSON.parse(localStorage.getItem('broadsideDesign')); } catch { return null; } })());

const CANNON_SETS = {
  3: [-2.2, -0.2, 1.8],
  4: [-3, -1, 1, 3],
  5: [-4.2, -2.4, -0.6, 1.2, 3],
  6: [-4.8, -3.2, -1.6, 0, 1.6, 3.2],
};
const PEER_PREFIX = 'broadside-pirates-v1-';
// TURN relay (metered.ca) so players behind strict networks can still connect
const METERED_APP = '';   // e.g. 'myapp' for myapp.metered.live
const METERED_KEY = '';
const STUN_SERVERS = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
let iceServersPromise = null;
function getPeerOpts() {
  if (!iceServersPromise) {
    iceServersPromise = (METERED_APP && METERED_KEY)
      ? fetch(`https://${METERED_APP}.metered.live/api/v1/turn/credentials?apiKey=${encodeURIComponent(METERED_KEY)}`)
          .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(list => [...STUN_SERVERS, ...list])
          .catch(err => { console.warn('TURN credentials unavailable, using STUN only:', err); iceServersPromise = null; return STUN_SERVERS; })
      : Promise.resolve(STUN_SERVERS);
  }
  return iceServersPromise.then(iceServers => ({ debug: 1, config: { iceServers } }));
}
const JOIN_TIMEOUT = 20000;
const MAX_PLAYERS = 4;
const ESCORT_COST = 1200, MAX_ESCORTS = 2;
const AMMO = {
  round: { key: '1', name: 'Round', icon: '●', dmg: 1, unlock: null },
  chain: { key: '2', name: 'Chain', icon: '⛓', dmg: 0.6, unlock: 'ammo_chain' },
  fire: { key: '3', name: 'Fire', icon: '🔥', dmg: 0.7, unlock: 'ammo_fire' },
  explosive: { key: '4', name: 'Explosive', icon: '💣', dmg: 1.4, reload: 1.35, unlock: 'ammo_explosive' },
};
const ABILITIES = {
  kegs: { key: 'F', name: 'Kegs', icon: '🛢', cd: () => 18 },
  mortar: { key: 'R', name: 'Mortar', icon: '🎯', cd: () => 25 },
  boost: { key: 'Shift', name: 'Boost', icon: '💨', cd: (L) => 20 - 2 * L },
};
function freshUp() {
  return { armor: 0, guns: 0, reload: 0, sails: 0, cannons: 0, carpenters: 0, ammo_chain: 0, ammo_fire: 0, ammo_explosive: 0, kegs: 0, mortar: 0, boost: 0 };
}
const REPAIR_GOLD_PER_HP = 0.75;   // repairs cost per point restored, so big hulls pay more
function repairCost(s) { return s ? Math.max(20, Math.ceil((s.maxHp - s.hp) * REPAIR_GOLD_PER_HP)) : 0; }
const UPGRADES = {
  armor:   { icon: '🛡', name: 'Reinforced Hull', desc: '+30 max hull', max: 5, cost: [150, 250, 400, 600, 850] },
  guns:    { icon: '💥', name: 'Heavy Shot', desc: '+2.5 damage per shot', max: 5, cost: [200, 320, 480, 700, 950] },
  reload:  { icon: '⏱', name: 'Drilled Gun Crews', desc: '-12% reload time', max: 5, cost: [150, 260, 400, 580, 800] },
  sails:   { icon: '⛵', name: 'Silk Sails', desc: '+10% speed & turning', max: 5, cost: [120, 220, 350, 520, 750] },
  cannons: { icon: '⚙', name: 'Extra Gun Ports', desc: '+1 cannon per side', max: 2, cost: [500, 900] },
  carpenters: { icon: '🪚', name: "Ship's Carpenters", desc: '+30% auto-repair speed, starts sooner', max: 5, cost: [200, 350, 550, 800, 1100] },
  ammo_chain: { cat: 'ammo', icon: '⛓', name: 'Chain Shot', desc: 'Key 2 · 60% damage but shreds sails: target slowed 40% for 6s', max: 1, cost: [600] },
  ammo_fire: { cat: 'ammo', icon: '🔥', name: 'Fire Shot', desc: 'Key 3 · 70% damage, sets ships ablaze (burns 5s)', max: 1, cost: [900] },
  ammo_explosive: { cat: 'ammo', icon: '💣', name: 'Explosive Shell', desc: 'Key 4 · 140% damage + small blast, 35% slower reload', max: 1, cost: [1500] },
  kegs: { cat: 'ability', icon: '🛢', name: 'Powder Kegs', desc: 'Key F · drop floating mines astern (levels: more kegs, bigger boom)', max: 3, cost: [700, 1000, 1400] },
  mortar: { cat: 'ability', icon: '🎯', name: 'Mortar Strike', desc: 'Key R · shells rain on your aim zone (levels: more shells, more damage)', max: 3, cost: [1200, 1700, 2300] },
  boost: { cat: 'ability', icon: '💨', name: 'Oars & Extra Canvas', desc: 'Shift · +60% speed burst (levels: longer, shorter cooldown)', max: 3, cost: [500, 800, 1200] },
  escort: { cat: 'crew', icon: '🚢', name: 'Hire Escort', desc: 'An allied frigate sails and fights beside you (co-op, max 2)', max: Infinity },
  repair:  { cat: 'crew', icon: '🔨', name: 'Field Repairs', desc: 'Restore full hull (price grows with damage)', max: Infinity },
};
const BOSS_NAMES = ['The Black Kraken', "Leviathan's Wrath", 'The Crimson Tide', 'Dread Galleon Morrow', 'The Sea Hag'];

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r2 = (v) => Math.round(v * 100) / 100;
const angDiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const rv = (s) => new THREE.Vector3(rand(-s, s), rand(-s, s), rand(-s, s));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const $ = (id) => document.getElementById(id);
const ORIGIN = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);

// ============================================================
//  Renderer, scene, sky, lights
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xa9d3ec);
scene.fog = new THREE.Fog(FOG_COLOR, 140, 430);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 2500);

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1200, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x2f78c4) }, bottom: { value: FOG_COLOR.clone() } },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 bottom; varying vec3 vP;
      void main(){ float h = clamp(vP.y * 2.2, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, h), 1.0);
      #include <colorspace_fragment>
      }`,
  })

const OCEAN_SIZE = 900, OCEAN_SEG = 150, CELL = OCEAN_SIZE / OCEAN_SEG;

const C_DEEP = new THREE.Color(0x0b4a7a), C_MID = new THREE.Color(0x1b7db4), C_CREST = new THREE.Color(0x9bdcec);
const C_SHALLOW = new THREE.Color(0x3cc8c0), C_BEACH = new THREE.Color(0xa6e6cf);

// Shallow-water field (0 = open sea, 1 = beach), painted around islands and reefs.
// Deep-hulled ships run aground in it; it also calms the waves and tints the water.
const SH_CELL = 4, SH_HALF = 900, SH_N = Math.ceil(SH_HALF * 2 / SH_CELL);
const shallowGrid = new Float32Array(SH_N * SH_N);
function shallowAt(x, z) {
  const i = Math.floor((x + SH_HALF) / SH_CELL), j = Math.floor((z + SH_HALF) / SH_CELL);
  if (i < 0 || j < 0 || i >= SH_N || j >= SH_N) return 0;
  return shallowGrid[j * SH_N + i];
}
function paintShallow(cx, cz, inner, outer, peak) {
  const i0 = Math.max(0, Math.floor((cx - outer + SH_HALF) / SH_CELL)), i1 = Math.min(SH_N - 1, Math.ceil((cx + outer + SH_HALF) / SH_CELL));
  const j0 = Math.max(0, Math.floor((cz - outer + SH_HALF) / SH_CELL)), j1 = Math.min(SH_N - 1, Math.ceil((cz + outer + SH_HALF) / SH_CELL));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const x = i * SH_CELL - SH_HALF + SH_CELL / 2, z = j * SH_CELL - SH_HALF + SH_CELL / 2;
    const d = Math.hypot(x - cx, z - cz);
    if (d >= outer) continue;
    const f = d <= inner ? 1 : 1 - (d - inner) / (outer - inner);
    const v = peak * f * f * (3 - 2 * f);
    const k = j * SH_N + i;
    if (v > shallowGrid[k]) shallowGrid[k] = v;
  }
}
function waveHeight(x, z, t) { return waveBase(x, z, t) * (1 - 0.6 * shallowAt(x, z)); }
function waveBase(x, z, t) {
  return 0.55 * Math.sin(x * 0.045 + t * 0.9)
       + 0.45 * Math.sin(z * 0.06 - t * 1.1)
       + 0.30 * Math.sin((x + z) * 0.09 + t * 1.6)
       + 0.15 * Math.sin((x * 0.7 - z) * 0.17 - t * 2.1);
}

function updateOcean(t, cx, cz) {
  ocean.position.set(Math.round(cx / CELL) * CELL, 0, Math.round(cz / CELL) * CELL);
  const p = oceanGeo.attributes.position.array, c = oceanGeo.attributes.color.array;
  const ox = ocean.position.x, oz = ocean.position.z;
  for (let i = 0; i < p.length; i += 3) {
    const wx = oceanBase[i] + ox, wz = oceanBase[i + 2] + oz;
    const sh = shallowAt(wx, wz);
    const h = waveBase(wx, wz, t) * (1 - 0.6 * sh);
    p[i + 1] = h;
    const k = clamp((h + 1.45) / 2.9, 0, 1);
    let a, b, f;
    if (k < 0.72) { a = C_DEEP; b = C_MID; f = k / 0.72; } else { a = C_MID; b = C_CREST; f = (k - 0.72) / 0.28; }
    let r = a.r + (b.r - a.r) * f, g = a.g + (b.g - a.g) * f, bl = a.b + (b.b - a.b) * f;
    if (sh > 0.01) {
      const q = clamp((sh - 0.55) / 0.45, 0, 1), m = sh * 0.9;
      const sr = C_SHALLOW.r + (C_BEACH.r - C_SHALLOW.r) * q, sg = C_SHALLOW.g + (C_BEACH.g - C_SHALLOW.g) * q, sb = C_SHALLOW.b + (C_BEACH.b - C_SHALLOW.b) * q;
      r += (sr - r) * m; g += (sg - g) * m; bl += (sb - bl) * m;
    }
    c[i] = r; c[i + 1] = g; c[i + 2] = bl;
  }
  oceanGeo.attributes.position.needsUpdate = true;
  oceanGeo.attributes.color.needsUpdate = true;
}

function hullShape() {
  // drawn in (x, -z): bow points to +Z after rotation
  const s = new THREE.Shape();
  s.moveTo(-1.9, 6);
  s.lineTo(1.9, 6);
  s.lineTo(2.25, 1);
  s.quadraticCurveTo(2.25, -4.5, 0, -7.5);
  s.quadraticCurveTo(-2.25, -4.5, -2.25, 1);
  s.lineTo(-1.9, 6);

}
const HULL_GEO = new THREE.ExtrudeGeometry(hullShape(), { depth: 2.6, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.2, bevelSegments: 1, curveSegments: 10 })
  .rotateX(-Math.PI / 2).translate(0, -1.1, 0);
const STRIPE_GEO = new THREE.ExtrudeGeometry(hullShape(), { depth: 0.3, bevelEnabled: false, curveSegments: 10 })
  .rotateX(-Math.PI / 2).scale(1.09, 1, 1.04).translate(0, 0.95, 0);
const CANNON_GEO = new THREE.CylinderGeometry(0.2, 0.28, 1.4, 8).rotateZ(Math.PI / 2);

function sailGeo(w, h) {
  const g = new THREE.PlaneGeometry(w, h, 8, 4);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const nx = p.getX(i) / (w / 2), ny = p.getY(i) / (h / 2);
    p.setZ(i, (1 - nx * nx) * (1 - 0.3 * ny * ny) * h * 0.2);
  }
  g.computeVertexNormals();
  return g;
}

function buildShip(c, isPlayer, masts = 2) {
  const group = new THREE.Group();
  const M = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, flatShading: true, ...extra });
  const hullM = M(c.hull), deckM = M(0xa07a4c), trimM = M(c.trim, { roughness: 0.5, metalness: 0.3 });
  const woodM = M(0x4a2f1a), sailM = M(c.sail, { side: THREE.DoubleSide }), ironM = M(0x1d1d1d, { metalness: 0.7, roughness: 0.4 });

    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
    m.castShadow = true; m.receiveShadow = true;
    group.add(m); return m;
  };

  add(HULL_GEO, [deckM, hullM], 0, 0, 0);
  add(STRIPE_GEO, trimM, 0, 0, 0);
  // stern castle + forecastle
  add(new THREE.BoxGeometry(3.9, 1.4, 3.4), hullM, 0, 2.35, -4.4);
  add(new THREE.BoxGeometry(4.1, 0.18, 3.6), trimM, 0, 3.1, -4.4);
  add(new THREE.BoxGeometry(2.6, 0.5, 0.06), glowM, 0, 2.3, -6.12);
  add(new THREE.BoxGeometry(2.8, 0.7, 2.4), hullM, 0, 1.95, 4.4);
  // side rails
  add(new THREE.BoxGeometry(0.15, 0.45, 6.5), trimM, 2.1, 1.9, 0);
  add(new THREE.BoxGeometry(0.15, 0.45, 6.5), trimM, -2.1, 1.9, 0);
  // bowsprit
  add(new THREE.CylinderGeometry(0.1, 0.18, 5, 6), woodM, 0, 2.5, 8.6, Math.PI / 2 - 0.3);

  // masts, yards and sails
  const sails = [];
  const mast = (z, h, lower, upper) => {
    add(new THREE.CylinderGeometry(0.16, 0.26, h, 8), woodM, 0, 1.5 + h / 2, z);
    for (const [w, sh, top] of [lower, upper]) {
      add(new THREE.CylinderGeometry(0.08, 0.08, w + 0.6, 6), woodM, 0, top, z + 0.2, 0, 0, Math.PI / 2);
      const s = add(sailGeo(w, sh), sailM, 0, top - sh / 2, z + 0.35);
      sails.push({ mesh: s, top, h: sh });
    }
  };
  let mainZ = -1.4, mainH = 13.5;
  if (masts === 1) {
    mainZ = 0.6; mainH = 14;
    mast(mainZ, mainH, [8.0, 5.2, 8.2], [5.8, 3.6, 12.2]);
  } else if (masts === 3) {
    mainZ = 0.2;
    mast(3.6, 10.5, [5.0, 3.4, 6.2], [3.8, 2.7, 9.4]);
    mast(mainZ, mainH, [6.6, 4.4, 7.0], [5.0, 3.4, 11.2]);
    mast(-3.6, 10, [4.6, 3.0, 6.6], [3.4, 2.4, 9.2]);
  } else {
    mast(2.6, 11, [5.6, 3.8, 6.4], [4.2, 3.0, 10.0]);
    mast(mainZ, mainH, [6.6, 4.4, 7.0], [5.0, 3.4, 11.2]);
  }
  add(new THREE.CylinderGeometry(0.65, 0.5, 0.5, 10), woodM, 0, mainH - 1.2, mainZ);

  // flag
  const flagGeo = new THREE.PlaneGeometry(2.2, 1.45, 4, 1).translate(1.1, 0, 0);
  const flagM = isPlayer
    ? new THREE.MeshStandardMaterial({ map: JOLLY_ROGER, side: THREE.DoubleSide, roughness: 0.9 })
    : M(c.flag, { side: THREE.DoubleSide });
  const flag = add(flagGeo, flagM, 0, mainH + 0.8, mainZ, 0, Math.PI / 2, 0);
  return { group, sails, flag, ironM };
}

class Ship {
  constructor(o) {

            maxHp = 100, maxSpeed = 12, reloadTime = 2.6, aimErr = 0.08, turnRate = 0.55, dmg = 9, id, masts = 2, spread = 0.018 } = o;
    this.id = id || ('s' + (++shipSeq));

    this.isPlayer = kind === 'p';
    this.spread = spread;
    const b = buildShip(colors, this.isPlayer, masts);
    this.mesh = b.group; this.sails = b.sails; this.flag = b.flag; this.ironM = b.ironM;
    this.mesh.scale.setScalar(scale);
    this.cannonMeshes = [];
    this.setCannons(cannons);
    scene.add(this.mesh);
    this.pos = new THREE.Vector3(x, 0, z);
    this.heading = heading;
    this.speed = 0;
    this.sail = 2 / 3;
    this.sailVis = this.sail;
    this.steer = 0;
    this.reload = { port: 0, star: 0 };
    this.pitch = 0; this.roll = 0; this.rollKick = 0; this.rollKickV = 0;
    this.sinking = false; this.sinkT = 0; this.dead = false;
    this.fxT = 0; this.wakeT = 0; this.bumpCd = 0;
    this.prefRange = rand(45, 70);
    this.slowT = 0; this.burnT = 0; this.burnDps = 0; this.burnBy = null; this.boostT = 0; this.burnFx = 0;
    this.regen = 0; this.regenDelay = 6; this.lastHitT = -99; this.repairing = false;
    this.role = null; this.flank = Math.random() < 0.5 ? -1 : 1; this.slotOff = rand(-1.2, 1.2); this.losShift = 0;
    this.mortarT = rand(3, 6); this.reloadMul = 1; this.aground = false;
    this.remote = false; this.net = null; this.profile = null; this.lastHitBy = null;
    this.pid = ''; this.name = ''; this.tag = null;
  }
  setCannons(n) {
    for (const m of this.cannonMeshes) this.mesh.remove(m);
    this.cannonMeshes = [];
    this.cannonCount = n;
    this.cannonZ = CANNON_SETS[n] || Array.from({ length: n }, (_, i) => -5.2 + 8.6 * i / (n - 1));
    for (const cz of this.cannonZ) for (const sx of [2.45, -2.45]) {
      const m = new THREE.Mesh(CANNON_GEO, this.ironM);

  applyStats(prof) {

    const u = prof.up, b = SHIP_CLASSES[prof.design.cls];
    const newMax = b.hp + 30 * u.armor, gain = newMax - this.maxHp;
    this.maxHp = newMax;
    if (gain > 0) this.hp += gain;
    this.dmg = b.dmg + 2.5 * u.guns;
    this.reloadTime = b.reload * Math.pow(0.88, u.reload);
    this.maxSpeed = b.speed * (1 + 0.1 * u.sails);
    this.turnRate = b.turn * (1 + 0.1 * u.sails);
    this.spread = b.spread;
    // auto-repair: a full hull takes the class repair time (bigger ships take longer); carpenters speed it up
    this.regen = (this.maxHp / b.repairTime) * (1 + 0.3 * u.carpenters);

  update(dt, t) {

      this.roll += (this.sinkSide * 0.75 - this.roll) * dt * 0.4;
      this.pitch += (-0.3 - this.pitch) * dt * 0.3;

        fx.smoke(this.local(rand(-1.5, 1.5), 3, rand(-5, 5)), true);
      }
      if (this.sinkT > 9) this.remove();
      this.sync(t, dt);
      return;
    }

    if (this.remote) {
      // guest: chase the host's authoritative state (with dead reckoning between snapshots)
      const n = this.net;
      if (n) {
        n.x += Math.sin(n.h) * n.sp * dt; n.z += Math.cos(n.h) * n.sp * dt;
        if (Math.hypot(n.x - this.pos.x, n.z - this.pos.z) > 40) { this.pos.x = n.x; this.pos.z = n.z; this.heading = n.h; }

    // float on the waves: sample fore/aft and port/starboard
    const f = this.forward(), px = this.pos.x, pz = this.pos.z;
    const L = 6 * sc, W = 2.5 * sc;
    const hC = waveHeight(px, pz, t);
    const hF = waveHeight(px + f.x * L, pz + f.z * L, t), hB = waveHeight(px - f.x * L, pz - f.z * L, t);
    const hP = waveHeight(px + f.z * W, pz - f.x * W, t), hS = waveHeight(px - f.z * W, pz + f.x * W, t);
    const k = Math.min(1, dt * 3);
    this.pos.y += ((hC + hF + hB + hP + hS) / 5 - 0.1 - this.pos.y) * k;
    this.pitch += (Math.atan2(hB - hF, L * 2) - this.pitch) * k;
    const lean = -this.steer * (this.speed / this.maxSpeed) * 0.06;
    this.roll += (Math.atan2(hP - hS, W * 2) + lean - this.roll) * k;

    // broadside recoil spring
    this.rollKickV += (-this.rollKick * 14 - this.rollKickV * 2.5) * dt;
    this.rollKick += this.rollKickV * dt;

    // smoke when badly damaged
    this.fxT -= dt;
    if (this.hp < this.maxHp * 0.4 && this.fxT <= 0) {
      this.fxT = this.hp < this.maxHp * 0.2 ? 0.12 : 0.25;
      fx.smoke(this.local(rand(-1.2, 1.2), 2.2, rand(-4, 4)), true);
      if (this.hp < this.maxHp * 0.2) fx.fire(this.local(rand(-1, 1), 2, rand(-4, 4)));
    }
    // status effects
    this.burnFx -= dt;
    const blazing = this.burnT > 0 || this.role === 'fireship';
    if (this.burnFx <= 0 && (blazing || this.slowT > 0)) {
      this.burnFx = 0.07;
      if (blazing) { fx.fire(this.local(rand(-1.5, 1.5), 2.2, rand(-5, 5))); if (Math.random() < 0.4) fx.smoke(this.local(rand(-1, 1), 3, rand(-4, 4)), true); }
      if (this.slowT > 0 && Math.random() < 0.3) P({ pos: this.local(rand(-2, 2), rand(6, 11), rand(-3, 3)), vel: rv(1).setY(-1), color: 0xe8dcc0, size: 0.35, life: 1.2, gravity: 4, box: true });
    }
    if (this.boostT > 0 && this.wakeT <= 0 && Math.random() < 0.5) fx.wake(this.local(rand(-1, 1), 0.6, 7.5), rv(1.5).setY(rand(1.5, 3.5)), 0.4);
    // wake
    this.wakeT -= dt;
    if (this.speed > 2 && this.wakeT <= 0 && this.pos.distanceTo(focusPos()) < 170) {
      this.wakeT = 0.07;
      const sp = this.speed / this.maxSpeed;
      fx.wake(this.local(1.7, 0.3, -5.6), this.sideDir('port').multiplyScalar(1.5), sp);
      fx.wake(this.local(-1.7, 0.3, -5.6), this.sideDir('star').multiplyScalar(1.5), sp);
      if (this.speed > 7) fx.wake(this.local(rand(-1, 1), 0.4, 7), rv(1).setY(rand(1, 3)), sp);
    }
    this.sync(t, dt);
  }

  sync(t, dt) {
    this.mesh.position.copy(this.pos);
    this.mesh.rotation.set(this.pitch, this.heading, this.roll + this.rollKick, 'YXZ');
    this.sailVis += (this.sail - this.sailVis) * Math.min(1, dt * 2);
    const s = 0.18 + 0.82 * this.sailVis;
    for (const sl of this.sails) { sl.mesh.scale.y = s; sl.mesh.position.y = sl.top - sl.h * s / 2; }
    this.flag.rotation.y = Math.PI / 2 + Math.sin(t * 5 + this.pos.x) * 0.25;
    this.mesh.updateMatrixWorld();
  }

  fire(side, elev) {
    if (this.sinking || this.dead || this.reload[side] > 0) return false;
    const ammo = this.ammo || 'round';
    this.reload[side] = this.reloadTime * (AMMO[ammo].reload || 1);
    const sgn = side === 'port' ? 1 : -1;
    const order = [...this.cannonZ].sort(() => Math.random() - 0.5);
    order.forEach((cz, i) => after(i * 0.11 + rand(0, 0.05), () => this.fireCannon(side, sgn, cz, elev, ammo)));
    this.rollKickV -= 0.35 * sgn / this.scale;
    return true;
  }

  fireCannon(side, sgn, cz, elev, ammo = 'round') {
    if (this.sinking || this.dead) return;
    const muzzle = this.local(sgn * 3.15, 1.05, cz);
    const sd = this.sideDir(side);
    const dir = new THREE.Vector3(sd.x * Math.cos(elev), Math.sin(elev), sd.z * Math.cos(elev));
    dir.add(rv(this.spread)).normalize();
    const vel = dir.clone().multiplyScalar(BALL_SPEED).addScaledVector(this.forward(), this.speed);
    spawnBall(muzzle, vel, this, { dmg: this.dmg * AMMO[ammo].dmg, ammo });
    fx.muzzle(muzzle, dir);
    sfx('cannon', muzzle);
  }

  damage(amount, attacker, quiet = false) {
    if (this.sinking || this.dead || this.remote) return;
    this.hp -= amount;
    this.lastHitT = time;
    if (attacker) this.lastHitBy = attacker;
    if (this === me && !quiet) hurtFx();
    if (this.hp <= 0) { this.hp = 0; this.startSinking(); }
  }

  beginSinkFx() {
    this.sinking = true;
    this.sinkSide = Math.random() < 0.5 ? -1 : 1;
    this.sail = 0;
    fx.explosion(this.local(0, 2, 0), 2 * this.scale);
    sfx('hit', this.pos);
    removeTag(this);
  }
  startSinking() { this.beginSinkFx(); onShipSunk(this); }

  remove() {
    this.dead = true;
    scene.remove(this.mesh);
    this.mesh.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { if (m.map !== JOLLY_ROGER) m.dispose(); }); });
    removeTag(this);
  }
}

//  Islands and forts
// ============================================================
class Fort {
  constructor(isl, idx, R) {
    this.id = 'f' + idx; this.kind = 'f'; this.isPlayer = false;
    this.isl = isl; this.x = isl.x; this.z = isl.z; this.R = R;
    this.maxHp = 220; this.hp = this.maxHp;
    this.destroyed = false; this.rebuildT = 0;
    this.reload = rand(1, 3); this.aim = 0; this.fxT = 0; this.tag = null;

    const M = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.95, flatShading: true });
    const stone = M(0x9a948a), dark = M(0x6d6860), roof = M(0x8b2e1e), iron = M(0x1d1d1d);
    const root = new THREE.Group(); root.position.set(this.x, 0, this.z);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(R, R + 0.6, 5.2, 12), stone);
    base.position.y = 3.8;
    root.add(base);
    const top = new THREE.Group(); root.add(top);
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2;
      const c = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1, 0.8), stone);
      c.position.set(Math.sin(a) * (R - 0.4), 6.9, Math.cos(a) * (R - 0.4)); c.rotation.y = a;
      top.add(c);
    }
    const tower = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.8, 7, 10), dark); tower.position.y = 9.9; top.add(tower);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(3.2, 3, 10), roof); cone.position.y = 14.9; top.add(cone);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3), dark); pole.position.y = 17.6; top.add(pole);
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.2).translate(1, 0, 0), new THREE.MeshStandardMaterial({ color: 0xc01818, side: THREE.DoubleSide }));
    flag.position.y = 18.4; top.add(flag);
    const turret = new THREE.Group(); turret.position.y = 6.7; top.add(turret);
    for (const o of [-0.22, 0, 0.22]) {
      const gun = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2.2, 8).rotateX(Math.PI / 2), iron);
      gun.position.set(Math.sin(o) * (R - 0.2), 0.4, Math.cos(o) * (R - 0.2)); gun.rotation.y = o;
      turret.add(gun);
    }
    root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(root);
    this.top = top; this.turret = turret; this.flagMesh = flag;
  }
  hit(p) {
    if (this.destroyed || p.y < 0 || p.y > 15) return false;
    const d = Math.hypot(p.x - this.x, p.z - this.z);
    return p.y > 7.2 ? d < 3 : d < this.R + 0.6;
  }
  setDestroyed(v) {
    if (v && !this.destroyed) {
      const c = new THREE.Vector3(this.x, 8, this.z);
      fx.explosion(c, 3); sfx('hit', c); sfx('thud', c);
      removeTag(this);
    }
    this.destroyed = v;
  }
  reset() { this.hp = this.maxHp; this.destroyed = false; this.top.position.y = 0; this.reload = rand(1, 3); removeTag(this); }
  damage(amount, attacker) {
    if (this.destroyed || net.mode === 'guest') return;
    this.hp -= amount;
    if (this.hp <= 0) {
      this.hp = 0;
      this.setDestroyed(true);
      this.rebuildT = 150;
      const prof = attacker && attacker.profile;
      if (prof) { giveGold(prof, 300); notify('Fort destroyed! +300 gold', prof); }
    }
  }
  update(dt, t, host) {
    const tp = this.top.position;
    tp.y += clamp((this.destroyed ? -13 : 0) - tp.y, -dt * 5, dt * 4);
    if (this.destroyed && tp.y > -12) {
      this.fxT -= dt;
      if (this.fxT <= 0) {
        this.fxT = 0.1;
        const p = new THREE.Vector3(this.x + rand(-this.R, this.R), 7, this.z + rand(-this.R, this.R));
        fx.smoke(p, true); fx.dust(p);
      }
    }
    this.turret.rotation.y += angDiff(this.aim, this.turret.rotation.y) * Math.min(1, dt * 3);
    this.flagMesh.rotation.y = Math.sin(t * 4 + this.x) * 0.3;
    if (!host || !gameActive) return;
    if (this.destroyed) {
      this.rebuildT -= dt;
      if (this.rebuildT <= 0) { this.destroyed = false; this.hp = this.maxHp; }
      return;
    }
    const tgt = nearestPlayerShip(this.x, this.z, 140);
    if (!tgt) return;
    this.aim = Math.atan2(tgt.pos.x - this.x, tgt.pos.z - this.z);
    this.reload -= dt;
    if (this.reload <= 0 && Math.abs(angDiff(this.aim, this.turret.rotation.y)) < 0.15) {
      this.reload = 3.2;
      this.shoot(tgt, 0);
      after(0.3, () => { if (!this.destroyed && isAlive(tgt)) this.shoot(tgt, 1); });
    }
  }
  shoot(tgt, i) {
    const a = this.aim + (i - 0.5) * 0.04;
    const from = new THREE.Vector3(this.x + Math.sin(a) * (this.R + 1), 7.1, this.z + Math.cos(a) * (this.R + 1));
    const tf = tgt.forward();
    const tF = Math.hypot(tgt.pos.x - from.x, tgt.pos.z - from.z) / (BALL_SPEED * 0.9);
    const tx = tgt.pos.x + tf.x * tgt.speed * tF, tz = tgt.pos.z + tf.z * tgt.speed * tF;
    const d = Math.hypot(tx - from.x, tz - from.z), y = 1 - from.y, v2 = BALL_SPEED * BALL_SPEED;
    const disc = v2 * v2 - G * (G * d * d + 2 * y * v2);
    if (disc < 0) return;
    const th = Math.atan((v2 - Math.sqrt(disc)) / (G * d)) + rand(-0.015, 0.015);
    const az = Math.atan2(tx - from.x, tz - from.z) + rand(-0.015, 0.015);
    const vel = new THREE.Vector3(Math.sin(az) * Math.cos(th), Math.sin(th), Math.cos(az) * Math.cos(th)).multiplyScalar(BALL_SPEED);
    spawnBall(from, vel, this, { dmg: 10 + 0.5 * wave });
    fx.muzzle(from, vel.clone().normalize());
    sfx('cannon', from);
  }
}

const reefs = [];
function buildIslands() {
  const rng = mulberry32(2024);
  const M = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.95, flatShading: true });
  const sandM = M(0xe6cf8f), grassM = M(0x3f8f3a), darkGrassM = M(0x2f7535), rockM = M(0x7a7a72), cliffM = M(0x8d877b);
  const trunkM = M(0x7a5532), leafM = M(0x2f7d2a), woodM = M(0x6b4a2b), roofM = M(0x9a6b3a), reefRockM = M(0x5d6660);
  const specs = [];
  const fits = (x, z, r, pad) => !specs.some(o => Math.hypot(o.x - x, o.z - z) < o.r + r + pad) && !reefs.some(o => Math.hypot(o.x - x, o.z - z) < o.r + r + 25);
  // inner archipelago near the start: channels and tall rocks to duck behind
  for (let i = 0; i < 9; i++) for (let k = 0; k < 40; k++) {
    const a = i / 9 * Math.PI * 2 + rng() * 0.5, d = 120 + rng() * 200, r = 7 + rng() * 13;
    const x = Math.sin(a) * d, z = Math.cos(a) * d;
    if (fits(x, z, r, 45)) { specs.push({ x, z, r, kind: rng() < 0.45 ? 'tall' : 'hill' }); break; }
  }
  // outer islands; a few carry forts
  let forts_ = 0;
  for (let i = 0; i < 18; i++) for (let k = 0; k < 40; k++) {
    const x = (rng() - 0.5) * 1300, z = (rng() - 0.5) * 1300, r = 9 + rng() * 18;
    if (Math.hypot(x, z) < 340 || !fits(x, z, r, 70)) continue;
    const fort = forts_ < 5 && i % 3 === 1 && r > 11;
    if (fort) forts_++;
    specs.push({ x, z, r, kind: fort ? 'fort' : rng() < 0.3 ? 'tall' : 'hill' });
    break;
  }
  // open-water reefs: no land, but too shallow for deep hulls
  for (let i = 0; i < 8; i++) for (let k = 0; k < 40; k++) {
    const a = rng() * Math.PI * 2, d = 110 + rng() * 480, r = 20 + rng() * 20;
    const x = Math.sin(a) * d, z = Math.cos(a) * d;
    if (fits(x, z, r, 30)) { reefs.push({ x, z, r }); break; }
  }

  const jitter = (geo, amt, keepTop) => {
    const p = geo.attributes.position;
    const top = Math.max(...Array.from({ length: p.count }, (_, i) => p.getY(i)));
    for (let i = 0; i < p.count; i++) if (!keepTop || p.getY(i) < top - 0.01) { p.setX(i, p.getX(i) * (1 - amt + rng() * amt * 2)); p.setZ(i, p.getZ(i) * (1 - amt + rng() * amt * 2)); }
    geo.computeVertexNormals();
    return geo;
  };
  for (const sp of specs) {
    const { x, z, r, kind } = sp;
    const g = new THREE.Group(); g.position.set(x, 0, z);
    const sand = new THREE.Mesh(jitter(new THREE.CylinderGeometry(r * 1.05, r * 1.35, 3, 16), 0.08, false), sandM);
    sand.position.y = -0.4;
    g.add(sand);
    let hh = 1;
    if (kind === 'fort') {
      const plateau = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.9, r * 0.98, 1.2, 14), grassM);
      plateau.position.y = 1.4;
      g.add(plateau);
    } else if (kind === 'tall') {
      // craggy mountain: grassy skirt with a rocky peak — tall enough to hide a ship behind
      hh = r * (1.4 + rng() * 0.7);
      const skirt = new THREE.Mesh(jitter(new THREE.ConeGeometry(r * 0.9, hh * 0.45, 11, 2), 0.12, true), darkGrassM);
      skirt.position.y = 1 + hh * 0.225;
      const peak = new THREE.Mesh(jitter(new THREE.ConeGeometry(r * 0.62, hh, 9, 4), 0.22, true), cliffM);
      peak.position.set(rng() * 2 - 1, 1 + hh / 2, rng() * 2 - 1);
      g.add(skirt, peak);
    } else {
      hh = r * (0.5 + rng() * 0.45);
      const hill = new THREE.Mesh(jitter(new THREE.ConeGeometry(r * 0.82, hh, 10, 3), 0.15, true), grassM);
      hill.position.y = 1 + hh / 2;
      g.add(hill);
      if (rng() < 0.45) {   // fisherman's hut
        const a = rng() * Math.PI * 2, hut = new THREE.Group();
        hut.position.set(Math.sin(a) * r * 0.75, 1.1, Math.cos(a) * r * 0.75); hut.rotation.y = a;
        const body = new THREE.Mesh(new THREE.BoxGeometry(3, 2.2, 3), woodM); body.position.y = 1.1;
        const roof = new THREE.Mesh(new THREE.ConeGeometry(2.6, 1.8, 4), roofM); roof.position.y = 3.1; roof.rotation.y = Math.PI / 4;
        hut.add(body, roof); g.add(hut);
      }
    }
    for (let i = 0, nr = 4 + Math.floor(rng() * 4); i < nr; i++) {
      const a = rng() * Math.PI * 2, rs = r * (0.12 + rng() * 0.2), d = r * (1.05 + rng() * 0.35);
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(rs, 0), rockM);
      rock.position.set(Math.sin(a) * d, 0.2, Math.cos(a) * d);
      rock.rotation.set(rng() * 3, rng() * 3, rng() * 3);
      g.add(rock);
    }
    const palms = kind === 'tall' ? 1 + Math.floor(rng() * 2) : 2 + Math.floor(rng() * 3);
    for (let i = 0; i < palms; i++) {
      const a = rng() * Math.PI * 2;
      const palm = new THREE.Group();
      palm.position.set(Math.sin(a) * r * 0.9, 1, Math.cos(a) * r * 0.9);
      palm.rotation.set((rng() - 0.5) * 0.4, rng() * 6, (rng() - 0.5) * 0.4);
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 7, 6), trunkM); trunk.position.y = 3.5;
      palm.add(trunk);
      for (let k = 0; k < 6; k++) {
        const la = k / 6 * Math.PI * 2;
        const leaf = new THREE.Mesh(new THREE.BoxGeometry(1, 0.1, 3.8), leafM);
        leaf.position.set(Math.sin(la) * 1.6, 7, Math.cos(la) * 1.6);
        leaf.rotation.set(0.45, la, 0, 'YXZ');
        palm.add(leaf);
      }
      g.add(palm);
    }
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(g);
    const isl = { x, z, r: r * 1.2, h: kind === 'fort' ? 2 : hh + 1, kind };
    isl.shallowR = isl.r + 14 + isl.r * 0.6;
    islands.push(isl);
    paintShallow(x, z, isl.r, isl.shallowR, 1);
    if (kind === 'fort') forts.push(new Fort(isl, forts.length, clamp(r * 0.55, 5.5, 9)));
  }
  // reefs: a few overlapping shallow blobs and rocks breaking the surface
  for (const rf of reefs) {
    for (let b = 0; b < 4; b++) {
      const a = rng() * Math.PI * 2, o = rng() * rf.r * 0.4, rr = rf.r * (0.55 + rng() * 0.3);
      paintShallow(rf.x + Math.sin(a) * o, rf.z + Math.cos(a) * o, rr * 0.6, rr + 10, 0.85);
    }
    rf.rocks = [];
    for (let i = 0, n = 10 + Math.floor(rng() * 8); i < n; i++) {
      const a = rng() * Math.PI * 2, d = Math.sqrt(rng()) * rf.r * 0.9;
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7 + rng() * 1.6, 0), reefRockM);
      rock.position.set(rf.x + Math.sin(a) * d, -0.2 + rng() * 0.7, rf.z + Math.cos(a) * d);
      rf.rocks.push([rock.position.x, rock.position.z]);
      rock.rotation.set(rng() * 3, rng() * 3, rng() * 3);
      rock.castShadow = true;
      scene.add(rock);
    }
  }
}
buildIslands();

// Pre-render a chart of the sea from the real terrain: depth shading from the shallow-water
// field, then beaches, grass, rocky peaks and reef rocks drawn on top.
const CHART_PX = SH_N * 2;
const chart = (() => {
  const lo = document.createElement('canvas'); lo.width = lo.height = SH_N;
  const lctx = lo.getContext('2d'), img = lctx.createImageData(SH_N, SH_N);
  const deep = [14, 62, 104], shal = [60, 200, 192], beach = [166, 230, 207];
  for (let k = 0; k < SH_N * SH_N; k++) {
    const sh = shallowGrid[k], q = clamp((sh - 0.55) / 0.45, 0, 1);
    for (let c = 0; c < 3; c++) {
      const sc = shal[c] + (beach[c] - shal[c]) * q;
      img.data[k * 4 + c] = deep[c] + (sc - deep[c]) * Math.min(1, sh * 1.15);
    }
    img.data[k * 4 + 3] = 255;
  }
  lctx.putImageData(img, 0, 0);
  const cv = document.createElement('canvas'); cv.width = cv.height = CHART_PX;
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = true;
  g.drawImage(lo, 0, 0, CHART_PX, CHART_PX);
  const k = CHART_PX / (SH_HALF * 2), P = (v) => (v + SH_HALF) * k;
  const disc = (x, z, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(P(x), P(z), Math.max(1, r * k), 0, Math.PI * 2); g.fill(); };
  for (const rf of reefs) {
    g.strokeStyle = 'rgba(166,230,207,.55)'; g.setLineDash([3, 3]); g.lineWidth = 1;
    g.beginPath(); g.arc(P(rf.x), P(rf.z), (rf.r + 4) * k, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
    for (const [x, z] of rf.rocks) disc(x, z, 1.6, '#3e4a46');
  }
  for (const isl of islands) {
    disc(isl.x, isl.z, isl.r, '#e6cf8f');
    if (isl.kind === 'tall') { disc(isl.x, isl.z, isl.r * 0.78, '#2f7535'); disc(isl.x, isl.z, isl.r * 0.5, '#8d877b'); disc(isl.x, isl.z, isl.r * 0.2, '#b8b2a6'); }
    else disc(isl.x, isl.z, isl.r * 0.75, '#3f8f3a');
    g.strokeStyle = 'rgba(60,40,20,.6)'; g.lineWidth = 1;
    g.beginPath(); g.arc(P(isl.x), P(isl.z), isl.r * k, 0, Math.PI * 2); g.stroke();
  }
  return cv;
})();

// Draw the chart plus live markers. h = heading that points "up" (minimap rotates with the ship).
function drawChart(ctx, W, cx, cz, S, h, rim) {
  const R = W / 2, cs = Math.cos(h), sn = Math.sin(h);
  const a = -S * cs, c = S * sn, b = -S * sn, d = -S * cs, e = R - a * cx - c * cz, f = R - b * cx - d * cz;
  const toScreen = (x, z) => [a * x + c * z + e, b * x + d * z + f];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0e3e68'; ctx.fillRect(0, 0, W, W);
  ctx.save();
  if (rim) { ctx.beginPath(); ctx.arc(R, R, R - 1, 0, Math.PI * 2); ctx.clip(); }
  ctx.setTransform(a, b, c, d, e, f);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(chart, -SH_HALF, -SH_HALF, SH_HALF * 2, SH_HALF * 2);
  // live markers are drawn in screen space so they stay crisp
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const fo of forts) {
    const [x, y] = toScreen(fo.x, fo.z);
    ctx.fillStyle = fo.destroyed ? '#666' : '#ff8a20'; ctx.strokeStyle = '#2a1606'; ctx.lineWidth = 1.5;
    ctx.fillRect(x - 4.5, y - 4.5, 9, 9); ctx.strokeRect(x - 4.5, y - 4.5, 9, 9);
  }
  ctx.fillStyle = '#ffd34d';
  for (const cr of crates) { const [x, y] = toScreen(cr.x, cr.z); ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#ff3020';
  for (const kg of kegs) { const [x, y] = toScreen(kg.x, kg.z); ctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
  const arrow = (s, col, size) => {
    const [x, y] = toScreen(s.pos.x, s.pos.z);
    const f = s.forward(), [tx, ty] = toScreen(s.pos.x + f.x, s.pos.z + f.z);
    const ang = Math.atan2(ty - y, tx - x);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(size, 0); ctx.lineTo(-size * 0.75, size * 0.6); ctx.lineTo(-size * 0.4, 0); ctx.lineTo(-size * 0.75, -size * 0.6); ctx.closePath();
    ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
    return [x, y];
  };
  const offscreen = [];
  for (const s of ships) {
    if (s === me || s.dead) continue;
    const col = s.sinking ? '#555' : s.kind === 'a' ? '#6fe07a' : s.kind === 'p' ? (gameMode === 'pvp' ? '#ff4a3a' : PLAYER_CSS[s.colorIdx % 4])
      : s.role === 'flag' ? '#ffc040' : s.role === 'fireship' ? '#ff9a20' : s.kind === 'b' ? '#ff2020' : '#ff4a3a';
    const [x, y] = arrow(s, col, s.kind === 'b' ? 9 : 5.5 * Math.max(0.85, s.scale));
    if (rim && Math.hypot(x - R, y - R) > R - 6 && teamOf(s) === 'E' && !s.sinking) offscreen.push([x, y, col]);
  }
  if (me) arrow(me, '#ffffff', 7.5);
  if (rim) {
    // range ring (about max cannon range) and markers on the rim for enemies beyond the map
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(R, R, 100 * S, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    for (const [x, y, col] of offscreen) {
      const ang = Math.atan2(y - R, x - R), px = R + Math.cos(ang) * (R - 7), py = R + Math.sin(ang) * (R - 7);
      ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-3, 4); ctx.lineTo(-3, -4); ctx.closePath();
      ctx.fillStyle = col; ctx.fill(); ctx.restore();
    }
  }
  ctx.restore();
}

const particles = [];
const P_GEO = new THREE.IcosahedronGeometry(1, 0);

function P({ pos, vel = new THREE.Vector3(), color, size = 0.5, life = 1, grow = 0, gravity = 0, drag = 0, opacity = 1, basic = false, box = false }) {
  if (particles.length > 900) return;
  const mat = basic
    ? new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false })
    : new THREE.MeshLambertMaterial({ color, transparent: true, opacity, depthWrite: false });
  const m = new THREE.Mesh(box ? BOX_GEO : P_GEO, mat);
  m.position.copy(pos);
  m.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
  m.scale.setScalar(size);
  scene.add(m);
  particles.push({ m, vel: vel.clone(), life, max: life, grow, gravity, drag, opacity, size, spin: box ? rand(-8, 8) : 0 });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.m); p.m.material.dispose();
      particles[i] = particles[particles.length - 1]; particles.pop();
      continue;
    }
    p.vel.y -= p.gravity * dt;
    if (p.drag) p.vel.multiplyScalar(Math.max(0, 1 - p.drag * dt));
    p.m.position.addScaledVector(p.vel, dt);
    p.size += p.grow * dt;
    p.m.scale.setScalar(Math.max(0.01, p.size));
    if (p.spin) { p.m.rotation.x += p.spin * dt; p.m.rotation.y += p.spin * dt * 0.7; }
    p.m.material.opacity = p.opacity * Math.min(1, (p.life / p.max) * 1.6);
  }
}
const fx = {
  muzzle(pos, dir) {

  },
  splash(pos) {

    for (let i = 0; i < 4; i++) P({ pos, vel: rv(1.5).setY(0.2), color: 0xe8f6ff, size: 0.6, life: 1.2, grow: 1.8, opacity: 0.6, basic: true });
  },

    for (let i = 0; i < 7 * scale; i++) P({ pos, vel: rv(2).addScaledVector(UP, rand(2, 5)), color: 0x3a3a3a, size: rand(0.8, 1.4) * scale, life: rand(1.5, 2.6), grow: 1.5, drag: 1, opacity: 0.8 });

  },
  dust(pos) {

  smoke(pos, dark) {

  },

function fxHit(p, sc = 1) {

// ============================================================
//  Cannonballs (and boss mortar shells)
// ============================================================
const balls = [];
const BALL_GEO = new THREE.SphereGeometry(0.3, 8, 6);
const BALL_MAT = new THREE.MeshStandardMaterial({ color: 0x151515, metalness: 0.6, roughness: 0.4 });
const AMMO_MATS = {
  chain: new THREE.MeshStandardMaterial({ color: 0x8fa3b5, metalness: 0.8, roughness: 0.3 }),
  fire: new THREE.MeshStandardMaterial({ color: 0xff7a10, emissive: 0xff5000, emissiveIntensity: 1.5 }),
  explosive: new THREE.MeshStandardMaterial({ color: 0x220a0a, emissive: 0xaa1010, emissiveIntensity: 0.8 }),
};
const AMMO_IDS = ['round', 'chain', 'fire', 'explosive'];
function spawnBall(pos, vel, owner, opts = {}) {
  const ammo = opts.ammo || 'round';
  const m = new THREE.Mesh(BALL_GEO, AMMO_MATS[ammo] || BALL_MAT);
  if (ammo === 'explosive') m.scale.setScalar(1.3);
  m.position.copy(pos);
  m.castShadow = true;
  if (opts.aoe) m.scale.setScalar(1.8);
  scene.add(m);
  balls.push({ m, vel, owner, life: 0, trailT: 0, dmg: opts.dmg || 10, aoe: opts.aoe || 0, ammo });
  emit(['b', r2(pos.x), r2(pos.y), r2(pos.z), r2(vel.x), r2(vel.y), r2(vel.z), owner ? owner.id : '', opts.aoe || 0, AMMO_IDS.indexOf(ammo)]);
}
function removeBall(i) { scene.remove(balls[i].m); balls[i] = balls[balls.length - 1]; balls.pop(); }
function hitShip(s, p) {
  const sc = s.scale;
  const dx = p.x - s.pos.x, dz = p.z - s.pos.z;
  if (dx * dx + dz * dz > 100 * sc * sc) return false;
  const ly = (p.y - s.pos.y) / sc;
  if (ly < -1.3 || ly > 3.4) return false;
  const c = Math.cos(s.heading), n = Math.sin(s.heading);
  const lx = (dx * c - dz * n) / sc, lz = (dx * n + dz * c) / sc;
  if (lz < -6.4 || lz > 7.6) return false;
  const halfW = lz > 1 ? 2.3 * Math.max(0.15, 1 - (lz - 1) / 6.6) : 2.3;
  return Math.abs(lx) < halfW + 0.35;
}
// special ammo effects on a hull hit (host only)
function shotEffects(b, s, p) {
  if (b.ammo === 'chain') s.slowT = 6;
  if (b.ammo === 'fire') { s.burnT = 5; s.burnDps = Math.max(s.burnDps || 0, b.dmg * 0.5); s.burnBy = b.owner; }
  if (b.ammo === 'explosive') {
    for (const o of ships) if (o !== s && canHit(b.owner, o) && Math.hypot(o.pos.x - p.x, o.pos.z - p.z) < 7 * o.scale) o.damage(b.dmg * 0.5, b.owner);
  }
}
function teamOf(s) { return s.kind === 'p' || s.kind === 'a' ? 'P' : 'E'; }
function canHit(owner, t) {
  if (!owner || t === owner || t.dead || t.sinking || t === menuShip) return false;
  if (teamOf(owner) !== teamOf(t)) return true;
  return gameMode === 'pvp' && owner.kind === 'p' && t.kind === 'p';
}
function updateBalls(dt, t, host) {
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.vel.y -= G * dt;
    b.m.position.addScaledVector(b.vel, dt);
    b.life += dt;
    b.trailT -= dt;
    if (b.trailT <= 0) { b.trailT = 0.04; b.ammo === 'fire' ? fx.fire(b.m.position) : fx.trail(b.m.position); }
    const p = b.m.position;
    let done = false;
    if (host && !b.aoe) {
      for (const s of ships) {
        if (canHit(b.owner, s) && hitShip(s, p)) {
          s.damage(b.dmg, b.owner);
          shotEffects(b, s, p);
          fxHit(p, b.ammo === 'explosive' ? 1.6 : 1);
          if (b.owner.kind === 'p' && b.owner.profile) notify('Direct hit!', b.owner.profile);
          done = true; break;
        }
      }
      if (!done && b.owner && b.owner.kind === 'p') {
        for (const f of forts) if (f.hit(p)) {
          f.damage(b.dmg, b.owner);
          fxHit(p, 1);
          if (b.owner.profile) notify('Fort hit!', b.owner.profile);
          done = true; break;
        }
      }
    }
    if (!done) {
      for (const isl of islands) {
        if (b.owner && b.owner.isl === isl) continue;
        const d = Math.hypot(p.x - isl.x, p.z - isl.z);
        if (d < isl.r && p.y < isl.h * (1 - d / isl.r) + 1.5) { fx.dust(p.clone()); sfx('thud', p); done = true; break; }
      }
    }
    if (!done && p.y < waveHeight(p.x, p.z, t)) {
      if (b.aoe) {
        fx.explosion(p.clone(), 1.3); fx.splash(p.clone()); sfx('hit', p);
        if (host) for (const s of ships) {
          if (canHit(b.owner, s) && Math.hypot(s.pos.x - p.x, s.pos.z - p.z) < b.aoe + 3 * s.scale) s.damage(b.dmg, b.owner);
        }
      } else { fx.splash(p.clone()); sfx('splash', p); }
      done = true;
    }
    if (done || b.life > 8) removeBall(i);
  }
}

const warnings = [];

const crates = [];

const BARREL_GEO = new THREE.CylinderGeometry(0.7, 0.7, 1.6, 10).rotateX(Math.PI / 2);

const kegs = [];
let kegSeq = 0;
const KEG_GEO = new THREE.CylinderGeometry(0.65, 0.65, 1.3, 10);
const KEG_MAT = new THREE.MeshStandardMaterial({ color: 0x5a1a10, roughness: 0.8, emissive: 0xff2000, emissiveIntensity: 0.2 });
function addKeg(id, x, z, owner, dmg) {

function updateKegs(dt, t, host) {

    if (boom) {

function updateCrates(dt, t, host) {
  for (let i = crates.length - 1; i >= 0; i--) {
    const c = crates[i];
    c.m.position.set(c.x, waveHeight(c.x, c.z, t) + 0.1, c.z);
    c.m.rotation.set(Math.sin(t + c.seed) * 0.3, t * 0.4 + c.seed, Math.cos(t * 1.3 + c.seed) * 0.3);
    if (!host) continue;
    c.life -= dt;
    let take = false;
    for (const prof of profiles.values()) {
      const s = prof.ship;
      if (isAlive(s) && Math.hypot(c.x - s.pos.x, c.z - s.pos.z) < 7) {
        s.hp = Math.min(s.maxHp, s.hp + 15);
        notify('+15 hull repaired', prof);
        sfxFor('pickup', prof);
        take = true; break;
      }
    }
    if (take || c.life <= 0) { scene.remove(c.m); crates.splice(i, 1); }
